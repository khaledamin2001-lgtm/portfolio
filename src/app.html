<title>Khaled Portfolio Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap">
<style>
:root{
  /* Apple-style system: SF (the system font on iPhone and Mac) for everything, quiet greys, one blue accent, green / red
     only for gains and losses, soft depth instead of borders. Dark mode is true black with raised grey cards. */
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F5F5F7; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --ink:#1D1D1F; --ink-2:#424245; --ink-3:#6E6E73;
  --rule:#D2D2D7; --grid:#E8E8ED; --hair:rgba(0,0,0,.06); --accent:#0071E3; --accent-ink:#FFFFFF; --accent-soft:#E8F1FD;
  --s1:#0071E3; --s2:#FF9500; --s3:#34C759; --pos:#1A7F37; --neg:#D70015; --warn:#B25000;
  --pos-bg:#E4F5E9; --neg-bg:#FDE9EB; --warn-bg:#FFF2E0; --input:#FFFFFF; --input-rule:#D2D2D7;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --shadow-up:0 2px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08);
  --glass:rgba(242,242,247,.78);
  --r-card:18px; --r-ctl:10px;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"IBM Plex Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
    --ink:#F5F5F7; --ink-2:#C7C7CC; --ink-3:#98989D;
    --rule:#38383A; --grid:#2C2C2E; --hair:rgba(255,255,255,.07); --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0B2A4C;
    --s1:#0A84FF; --s2:#FF9F0A; --s3:#30D158; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A;
    --pos-bg:#0F2E1A; --neg-bg:#3B1512; --warn-bg:#3A2A0C; --input:#1C1C1E; --input-rule:#3A3A3C;
    --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-up:0 8px 32px rgba(0,0,0,.6);
    --glass:rgba(22,22,24,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --ink:#F5F5F7; --ink-2:#C7C7CC; --ink-3:#98989D;
  --rule:#38383A; --grid:#2C2C2E; --hair:rgba(255,255,255,.07); --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0B2A4C;
  --s1:#0A84FF; --s2:#FF9F0A; --s3:#30D158; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A;
  --pos-bg:#0F2E1A; --neg-bg:#3B1512; --warn-bg:#3A2A0C; --input:#1C1C1E; --input-rule:#3A3A3C;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-up:0 8px 32px rgba(0,0,0,.6);
  --glass:rgba(22,22,24,.72);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
/* a quick, soft response on every control; nothing moves for people who ask for less motion */
button,.btn,.chip,nav.tabs button,.seg button,select,input,textarea{transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,border-color .18s ease,transform .12s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);border-radius:8px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:.5px solid var(--hair)}
/* the frosted glass sits on a layer behind the header: a blur on the header itself would trap the phone tab bar (fixed) inside it */
.mast::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.mast-in{max-width:1280px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
@media (max-width:600px){.mast-in{padding-inline:16px;gap:10px}}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:600 17px/1.1 var(--f-display);letter-spacing:-.022em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.pf-switch{position:relative;min-width:0}
.pf-title{font:600 17px/1.1 var(--f-display);letter-spacing:-.022em;white-space:nowrap;background:none;border:0;color:inherit;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.pf-title svg{width:14px;height:14px;opacity:.65;flex:none}
.pf-title:hover svg{opacity:1}
.pf-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:270px;background:var(--surface);border:.5px solid var(--hair);border-radius:14px;box-shadow:var(--shadow-up);padding:6px;display:flex;flex-direction:column;gap:2px}
.pf-menu[hidden]{display:none}   /* the class's display:flex would otherwise beat the hidden attribute (an empty white bar) */
.pf-menu a,.pf-menu button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--ink);font:500 14px/1.2 var(--f-ui);text-decoration:none;cursor:pointer;width:100%;box-sizing:border-box}
.pf-menu a:hover,.pf-menu button:hover{background:var(--fill)}
.pf-menu .cur{color:var(--accent)}
.pf-menu small{font:400 11px/1.2 var(--f-ui);color:var(--ink-3)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;background:var(--fill);padding:3px;border-radius:12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:6px 13px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center}
nav.tabs button svg,nav.tabs button .ts{display:none}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px var(--hair)}
@media (max-width:860px) and (min-width:601px){nav.tabs{margin:0 0 10px;width:100%}nav.tabs button{flex:1;justify-content:center}}
/* phones: an iOS tab bar fixed at the bottom of the screen, icon over a short label, frosted like the header */
@media (max-width:600px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;width:auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;
    padding:5px 2px calc(4px + env(safe-area-inset-bottom,0px));border-radius:0;overflow:visible;background:var(--glass);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--hair)}
  nav.tabs button{flex-direction:column;justify-content:center;gap:2px;padding:3px 0;border-radius:0;font-size:10px;font-weight:500;letter-spacing:.01em;color:var(--ink-3);min-height:48px}
  nav.tabs button svg{display:block;width:25px;height:25px}
  nav.tabs button .tl{display:none} nav.tabs button .ts{display:block}
  nav.tabs button[aria-selected="true"]{background:none;box-shadow:none;color:var(--accent);font-weight:600}
  nav.tabs button:active{transform:scale(.92)}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
/* phones: every tap target at least 40px tall */
@media (max-width:600px){.seg button,.btn,.subnav a,.pf-title,button.chip{min-height:40px}.subnav a{display:inline-flex;align-items:center}}

/* tape */
.tape{display:flex;gap:22px;overflow-x:auto;min-width:0;max-width:100%;padding-block:10px;border-bottom:.5px solid var(--rule);scrollbar-width:none;font-size:12.5px}
.tape::-webkit-scrollbar{display:none}
.tape .t{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.tape .t b{font:600 11px var(--f-ui);letter-spacing:.04em;color:var(--ink-3)}
.tape .t .num{font-weight:600}
.feedbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-block:8px 0;font-size:12.5px;flex-wrap:wrap}
.feedbar:empty{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)} .dot.err{background:var(--neg)}

/* period bar */
.period{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:18px 6px}
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px var(--hair)}
/* phones: one row that scrolls sideways, like an iOS segmented control too wide for the screen */
@media (max-width:600px){.period .seg{position:relative;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;scroll-snap-type:x proximity}.period .seg::-webkit-scrollbar{display:none}.period .seg button{flex:none;scroll-snap-align:center}}
.period label{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--input);border:1px solid var(--input-rule);border-radius:var(--r-ctl);padding:7px 10px;min-width:0}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=number]{font-variant-numeric:tabular-nums}
.period .label{font:700 26px/1.15 var(--f-display);letter-spacing:-.025em;margin-right:auto}
@media (max-width:600px){.period .label{font-size:24px;width:100%}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--fill);color:var(--ink-2);white-space:nowrap}
button.chip{border:0;font-family:inherit;cursor:pointer}
.chip[title],.pill[title]{cursor:help}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.ok{background:var(--pos-bg);color:var(--pos)} .chip.err{background:var(--neg-bg);color:var(--neg)}

/* layout */
section.view{display:grid;gap:18px;padding-top:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--surface);border:.5px solid var(--hair);border-radius:var(--r-card);padding:20px 22px;min-width:0;box-shadow:var(--shadow)}
@media (max-width:600px){.panel{padding:16px 15px;border-radius:16px}}
.panel h2{font:600 18px/1.3 var(--f-display);letter-spacing:-.02em}
.panel .sub{font-size:13px;color:var(--ink-3);margin-top:3px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:0;background:var(--surface);border:.5px solid var(--hair);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
/* hairlines between tiles (half on each side; the outer edge is clipped), so a row that is not full ends in plain card, not a grey gap */
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;align-content:start;box-shadow:0 0 0 .5px var(--grid)}
.kpi .v{font:600 28px/1.12 var(--f-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.025em}
/* phones: two tiles a row (the hero and a last odd tile take the full width), so the key numbers fit on one screen */
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));border-radius:16px}.kpi{padding:13px 14px}.kpi .v{font-size:22px}.kpi .d{font-size:12px}
  .kpis .kpi.hero{grid-column:1/-1}.kpi.hero .v{font-size:30px}
  .kpis:has(.kpi.hero)>.kpi:last-child:nth-child(even),.kpis:not(:has(.kpi.hero))>.kpi:last-child:nth-child(odd){grid-column:1/-1}}
.kpi .v small{font:500 13px var(--f-ui);color:var(--ink-3);margin-left:4px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.kpi.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 88%,#fff) 0%,var(--accent) 55%,color-mix(in srgb,var(--accent) 80%,#000) 100%);color:var(--accent-ink)}
.kpi.hero .eyebrow,.kpi.hero .d,.kpi.hero .v small{color:color-mix(in srgb,var(--accent-ink) 88%,transparent)}
.kpi.hero .pos,.kpi.hero .neg{color:var(--accent-ink)}

/* tables */
.tbl{overflow-x:auto;margin-inline:-4px;position:relative}
/* long tables (ledger, closed trades): a vertical scroll box of their own, so the sticky header row stays visible */
.tbl.tall{max-height:min(70vh,calc(100vh - var(--mast-h,0px) - 16px));overflow:auto}   /* never taller than the space under the sticky masthead */
.tbl.tall th{box-shadow:inset 0 -1px 0 var(--rule)}
/* the row label stays put while a wide table is swiped: first column sticky, on the table's own background, with a rule */
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--rule)}
/* phones: the sticky label column wraps at word breaks ("anywhere" let it shrink to one letter a line) and keeps room for a date */
@media (max-width:520px){.tbl th:first-child,.tbl td:first-child{min-width:108px;max-width:140px;white-space:normal;overflow-wrap:break-word}}
input:disabled,select:disabled,textarea:disabled{color:var(--ink-2);-webkit-text-fill-color:var(--ink-2)}
.tbl th:first-child{z-index:3}
.tbl tbody tr:hover td:first-child{background:var(--surface-2)}
/* a table wider than its box says so until it has been scrolled (class set by markScrollables) */
.tbl.can-scroll::after{content:"swipe →";position:sticky;left:calc(100% - 70px);display:inline-block;margin:6px 0 2px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-size:11px;letter-spacing:.04em;pointer-events:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:middle}
td.n,th.n{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--rule);border-bottom:0}
td.wrap{white-space:normal;min-width:180px;padding:8px 10px;margin:0;max-width:none}   /* not the page's .wrap container padding */
.sym{font:600 13px var(--f-ui);letter-spacing:.01em}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--s1)}
.wcell{display:flex;align-items:center;gap:8px}.wcell .bar{flex:1}.wcell .num{min-width:3.4em;text-align:right;font-size:12.5px}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.03em}
.pill.win{background:var(--pos-bg);color:var(--pos)} .pill.loss{background:var(--neg-bg);color:var(--neg)}
.pill.auto{background:var(--accent-soft);color:var(--accent)} .pill.man{background:var(--surface-2);color:var(--ink-2)} .pill.stale{background:var(--warn-bg);color:var(--warn)}
.pill.prov{background:var(--warn-bg);color:var(--warn)}

/* key-value lists */
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:13.5px}
.kv > div{padding:7px 0;border-bottom:1px solid var(--grid);display:contents}
.kv dt{padding:7px 0;border-bottom:1px solid var(--grid);color:var(--ink-2)}
.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv dt.total,.kv dd.total{border-top:1.5px solid var(--ink-2);border-bottom:3px double var(--ink-2);font-weight:700;color:var(--ink)}
.kv dt.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:14px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font:11px var(--f-ui);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);white-space:nowrap;z-index:5;transform:translate(-50%,-100%);transition:opacity .08s}
.tip b{font-weight:600}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:10px;height:10px;border-radius:2px}

/* forms & buttons */
/* buttons: grey-filled with blue text (iOS "tinted" style); primary is solid blue; a light press shrinks them a touch */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--fill);color:var(--accent);padding:8px 14px;border-radius:var(--r-ctl);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--fill-2)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 12px;align-items:end}
.form label{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.form input,.form select{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid-in input{width:100%;min-width:84px;padding:4px 7px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
.grid-in input.txt{text-align:left;min-width:140px}
.grid-in input.dirty{border-color:var(--accent);background:var(--accent-soft)}
td.in-cell{padding:4px 6px}
input.inp,.grid-in input{color:var(--accent)}
textarea{width:100%;min-height:130px;font:12.5px/1.5 var(--f-mono)}

/* checks */
.checks{display:grid;gap:0}
.check{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--grid)}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.check .ic.ok{background:var(--pos-bg);color:var(--pos)} .check .ic.warn{background:var(--warn-bg);color:var(--warn)} .check .ic.error{background:var(--neg-bg);color:var(--neg)}
.check .dt{font-size:12.5px;color:var(--ink-3);grid-column:2}
.prose{max-width:68ch;font-size:14px;color:var(--ink-2)}
.prose h3{font:600 15px var(--f-display);color:var(--ink);margin:18px 0 4px}
.prose p{margin:0 0 8px} .prose code{font:12.5px var(--f-mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}

<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

// ---------- formatting (CFI style: negatives in parentheses for money, signed % for returns) ----------
const nf = (dp) => new Intl.NumberFormat('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
function egp(x, dp=0){ if(x==null||!isFinite(x)) return '—'; const s = nf(dp).format(Math.abs(x)); return x < 0 && Math.abs(x) >= 0.5*Math.pow(10,-dp) ? `(${s})` : s; }
function pct(x, dp=1, signed=true){ if(x==null||!isFinite(x)) return '—'; const v = x*100; const s = nf(dp).format(Math.abs(v)); if(Math.abs(v) < 0.5*Math.pow(10,-dp)) return nf(dp).format(0)+'%'; return (v<0?'−':(signed?'+':''))+s+'%'; }
const sgn = (x) => x==null ? '' : x>0 ? 'pos' : x<0 ? 'neg' : '';
const num = (x, dp=2) => x==null||!isFinite(x) ? '—' : nf(dp).format(x);
const short = (x) => { if(x==null) return '—'; const a=Math.abs(x); const s = a>=1e6? (a/1e6).toFixed(a>=1e7?1:2)+'M' : a>=1e3? (a/1e3).toFixed(a>=1e5?0:1)+'k' : a.toFixed(0); return (x<0?'−':'')+s; };
// One date style everywhere: months "Sep 2026" (Ms = "Sep-26" only for chart axes), days "27 Sep 2026", times "8:38 PM Cairo".
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const M = (m) => { if(!m) return '—'; const [y,mm]=String(m).split('-'); return `${MON3[+mm-1]} ${y}`; };
const Ms = (m) => PE.fmtMonth(m);
const dfmt = (d) => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${+dd} ${MON3[+m-1]} ${y}`; };
const cairoAt = (iso) => { const t=new Date(iso); if(isNaN(t)) return '—'; return `${dfmt(new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(t))}, ${t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Africa/Cairo'})} Cairo`; };
// Engine-written text (period labels, check details) says "Sep-26" and "2026-09-27": rewrite it in the page's style.
const prose = (s) => String(s??'').replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)-(\d{2})\b/g,'$1 20$2').replace(/\b\d{4}-\d{2}-\d{2}\b/g,(x)=>dfmt(x));
const plabel = (s) => prose(s).replace(/(\d{4}) to (?=[A-Z])/,'$1 – ');   // "Aug-25 to Sep-26" -> "Aug 2025 – Sep 2026"
// The benchmark is a price index (no dividends) while the portfolio's return includes the dividends it received.
const BENCH = 'EGX30 Capped (price index)';
// Ratios from fewer than 12 monthly returns carry an "indicative" pill (engine flag st.smallSample; n < 12 when the engine has none).
const smallSample = (st) => !!(st && (st.smallSample ?? (st.n < 12)));
const IND = ' <span class="pill stale" data-testid="indicative" title="Fewer than 12 monthly returns in this period: read the ratio as a rough guide only">indicative</span>';

// ---------- state ----------
const S = {
  db:null, ready:{settings:false,marks:false,assets:false,ledger:false,market:false},
  settings:null, marks:{}, assets:{}, ledgerDocs:{}, market:null, history:{},
  tab: ls.get('pd.tab','overview'),
  sel: ls.get('pd.sel',{type:'Since Inception',asOf:null,from:null,to:null}),
  ledgerFilter: {q:'', type:'', year:'', src:''},
  R:null, // view-only unless this device has editing turned on for the open portfolio (site/lock.js pdCanEdit)
  get readOnly(){ return !(window.pdCanEdit && window.pdCanEdit()); }, set readOnly(v){}, bench:null, imports:{}, sync:null, stmt:{list:null, busy:false, error:null, review:null}, fsMonth:null, fallback:null, heads:null,
  D:undefined, exportsList:null,
};
if(location.hash && /^#[a-z]+$/.test(location.hash)) S.tab = location.hash.slice(1);

window.pdToast = (m, k) => toast(m, k);   // site/lock.js shows its notices through the page's toast
function toast(msg, kind){ const t=$('#toast'); t.textContent=msg; t.className='toast'+(kind?' '+kind:''); t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, Math.max(kind==='error'?6000:2800, 60*String(msg).length)); }
function errText(e){ const c=e&&e.code; if(c==='invalid_argument') return 'Saving was refused. You may only have view access to this page.'; if(c==='quota_exceeded') return 'The portfolio could not be saved (storage is full). Tell the site owner.'; if(c==='resource_exhausted') return 'Too many saves in a row. Wait a few seconds and try again.'; return 'Could not save: '+(e&&e.message||'unknown error')+'. Try again in a moment.'; }
async function save(fn, ok){ try{ await fn(); if(ok) toast(ok); document.querySelectorAll('#main .dirty').forEach(x=>x.classList.remove('dirty')); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); S.pending=false; renderTab(true); return true; }catch(e){ console.error(e); if(e&&e.code==='invalid_argument') S.readOnly=true; toast(errText(e),'error'); return false; } }

function allTx(){
  const years = Object.keys(S.ledgerDocs).sort();
  const out=[]; years.forEach(y => (S.ledgerDocs[y].rows||[]).forEach(r => out.push(r)));
  return out;
}
// dataset(true) swaps in month-close estimates for closed months that still have no statement (PA.estimateMarks: ledger cash +
// holdings × closing prices). The stored marks are never changed; the backup export uses dataset() and keeps them as typed.
function estMarks(){ try{ if(!S.history || !Object.keys(S.history).length) return S.marks; return PA.estimateMarks(S.settings, S.marks, PE.runLedger(allTx()), S.assets, pbook(), PE.cairoToday()); }catch(e){ console.error(e); return S.marks; } }
// bench rides along so the engine can read the index dividend yield (bench.divYield) for its "with dividends" estimate
function dataset(est){ return { settings:S.settings, marks: est ? estMarks() : S.marks, assets:S.assets, tx:allTx(), market:S.market, bench:S.bench }; }
function isReady(){ return S.ready.settings && S.ready.marks && S.ready.assets && S.ready.ledger; }

let raf=0;
function schedule(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(recompute); }
function recompute(){
  if(!isReady()) return;
  if(!S.settings){ renderEmpty(); return; }
  try{
    const pb = pbook(), today = PE.cairoToday();
    const led = PE.runLedger(allTx());
    const pricer = PA.makePricer(S.assets, led, pb);
    S.fallback = (name) => { const p = pricer(name, today); return p ? { p: p.p, d: pb.last } : null; };

const charts = [];

function niceTicks(min,max,count=5){ if(min===max){ max=min+1; } const span=max-min; const step0=span/count; const mag=Math.pow(10,Math.floor(Math.log10(step0))); const f=step0/mag; const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10)); return t; }

  const y=v=>padT+ih-(v-min)/(max-min)*ih;

  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/58))));
  let g=`<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img" aria-label="${esc(spec.title||'chart')}">`;
  ticks.forEach(t=>{ g+=`<line class="${t===0?'zero':'gl'}" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end">${esc(spec.yFmt(t,true))}</text>`; });
  labels.forEach((l,i)=>{ if(i%every===0 || (kind!=='bar'&&i===n-1&&n>1&&(n-1)%every>every/2)) g+=`<text x="${xC(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`; });
  if(kind==='bar'){
    const k=spec.series.length; const gap=2; const bw=Math.max(2,Math.min(26,(band*0.72-(k-1)*gap)/k));
    spec.series.forEach((s,si)=>{ s.values.forEach((v,i)=>{ if(v==null) return; const x0=xC(i)-(k*bw+(k-1)*gap)/2+si*(bw+gap); const y0=y(Math.max(0,v)), y1=y(Math.min(0,v)); const hh=Math.max(1,y1-y0); const col = s.colorFn? s.colorFn(v) : s.color; const r=Math.min(3,bw/2,hh);
      g+= v>=0 ? `<path d="M${x0},${y1} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${y1} Z" fill="${col}"/>` : `<path d="M${x0},${y0} V${y1-r} Q${x0},${y1} ${x0+r},${y1} H${x0+bw-r} Q${x0+bw},${y1} ${x0+bw},${y1-r} V${y0} Z" fill="${col}"/>`; }); });
  } else {
    spec.series.forEach(s=>{
      const pts=s.values.map((v,i)=>v==null?null:[xC(i),y(v)]);
      let d=''; pts.forEach((p,i)=>{ if(!p) return; d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); });
      if(s.area){ const f=pts.filter(Boolean); if(f.length) g+=`<path d="${d}L${f[f.length-1][0]},${y(Math.max(min,0))}L${f[0][0]},${y(Math.max(min,0))}Z" fill="${s.color}" opacity=".16"/>`; }
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      const last=pts.map((p,i)=>[p,i]).filter(x=>x[0]).pop(); if(last) g+=`<circle cx="${last[0][0]}" cy="${last[0][1]}" r="4" fill="${s.color}" stroke="${cssVar('--surface')}" stroke-width="2"/>`;
    });
  }
  g+=`<line id="${el.id}-x" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" stroke="${cssVar('--ink-3')}" stroke-dasharray="3 3" opacity="0"/>`;
  g+=`<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=g;

  const move=(ev)=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width; let i = kind==='bar'? Math.floor((px-padL)/band) : Math.round((px-padL)/(iw/Math.max(1,n-1))); i=Math.max(0,Math.min(n-1,i));
    const rows=spec.series.map(s=>{ const v=s.values[i]; return v==null?'':`<div><span class="sw" style="background:${s.colorFn?s.colorFn(v):s.color}"></span>${esc(s.name)} <b>${esc(spec.yFmt(v))}</b></div>`; }).join('');
    tip.innerHTML=`<div class="muted" style="color:inherit;opacity:.75">${esc(spec.tipLabel?spec.tipLabel(i):labels[i])}</div>${rows}${spec.tipExtra?spec.tipExtra(i):''}`; tip.hidden=false;
    const cx=xC(i)*r.width/W; tip.style.left=Math.max(70,Math.min(r.width-70,cx))+'px'; tip.style.top='6px'; tip.style.transform='translate(-50%,0)';
    xl.setAttribute('x1',xC(i)); xl.setAttribute('x2',xC(i)); xl.setAttribute('opacity','.8'); };
  const leave=()=>{ tip.hidden=true; xl.setAttribute('opacity','0'); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',leave); svg.addEventListener('pointerdown',move);
}
const C = { s1:()=>cssVar('--s1'), s2:()=>cssVar('--s2'), pos:()=>cssVar('--pos'), neg:()=>cssVar('--neg'), ink3:()=>cssVar('--ink-3') };

function dailyTwrOf(st){ if(st.twrDaily!==undefined) return st.twrDaily; try{ if(PA.dailyTwr && S.D){ const x=PA.dailyTwr(S.D, S.R.range); if(x&&x.twr!=null) return x.twr; } }catch(e){ console.error(e); } const ds=dailyS(); return ds?ds.twr:null; }

// Cash benchmark: each month's CBE policy rate (months[].cashRet), chained over the selected period
const CASH_NOTE = 'CBE policy rate — a proxy for what cash in a savings fund earns';

// Where a ledger row came from (same rule as the engine's R.provenance): Thndr statement, trade invoice, typed, or manual
const PROV = {statement:['Statement','win','Booked or confirmed from a Thndr statement'], invoice:['Invoice','auto','Booked from a Thndr trade invoice email'], typed:['Typed','man','Typed or copied in by hand (or from the workbook)'], manual:['Manual','stale','Entered as a manual correction']};

// Rows not confirmed by a statement: the engine's R.provenance.unverified, or the same rule here for an older engine
function unverifiedRows(){ const R=S.R; const tx=allTx(); const byId=new Map(tx.map(t=>[t.id,t]));
  if(R.provenance && Array.isArray(R.provenance.unverified)) return R.provenance.unverified.map(id=>byId.get(id)).filter(Boolean);
  const stm=new Set(Object.keys(S.marks||{}).filter(m=>(S.marks[m]||{}).source==='statement'));
  return tx.filter(t=>stm.has(String(t.d).slice(0,7)) && !['statement','invoice'].includes(provOf(t))); }
// Trading cost of one ledger row (engine r.cost; the same rule here for an older engine): commission = |amount| − price × shares
function costOf(r){ if(r.cost!=null) return r.cost; if((r.t!=='Buy'&&r.t!=='Sell')||r.acc==='MF'||r.p==null||r.q==null) return 0; const g=r.p*r.q; const c=r.t==='Buy'?Math.abs(r.amt)-g:g-r.amt; return Math.max(0,Math.round(c*100)/100); }
// ---------- freshness of the three scheduled jobs (Cairo time; EGX sessions run Sunday to Thursday) ----------
const JOB = { marketCutoffMin: 16*60, syncHours: 22 };   // market job 3:40 PM → counted from 4 PM; inbox checks 4:15, 6:15 and 11 PM → longest normal gap 17 h
function cairoParts(t){ const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).map(x=>[x.type,x.value])); return {wd:p.weekday, day:`${p.year}-${p.month}-${p.day}`, min:(+p.hour%24)*60+(+p.minute)}; }
const isSession = (day) => { const [y,m,d]=day.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay()<=4; };   // Sun(0)…Thu(4)
const dayBefore = (day) => { const [y,m,d]=day.split('-').map(Number); return new Date(Date.UTC(y,m-1,d-1)).toISOString().slice(0,10); };
// the latest EGX session day whose closing prices the market job should already have written
function lastSessionDay(now){ const c=cairoParts(now); let d=c.day; if(isSession(d)&&c.min>=JOB.marketCutoffMin) return d; d=dayBefore(d); while(!isSession(d)) d=dayBefore(d); return d; }
function jobsStatus(now=Date.now()){
  const m=S.market||{}, sy=S.sync; const mAt=m.jobAsOf||m.asOf||null;
  const market = mAt ? {at:mAt, ok: cairoParts(Date.parse(mAt)).day>=lastSessionDay(now)} : {at:null, ok:false};
  const sAt = sy ? ((sy.heartbeat&&sy.heartbeat.sync)||sy.lastRun||null) : null;
  const sync = !sy ? {at:null, ok:null, none:true} : sAt ? {at:sAt, ok:(now-Date.parse(sAt))/36e5<=JOB.syncHours} : {at:null, ok:false};
  const siteAt = window.pdDataAt ? window.pdDataAt() : null;
  const site = window.pdDataAt ? {at:siteAt, ok: siteAt ? !(window.pdDataStale && window.pdDataStale(siteAt, now)) : false} : {at:null, ok:null, page:true};
  return {market, sync, site};
}

// Plain-language summary of the selected period, for readers who don't want to decode the tiles.
function briefPanel(){
  const R=S.R, st=R.stats, rows=st.rows, last=rows[rows.length-1]; const cash=R.liveCash??R.settings.cash; const total=cash+R.pos.mvTotal;
  const c=contributors(); const s=[];
  const vsIdx = st.benchTwr!=null&&st.alpha!=null ? ` against <b>${pct(st.benchTwr)}</b> for EGX30 Capped, ${st.alpha>=0?'ahead of the index by':'behind the index by'} <b class="${sgn(st.alpha)}">${pct(Math.abs(st.alpha),1,false)}</b>` : ' (the EGX30 Capped return is incomplete for this period, so there is no index comparison)';
  s.push(`<b>${esc(st.label)}</b>: the portfolio returned <b class="${sgn(st.twr)}">${pct(st.twr)}</b>${vsIdx}${st.n>1?`, with ${st.posMonths} of ${st.n} months positive and a worst month of ${pct(st.worst.ret)} (${M(st.worst.month)})`:''}.`);
  const ahead=aheadOfCash(st);
  if(st.cashTwr!=null && ahead!=null) s.push(`<span data-testid="brief-cash">Cash at the central-bank rate would have returned ${pct(st.cashTwr)}; the portfolio is <b class="${sgn(ahead)}">${num(Math.abs(ahead)*100,1)} points ${ahead>=0?'ahead':'behind'}</b>.</span>`);
  // the latest-month sentence only when the period is longer than that month (a one-month period already said it above)
  if(rows.length>1) s.push(`${M(last.month)}${last.live?' so far':''}: <b class="${sgn(last.ret)}">${pct(last.ret)}</b>${last.bench!=null?` vs ${pct(last.bench)} for the index`:''}.`);
  s.push(`Today the portfolio is worth <b>${egp(total)} EGP</b>, of which ${egp(cash)} EGP is cash, across ${R.pos.open.length} positions; the largest is ${esc(R.conc.largest)} at ${pct(R.conc.largestWeight,1,false)}.`);
  if(c.length) s.push(`Since inception the biggest contributors are ${c.slice(0,3).map(x=>`${esc(x.sym)} +${egp(x.total)}`).join(', ')}${c.some(x=>x.total<0)?`; the biggest detractor is ${esc(c[c.length-1].sym)} −${egp(Math.abs(c[c.length-1].total))}`:''} (EGP, realized + unrealized + dividends).`);
  s.push(...moneyWeightedSentences(R));
  return `<div class="panel brief" data-testid="brief"><div class="eyebrow">In brief</div><p>${s.join(' ')} <a href="#analysis" data-go="analysis">Read the full review on the Analysis tab →</a></p></div>`;
}
// Heads-up list: ex-dividend dates, targets/stops hit and drawdown worked out live on the page (PA.headsUp, the same checks
// the inbox job runs), plus the inbox job's overdue-statement items (sync/state.digest) when there is an inbox job.
const HEADS = {exdiv:['Ex-dividend','auto'], target:['Target','win'], stop:['Stop','loss'], drawdown:['Drawdown','loss'], statement:['Statement','stale']};
function headsUp(){ const dg=S.sync&&S.sync.digest; const live=(S.heads&&S.heads.items)||[];
  const job=(dg&&Array.isArray(dg.items))?dg.items.filter(x=>x&&x.text&&(x.kind==='statement'||!S.heads)):[];
  const seen=new Set(), items=[...live,...job].filter(x=>x&&x.text&&!seen.has(x.key||x.text)&&seen.add(x.key||x.text)); if(!items.length) return '';
  return `<div class="panel" data-testid="heads-up"><div class="eyebrow">Heads-up <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· ${S.heads?'as of the latest prices':dg&&dg.at?esc(cairoAt(dg.at)):''}</span></div>
    <ul class="heads">${items.map(x=>{ const k=HEADS[x.kind]||['Note','man']; return `<li data-testid="heads-up-item"><span class="pill ${k[1]}">${k[0]}</span><span>${esc(x.text)}</span></li>`; }).join('')}</ul></div>`; }
// Calendar months covered by the selected period (used to decide whether an annual XIRR is meaningful).
function periodMonths(range){ const [y1,m1]=range.from.split('-').map(Number), [y2,m2]=range.to.split('-').map(Number); return (y2-y1)*12+(m2-m1)+1; }
// One sentence per basis: the money-weighted figure (annualized only for 12+ month periods), then the real time-weighted one.
function moneyWeightedSentences(R){
  const st=R.stats, out=[]; const pm=periodMonths(R.range);
  if(st.xirr!=null){ if(pm>=12) out.push(`Money-weighted, your own capital has compounded at ${pct(st.xirr)} a year.`); else if(st.mwrPeriod!=null) out.push(`Money-weighted, your own capital returned ${pct(st.mwrPeriod)} over the period.`); }
  const real = st.realTwr ?? st.realTwrPartial;
  if(real!=null) out.push(`After Egyptian inflation the portfolio's time-weighted return is ${pct(real)}${st.realThrough?` (through ${M(st.realThrough)})`:''}.`);
  return out;
}
function contributors(){ return S.R.pos.rows.filter(r=>r.bought>0).map(r=>({sym:r.symbol||r.name,name:r.name,total:r.total,status:r.status,realized:r.realized,unreal:r.unreal||0,divs:r.divs})).sort((a,b)=>b.total-a.total); }
function contributorsList(){ const c=contributors(); if(!c.length) return '<p class="note" style="margin-top:8px">No trades yet.</p>';
  const top=c.slice(0,4), bot=c.filter(x=>x.total<0).slice(-3).reverse();
  const li=(r)=>`<dt><span class="sym">${esc(r.sym)}</span> <span class="muted">${r.status==='Open'?'held':'closed'}</span></dt><dd class="${sgn(r.total)}">${egp(r.total)}</dd>`;
  return `<dl class="kv"><dt class="sec">Top contributors</dt><dd class="sec"></dd>${top.map(li).join('')}<dt class="sec">Detractors</dt><dd class="sec"></dd>${bot.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}</dl><p class="note" style="margin:8px 0 0">Realized + unrealized + dividends per stock, EGP.</p>`; }
function moversList(){ const rows=S.R.pos.open.filter(r=>r.chg!=null&&r.mv&&r.priceSource==='auto').map(r=>({sym:r.symbol||r.name,name:r.name,chg:r.chg/100,pl:r.mv-r.mv/(1+r.chg/100)})).sort((a,b)=>b.pl-a.pl);
  if(!rows.length) return '<p class="note" style="margin-top:8px">No session change data yet.</p>';
  const up=rows.filter(r=>r.pl>0).slice(0,3), dn=rows.filter(r=>r.pl<0).slice(-3).reverse(); const dp=dayPL();
  const li=(r)=>`<dt><span class="sym">${esc(r.sym)}</span></dt><dd class="${sgn(r.pl)}">${pct(r.chg,2)} <span class="muted">${egp(r.pl)}</span></dd>`;
  return `<dl class="kv"><dt class="sec">Gainers</dt><dd class="sec"></dd>${up.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}<dt class="sec">Decliners</dt><dd class="sec"></dd>${dn.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}<dt class="total">Session P/L</dt><dd class="total ${sgn(dp.pl)}">${egp(dp.pl)}</dd></dl>`; }
function rollForward(st){ return `<dl class="kv">
  <dt>Opening value · ${M(PE.addMonths(st.rows[0].month,-1))}</dt><dd>${egp(st.opening)}</dd>
  <dt>Plus: deposits</dt><dd>${egp(st.deposits)}</dd><dt>Less: withdrawals</dt><dd>${egp(-st.withdrawals)}</dd>
  <dt>Plus: investment gain</dt><dd class="${sgn(st.netGain)}">${egp(st.netGain)}</dd>
  <dt class="total">Closing value · ${M(st.rows[st.rows.length-1].month)}</dt><dd class="total">${egp(st.closing)}</dd></dl>
  <p class="note" style="margin:8px 0 0">EGP. Investment gain includes dividends of ${egp(st.dividends)}.</p>`; }
function sectorBars(){ const secs=S.R.sectors; if(!secs.length) return '<p class="muted">No open positions.</p>'; const max=secs[0].weight;
  return `<div style="display:grid;gap:10px">${secs.map(s=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center"><span>${esc(s.sector)}</span><span class="num"><b>${pct(s.weight,1,false)}</b> <span class="muted">${short(s.mv)}</span></span><div class="bar" style="grid-column:1/-1;height:8px"><i style="width:${(s.weight/max*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`; }

      ${c.withStop<c.openCount?`<p class="note" style="margin:10px 0 0">${c.openCount-c.withStop} positions have no stop loss. Add them under Settings → Inputs & settings to measure downside.</p>`:''}</div>

// ---------- notes, thesis and review dates on an asset (portfolio/assets.items[name].note / .thesis / .reviewOn) ----------
const NOTE_IC = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h6l3 3v8h-9z M9.5 2.5v3h3 M5.5 8.5h5 M5.5 11h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
const assetOf = (name) => (S.assets||{})[name] || {};
const reviewDue = (a) => !!(a && a.reviewOn && a.reviewOn <= S.R.today);
const noteBtn = (a, id) => (a.note||a.thesis) ? `<button type="button" class="nic" data-note-t="${id}" aria-expanded="false" aria-controls="${id}" aria-label="Read the note" title="Note" data-testid="note-toggle">${NOTE_IC}</button>` : '';
const duePill = (a) => reviewDue(a) ? ` <span class="pill stale" data-testid="review-due" title="Review date ${dfmt(a.reviewOn)} has passed: reread the thesis and decide whether to keep the position">review due</span>` : '';
function noteBody(a){ return `<div class="note-body">${a.note?`<div><b>Note</b> ${esc(a.note)}</div>`:''}${a.thesis?`<div><b>Thesis</b> ${esc(a.thesis)}</div>`:''}${a.reviewOn?`<div><b>Review on</b> ${dfmt(a.reviewOn)}${reviewDue(a)?' · due':''}</div>`:''}</div>`; }
// phones (≤ 520px): one card per open position instead of the 17-column table
function holdingCard(r,i){ const a=assetOf(r.name); const totPct = r.buyCost>0 ? r.total/r.buyCost : null;   // total P/L on everything ever paid for it (engine roi)
  return `<div class="hcard" data-testid="holding-card"><div class="hc-top"><div style="min-width:0"><span class="sym">${esc(r.symbol||'—')}</span>${noteBtn(a,'nt-c-'+i)}${duePill(a)}<div class="hc-name">${esc(r.name)}</div></div><div class="hc-v">${egp(r.mv)}<small>EGP</small></div></div>
    <div class="hc-row"><span>Weight<b>${pct(r.weight,1,false)}</b></span><span>Day<b class="${sgn(r.chg)}">${r.chg!=null?pct(r.chg/100,2):'—'}</b></span><span>Total P/L<b class="${sgn(r.total)}">${egp(r.total)}${totPct!=null?` <small class="muted" style="font-weight:500">${pct(totPct)}</small>`:''}</b></span></div>
    ${a.note||a.thesis?`<div id="nt-c-${i}" hidden data-testid="note-card">${noteBody(a)}</div>`:''}</div>`; }

// ---------- Watchlist: every asset marked watch plus every held stock, with valuation from the price job ----------
function watchRows(){ const q=(S.market&&S.market.quotes)||{}; const held=new Map(S.R.pos.open.map(r=>[r.name,r])); const out=[];
  Object.values(S.assets||{}).forEach(a=>{ const sym=(a.symbol||'').toUpperCase(); const h=held.get(a.name);
    const stock = sym && sym!=='SAVINGS' && sym!=='THNDRGOLD' && a.fund!==true;
    if(!(a.watch===true || (h && stock))) return;
    out.push({a, sym, q:q[sym]||null, held:h||null}); });
  return out.sort((x,y)=> (!!y.held-!!x.held) || ((y.held&&y.held.weight||0)-(x.held&&x.held.weight||0)) || (x.sym||x.a.name).localeCompare(y.sym||y.a.name)); }
function rangeBar(x){ const lo=x&&x.lo52, hi=x&&x.hi52, p=x&&x.price; if(lo==null||hi==null||p==null||!(hi>lo)) return '<span class="muted">—</span>';
  const at=Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100));
  return `<div class="rng-w" title="52-week low ${num(lo)} · high ${num(hi)} · now ${num(p)} (${at.toFixed(0)}% of the range)"><span class="num">${num(lo,lo<10?2:0)}</span><div class="rng"><i style="left:${at.toFixed(1)}%"></i></div><span class="num">${num(hi,hi<10?2:0)}</span></div>`; }
function vWatchlist(){
  const rows=watchRows(), ro=S.readOnly; const bn=(v)=>v==null?'—':num(v/1e9,v>=1e10?0:1);
  const ratio=(v)=>v==null||!isFinite(v)?'—':num(v,1)+'×', pc=(v)=>v==null||!isFinite(v)?'—':pct(v/100,1,false);
  return `<div class="panel" data-testid="watchlist"><div class="phead"><div><h2>Stocks you hold and watch</h2><div class="sub">Stocks you hold plus the ones you are watching · valuation from TradingView, refreshed with prices after each session</div></div>
    ${ro?'':`<form class="row" id="wl-form" data-testid="watchlist-add-form" autocomplete="off"><input type="text" id="wl-sym" class="inp" placeholder="Symbol, e.g. COMI" style="width:150px" data-testid="watchlist-add-input" aria-label="Symbol to watch"><button class="btn" type="submit" data-testid="watchlist-add">Add to watchlist</button></form>`}</div>
    ${rows.length?`<div class="tbl"><table data-testid="watchlist-table"><thead><tr><th>Stock</th><th class="n">Price</th><th class="n">Day</th><th class="n">P/E</th><th class="n">P/B</th><th class="n">ROE</th><th class="n">Div. yield</th><th class="n">Mkt cap, EGP bn</th><th>52-week range</th><th>Why I'm watching</th>${ro?'':'<th></th>'}</tr></thead><tbody>
    ${rows.map(({a,sym,q,held})=>`<tr data-testid="watchlist-row" data-sym="${esc(sym)}"><td><span class="sym">${esc(sym||'—')}</span>${held?' <span class="pill auto" title="In the portfolio now">held</span>':''}${duePill(a)}<div class="muted" style="font-size:11.5px;line-height:1.3;max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${esc(a.name)}">${esc(a.name)}</div></td>
      <td class="n">${q&&q.price!=null?num(q.price):'—'}</td><td class="n ${sgn(q&&q.chg)}">${q&&q.chg!=null?pct(q.chg/100,2):'—'}</td><td class="n">${ratio(q&&q.pe)}</td><td class="n">${ratio(q&&q.pb)}</td><td class="n">${pc(q&&q.roe)}</td><td class="n">${pc(q&&q.dy)}</td><td class="n">${bn(q&&q.mcap)}</td><td>${rangeBar(q)}</td>
      <td class="wrap">${a.note?esc(a.note):'<span class="muted">—</span>'}</td>${ro?'':`<td>${a.watch===true?`<button class="btn sm" data-unwatch="${esc(a.name)}" data-testid="watchlist-remove" title="Stop watching (the asset itself is kept)">Remove</button>`:''}</td>`}</tr>`).join('')}
    </tbody></table></div>`:'<p class="muted">Nothing on the watchlist yet.</p>'}
    <p class="note" style="margin:10px 0 0">P/E on the last 12 months' earnings, P/B on the latest quarter, ROE and dividend yield in %. Write the reason you watch or hold a stock in its Note (Settings → Inputs &amp; settings → Assets &amp; prices).</p></div>`;
}

    <div data-testid="gross-tile" style="display:contents">${kpi('Return before trading costs', st.twrGross!=null?`<span class="${sgn(st.twrGross)}">${pct(st.twrGross)}</span>`:'—', st.tradingCost!=null?`Trading costs ${egp(st.tradingCost)} EGP (${pct(st.costPct,2,false)} of value traded) · approximate`:'commission on each buy and sell')}</div>

function rets(st,k){ const v=st.rows.map(r=>r[k]).filter(x=>x!=null); return v.reduce((a,b)=>a+b,0)/Math.max(1,v.length); }

// ---------- Closed trades ----------

function normTx(o){
  const t = PE.TYPES.find(x=>x.toLowerCase()===String(o.t||'').trim().toLowerCase()); if(!t) throw new Error(`Unknown type "${o.t}"`);
  const d = parseDate(o.d); if(!d) throw new Error(`Unreadable date "${o.d}"`);
  // Bonus shares are free: the amount is always 0 (an empty amount is accepted), only the asset and the share count matter.
  const amt = t==='Bonus' ? 0 : Math.abs(parseFloat(String(o.amt).replace(/[, ]/g,''))); if(!isFinite(amt)) throw new Error(`Unreadable amount "${o.amt}"`);
  const r={id:newId(), d, t, amt: SIGN[t]*amt || 0};
  const a=String(o.a||'').trim(); if(a) r.a=a;
  const q=parseFloat(String(o.q??'').replace(/[, ]/g,'')); if(isFinite(q)&&q>0) r.q=q;
  const p=parseFloat(String(o.p??'').replace(/[, ]/g,'')); if(isFinite(p)&&p>0) r.p=p;
  if((t==='Buy'||t==='Sell'||t==='Bonus')&&(!r.a||!r.q)) throw new Error(`${t} on ${d} needs an asset and shares`);
  r.acc = String(o.acc||'Main').trim()||'Main';
  return r;
}
function parseDate(s){ s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null; }
function parseCsv(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const split=(l)=>{ const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; } else if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); };
  let start=0; const h=split(lines[0]).map(s=>s.toLowerCase()); let idx={d:0,t:1,a:2,q:3,p:4,amt:5,acc:6};
  if(h.includes('date')){ start=1; const f=(...n)=>h.findIndex(x=>n.some(k=>x.startsWith(k))); idx={d:f('date'),t:f('type'),a:f('asset','name','security'),q:f('shares','quantity','qty'),p:f('price'),amt:f('amount','net'),acc:f('account')}; }
  return lines.slice(start).map(l=>{ const c=split(l); const g=k=>idx[k]>=0?c[idx[k]]:''; return {d:g('d'),t:g('t'),a:g('a'),q:g('q'),p:g('p'),amt:g('amt'),acc:g('acc')}; }); }

    ${row('job-site','Site data', J.site.page?'published by the site job':J.site.at?cairoAt(J.site.at):'unknown', J.site, J.site.page?'The live site is refreshed after each market update and inbox check; its footer shows when':`After each market update and inbox check${J.site.ok===false?' · older than expected':''}`)}

function extraChecks(){
  const out=[]; const D=dailyA();
  if(D){ const off=D.recon.filter(r=>Math.abs(r.pct)>0.01); out.push({label:'Month-end marks agree with closing prices (±1%)', status: off.length?'warn':'ok', detail: off.length? off.map(r=>`${M(r.month)} ${pct(r.pct,1)}`).join(', ')+' · post the statements to replace estimated marks' : `${D.recon.length} month-ends checked`}); }
  const closed = S.R.months.filter(r=>r.has && !r.live);
  const src = (r)=> r.estimate ? 'price-estimate' : (r.source && r.source!=='typed' ? r.source : ((S.marks[r.month]||{}).source || ((S.imports||{})[r.month] ? 'statement' : 'typed')));
  const typed = closed.filter(r=>src(r)==='typed'), est = closed.filter(r=>src(r)==='price-estimate'), stm = closed.filter(r=>src(r)==='statement'), rec = closed.filter(r=>src(r)==='reconstructed');
  // no closed month from a statement at all (a portfolio seeded from a workbook): every month-end is an estimate, say so
  if(closed.length && !stm.length && !rec.length) out.push({label:'Month-ends sourced from Thndr statements', status:'warn', detail:'no month comes from a Thndr statement yet — every month-end is an estimate'});
  else out.push({label:'Month-ends sourced from Thndr statements', status: typed.length||!stm.length?'warn':'ok', detail: `${stm.length} from statements` + (rec.length?` · ${rec.map(r=>M(r.month)).join(', ')} rebuilt from the next statement`:'') + (est.length?` · ${est.length} closing-price estimates (${est.map(r=>M(r.month)).join(', ')}; no holdings list on those statements)`:'') + (typed.length?` · typed by hand: ${typed.map(r=>M(r.month)).join(', ')}`:'')});
  // account lock: statements and invoices are only accepted for this account; the Unified Code is definitive, the holder name is a fallback
  const acct=(S.settings&&S.settings.account)||{}; const code=String(acct.unifiedCode||'').trim(), holder=String(acct.holder||'').trim();
  out.push({label:'Thndr account lock', status:'ok', detail: code?`Unified Code recorded${holder?` · holder ${holder}`:''}`:holder?'Unified Code unknown until the first statement is posted; documents are matched by holder name only':'Not recorded yet: the first Thndr statement records its account, and from then on only that account\'s documents are accepted.'});
  try{ PA.tradeChecks(S.R.ledger, S.assets, pbook(), S.bench && S.bench.actions).forEach(c=>out.push(c)); }catch(e){ console.error(e); }
  // provenance: rows in statement-confirmed months that no statement or invoice booked (the statement confirms the month's totals)
  const uv=unverifiedRows(); const uvM=[...new Set(uv.map(t=>String(t.d).slice(0,7)))].sort();
  out.push({label:'Rows not confirmed by a statement', status: uv.length?'warn':'ok', detail: uv.length ? `${uv.length} row${uv.length===1?'':'s'} typed by hand in months closed from a statement (${uvM.map(m=>`${M(m)} ${uv.filter(t=>String(t.d).startsWith(m)).length}`).join(', ')}) · filter the ledger by source to see them` : 'every row in a statement month is confirmed: by the statement, a Thndr invoice, a statement\'s fund page, or (savings and money-market funds) the statement\'s cash balance'});
  return out;
}
function vChecks(){
  const R=S.R; const m=S.market;
  const allChecks = R.checks.concat(extraChecks()).map(c=>({...c, label:prose(c.label), detail:prose(c.detail)}));
  const hist=Object.keys(S.history).sort();
  return `
  <div class="grid g2">
    <div class="panel"><div class="phead"><div><h2>Model checks</h2><div class="sub">The same controls as the workbook cover sheet, plus a cash reconciliation</div></div><span class="chip ${checkSummary().cls}">${esc(checkSummary().text)}</span></div>
      <div class="checks" data-testid="model-checks">${allChecks.map(c=>`<div class="check"><span class="ic ${c.status}">${c.status==='ok'?'✓':c.status==='warn'?'!':'×'}</span><span>${esc(c.label)}</span><span class="dt">${esc(c.detail)}</span></div>`).join('')}</div></div>
    <div class="panel"><div class="phead"><div><h2>Price automation</h2><div class="sub">Runs Sunday to Thursday at 3:40 PM Cairo, after the EGX close</div></div></div>
      <dl class="kv"><dt>Last update</dt><dd>${m&&m.asOf?esc(feedStatus().text):'Not yet run'}</dd><dt>Source</dt><dd>${esc(m&&m.source||'TradingView scanner')}</dd>
      <dt>Symbols priced</dt><dd>${m?Object.keys(m.quotes||{}).length:0}</dd><dt>Held positions with no quote</dt><dd>${(()=>{ const held=new Set(R.pos.open.map(r=>r.symbol)); const mm=((m&&m.missing)||[]).filter(x=>held.has(x)); return mm.length?esc(mm.join(', ')):'None'; })()}</dd>
      <dt>EGX30 Capped close</dt><dd>${m&&m.index&&m.index.EGX30CAPPED?num(m.index.EGX30CAPPED.close,1)+' · prior month-end '+num(m.index.EGX30CAPPED.prevMonthClose,1):'—'}</dd>
      <dt>Daily closes stored</dt><dd>${hist.length?`${Object.values(S.history).reduce((s,h)=>s+Object.keys(h.days||{}).length,0)} days since ${esc(hist[0])}`:'None yet'}</dd></dl>
      <p class="note" style="margin:10px 0 0">Each run also records the prior month-end EGX30 Capped close, and fills any completed month still missing Egypt CPI (CAPMAS urban CPI index) or USD/EGP (market month-end close; the CBE site blocks automated access). Values already entered are never overwritten.</p></div>
  </div>
  ${jobsPanel()}
  <div class="panel"><div class="phead"><div><h2>Methodology</h2><div class="sub">How every figure on this page is calculated</div></div></div><div class="prose">
    <h3>Time-weighted return (TWR)</h3><p>Monthly return is Modified Dietz: <code>(closing value − opening value − net deposits) ÷ (opening value + day-weighted net deposits)</code>. A deposit on the 1st counts fully for the month, one on the 16th about half. Months are then chain-linked (time-weighted): <code>TWR = Π(1 + r) − 1</code>. TWR removes the effect of your deposit timing and is the right figure to compare against the index.</p>
    <h3>Daily-linked return</h3><p>The ledger is revalued at every EGX close (holdings × closing price + ledger cash) and the daily returns are chain-linked from the first day of the period. It needs no month-end statement, so it also sees moves inside a month. Settings → Inputs &amp; settings → Headline return method chooses which figure the headline tile shows; the monthly table always stays Modified Dietz.</p>
    <h3>Money-weighted return (XIRR)</h3><p>The internal rate of return of your actual cash flows: the opening value on the day before the period, every deposit and withdrawal on its date, and the closing value at period end. It rewards or penalises the timing of your deposits. Actual/365 day count, same as Excel's XIRR.</p>
    <h3>Benchmark</h3><p>EGX30 Capped, the index most comparable to a retail EGX portfolio because no single stock can dominate it. It is a price index: it leaves dividends out, while your return includes the dividends you received, so the comparison flatters the portfolio a little. A month's return comes from consecutive month-end closes when both exist, otherwise from the typed %; when a month in the period has neither, the index return and alpha are left blank rather than counted as 0%. Alpha is the simple difference of returns. "With dividends (estimated)" compounds the index return with the index's estimated dividend yield (the EGX30 members' TradingView yields, weighted like the index): an estimate, not a published total-return index.</p>
    <h3>Cash benchmark</h3><p>What the money would have earned sitting in cash: each month at the Central Bank of Egypt policy rate in force, <code>(1 + annual rate)^(1/12) − 1</code>, chain-linked like the portfolio. The CBE policy rate is a proxy for what cash in a savings fund earns; a month without a recorded rate uses the risk-free rate in Settings. "Ahead of cash" is the portfolio's time-weighted return minus the cash return.</p>
    <h3>Trading costs</h3><p>The commission inside each stock buy and sell: <code>|net amount| − price × shares</code> for a buy, <code>price × shares − net amount</code> for a sell (funds carry none). Returns are already net of it. "Return before trading costs" adds each month's costs back to its month-end value and links the months again, an approximation of the gross return.</p>
    <h3>Cost basis and P/L</h3><p>Weighted-average cost, in ledger order. A sale's cost basis is <code>average cost × shares sold</code>; realized P/L is proceeds minus that basis. Amounts are net of Thndr commissions, as on the statement. Dividends are credited to the stock that paid them.</p>
    <h3>Risk</h3><p>Volatility is the sample standard deviation of monthly returns. Sharpe uses the monthly equivalent of the 3-month T-bill yield and is annualized by √12. Beta is the slope of portfolio on benchmark monthly returns; Jensen's alpha is the return beyond what beta predicts, <code>(average monthly return − risk-free) − beta × (index average − risk-free)</code>, annualized × 12; tracking error is the annualized standard deviation of monthly alpha; information ratio is annualized mean alpha over tracking error. Sortino replaces volatility with downside deviation (returns below the risk-free rate); Calmar is annualized TWR ÷ max drawdown. Upside/downside capture compare the portfolio's compounded return with the index's in the months the index rose or fell. Max drawdown in the tiles is measured on month-end values; the daily series under Performance also shows the deeper low inside a month. Ratios worked out from fewer than 12 monthly returns are marked indicative. HHI is the sum of squared position weights; 1 ÷ HHI gives the effective number of equal-sized positions.</p>
    <h3>USD and real returns</h3><p>USD return converts each month at consecutive month-end USD/EGP rates: the CBE mid rate where you entered it, otherwise the market close filled automatically. Real return deflates by Egypt urban CPI (CAPMAS), month on month, filled automatically once published around the 10th.</p>
    <h3>Current month</h3><p>Until the monthly statement arrives, the current month uses live prices and cash = the latest statement's closing balance plus every ledger movement booked after it (trades from Thndr invoices, for example). It is labelled Live. Once a month closes and its statement has not been posted yet, the month-end is estimated from the ledger (cash) and the last closing prices of the month (holdings, funds at their last traded NAV), labelled Estimate and flagged in the checks; the statement figures replace the estimate when it is posted. Nothing is saved to the marks until then.</p>
    <h3>Conventions</h3><p>All money in EGP. Negative money values are shown in parentheses; returns carry a sign. Inputs you type appear in blue, following the spreadsheet colour convention for hard-coded values.</p>
  </div></div>`;
}

document.addEventListener('click', async e=>{
  const sc=e.target.closest('[data-sec]'); if(sc){ e.preventDefault(); const el=document.getElementById('sec-'+sc.dataset.sec); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); try{ history.replaceState(null,'','#'+sc.dataset.sec); }catch(x){} } return; }

  const uw=e.target.closest('[data-unwatch]'); if(uw){ const n=uw.dataset.unwatch, a=S.assets[n]; if(!a||S.readOnly) return; await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,[n]:{...a, watch:false}}}),`${a.symbol||n} removed from the watchlist`); return; }
  const ex=e.target.closest('.chip[title],.pill[title]'); if(ex && ex.title && !ex.closest('button,a')){ toast(ex.title); return; }
  const del=e.target.closest('[data-del]');
  if(del){ if(del.dataset.arm!=='1'){ del.dataset.arm='1'; del.textContent='Confirm delete'; setTimeout(()=>{ if(del.isConnected){ del.dataset.arm=''; del.textContent='Delete'; } },4000); return; }
    const id=del.dataset.del; for(const y of Object.keys(S.ledgerDocs)){ const rows=S.ledgerDocs[y].rows||[]; if(rows.some(r=>r.id===id)){ await save(()=>S.db.doc('ledger/y'+y).set({rows:rows.filter(r=>r.id!==id)}),'Transaction deleted'); break; } } return; }
  const cf=e.target.closest('[data-confirm]');
  if(cf){ const m=cf.dataset.confirm; const r=S.R.months.find(x=>x.month===m); const patch={provisional:false};
    if(r&&r.live){ patch.cash=r.cash; patch.securities=Math.round(r.securities*100)/100; if(r.benchClose) patch.benchClose=r.benchClose; if(r.usdegp&&S.marks[m]?.usdegp==null) patch.usdegp=r.usdegp; }
    const cur=S.marks[m]||{}; await save(()=>S.db.doc('portfolio/marks').update({months:{[m]:{...cur,...patch}}}),`${M(m)} confirmed`); return; }
  if(e.target.id==='save-marks'){ const patch={}, typed={}; document.querySelectorAll('#main [data-m].dirty').forEach(inp=>{ const m=inp.dataset.m,f=inp.dataset.f; let v=inp.value.trim(); (patch[m] ||= {...(S.marks[m]||{})}); (typed[m] ||= new Set()).add(f);
      if(f==='note'){ if(v) patch[m].note=v; else delete patch[m].note; return; }
      if(v===''){ delete patch[m][f]; return; } let n=parseFloat(v); if(!isFinite(n)){ return; } if(f==='benchReturn'||f==='cpi') n=n/100; patch[m][f]=n; });
    if(!Object.keys(patch).length){ toast('Nothing changed'); return; }
    // Typing the two month-end figures for a closed month makes it a confirmed typed row, so it wins over the month-close estimate.
    // Only the cash/securities inputs the owner actually edited count (patch[m] is seeded from the stored row, which may already
    // hold placeholder numbers): both typed in this save, or one typed to a value that differs from the stored one. Editing any
    // other cell of the row (CPI, USD/EGP, EGX %, note) leaves it provisional so the estimate keeps standing in.
    const curM=PE.monthOf(PE.cairoToday()); Object.keys(patch).forEach(m=>{ const p=patch[m], was=S.marks[m]||{}, ty=typed[m];
      if(!(m<curM && p.provisional && typeof p.cash==='number' && typeof p.securities==='number')) return;
      const both=ty.has('cash')&&ty.has('securities'), changed=['cash','securities'].some(f=>ty.has(f)&&p[f]!==was[f]);
      if(both||changed){ p.provisional=false; delete p.estimate; } });
    const all={...S.marks,...patch}; await save(()=>S.db.doc('portfolio/marks').set({months:all}),'Month-end marks saved'); return; }
  if(e.target.id==='save-assets'){ const patch={}; document.querySelectorAll('#main [data-a].dirty').forEach(inp=>{ const a=inp.dataset.a,f=inp.dataset.f; const v=inp.value.trim(); (patch[a] ||= {...(S.assets[a]||{name:a})});
      if(f==='symbol'||f==='sector'||f==='priceDate'||f==='note'||f==='thesis'||f==='reviewOn'){ if(v) patch[a][f]= f==='symbol'?v.toUpperCase():v; else delete patch[a][f]; return; }
      if(v===''){ delete patch[a][f]; return; } const n=parseFloat(v); if(isFinite(n)) patch[a][f]=n; });
    if(!Object.keys(patch).length){ toast('Nothing changed'); return; }
    await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,...patch}}),'Assets saved'); return; }
  if(e.target.id==='csv-preview'){ const msg=$('#csv-msg'); let parsed; try{ parsed=parseCsv($('#csv-in').value).map(normTx); }catch(err){ msg.textContent=err.message; msg.className='note neg'; csvPending=null; return; }
    const have=new Set(allTx().map(txKey)); const fresh=parsed.filter(t=>!have.has(txKey(t))); const dup=parsed.length-fresh.length;
    csvPending=fresh; msg.className='note'; msg.innerHTML=`${fresh.length} new row${fresh.length===1?'':'s'}${dup?`, ${dup} duplicate${dup>1?'s':''} skipped`:''}. ${fresh.length?`<button class="btn sm primary" id="csv-import" data-testid="csv-import">Import ${fresh.length}</button>`:''}`; return; }
  if(e.target.id==='csv-import'&&csvPending){ const n=csvPending.length; if(await addTx(csvPending)){ toast(`${n} transactions imported`); csvPending=null; } return; }
  if(e.target.id==='dl-ledger'){ const rows=[['Date','Type','Asset','Symbol','Shares','Price','Amount','CostBasisSold','Account']].concat(S.R.ledger.map(t=>[t.d,t.t,t.a||'',(S.assets[t.a]||{}).symbol||'',t.q??'',t.p??'',t.amt,t.t==='Sell'?t.basis.toFixed(2):'',t.acc||''])); download('portfolio-ledger.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-holdings'){ const rows=[['Symbol','Asset','Sector','Shares','AvgCost','Price','PriceDate','MarketValue','Unrealized','Dividends','TotalPL','Weight']].concat(S.R.pos.open.map(r=>[r.symbol,r.name,r.sector,r.open,r.avgCost?.toFixed(4),r.price,r.priceDate,r.mv?.toFixed(2),r.unreal?.toFixed(2),r.divs.toFixed(2),r.total.toFixed(2),r.weight.toFixed(6)])); download('portfolio-holdings.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-monthly'){ const st=S.R.stats; const rows=[['Month','Opening','NetFlow','WeightedFlow','Dividends','MonthEndValue','Return','EGX30Capped','Alpha','CumReturn','CumBench','Drawdown','USDReturn','RealReturn','Status']].concat(st.rows.map(r=>[r.month,r.opening,r.netFlow,r.weightedFlow,r.dividends,r.value,r.ret,r.bench,r.alpha,r.pCum,r.pBench,r.dd,r.usdRet,r.realRet,r.live?'live':r.estimate?'estimate':r.provisional?'provisional':'confirmed'])); download('portfolio-monthly.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-backup'){ download('portfolio-backup.json', JSON.stringify({exported:new Date().toISOString(), ...dataset(), history:S.history},null,1)); return; }
  if(e.target.id==='refresh-prices'){ refreshNow(e.target); return; }
  if(e.target.id==='review-close'){ S.stmt.review=null; renderTab(true); return; }
  if(e.target.id==='retry-held'){ retryHeld(e.target); return; }
  if(e.target.id==='post-statement'){ postStatement(); return; }
  if((e.target.id==='fs-xlsx'||e.target.id==='fs-pdf') && window.pdExportsNote && window.pdExportsNote(M(e.target.dataset.month))){ toast(window.pdExportsNote(M(e.target.dataset.month))); return; }
  if(e.target.id==='fs-xlsx'){ const b=e.target, m=b.dataset.month; b.disabled=true; b.textContent='Preparing…'; try{ const list=await window.pdExports(); if(!list.some(x=>x.month===m)){ const have=list.map(x=>M(x.month)).join(', '); toast(`No Excel workbook for ${M(m)} yet. Workbooks are published with each monthly statement${have?` (available: ${have})`:''}.`,'error'); } else { await window.pdDownloadExport(m); toast(`Excel workbook for ${M(m)} saved`); } }catch(err){ toast('Could not download the workbook: '+(err.message||err),'error'); } b.disabled=false; b.textContent='Download Excel'; return; }
  if(e.target.id==='fs-pdf'){ const b=e.target, m=b.dataset.month; b.disabled=true; b.textContent='Preparing…'; try{ await window.pdDownloadExport(m,'pdf'); toast(`PDF factsheet for ${M(m)} saved`); }catch(err){ toast('Could not download the PDF: '+(err.message||err),'error'); } b.disabled=false; b.textContent='Download PDF'; return; }
  if(e.target.id==='fs-dl'){ const F=factsheetData(S.fsMonth); download(`factsheet-${S.fsMonth}.html`, `<!doctype html><html><head><meta charset="utf-8"><title>${esc(S.settings.name)} factsheet ${M(S.fsMonth)}</title></head><body style="margin:0;padding:16px;background:#EDF2EF">${factsheetHTML(F)}</body></html>`); return; }
});
document.addEventListener('input', e=>{ if(e.target.matches('.grid-in input')) e.target.classList.add('dirty');
  if(['lf-q'].includes(e.target.id)){ S.ledgerFilter.q=e.target.value; clearTimeout(vLedger._t); vLedger._t=setTimeout(()=>{ const pos=e.target.selectionStart; renderTab(true); const el=$('#lf-q'); if(el){ el.focus(); el.setSelectionRange(pos,pos);} },250); }
  if(e.target.id==='tx-q'||e.target.id==='tx-p'){ const q=parseFloat($('#tx-q').value), p=parseFloat($('#tx-p').value); if(isFinite(q)&&isFinite(p)) $('#tx-hint').textContent=`Gross ${egp(q*p,2)} EGP. Enter the net amount from the statement, which includes commission.`; } });
document.addEventListener('change', e=>{ if(e.target.dataset.pick!=null&&S.stmt.review){ S.stmt.review.pick[+e.target.dataset.pick]=e.target.checked; } if(e.target.dataset.use!=null&&S.stmt.review){ S.stmt.review.use[+e.target.dataset.use]=e.target.checked; } if(e.target.id==='apply-marks'&&S.stmt.review){ S.stmt.review.applyMarks=e.target.checked; const o=$('[data-testid=review-outcome]'); if(o) o.textContent=postOutcome(S.stmt.review).text; } if(e.target.id==='fs-month'){ S.fsMonth=e.target.value; renderTab(true); } if(e.target.id==='lf-type'){ S.ledgerFilter.type=e.target.value; renderTab(true); } if(e.target.id==='lf-year'){ S.ledgerFilter.year=e.target.value; renderTab(true); } if(e.target.id==='lf-src'){ S.ledgerFilter.src=e.target.value; renderTab(true); } });
document.addEventListener('submit', async e=>{
  e.preventDefault();
  if(e.target.id==='tx-form'){ let t; try{ t=normTx({d:$('#tx-d').value,t:$('#tx-t').value,a:$('#tx-a').value,q:$('#tx-q').value,p:$('#tx-p').value,amt:$('#tx-amt').value,acc:$('#tx-acc').value}); }catch(err){ toast(err.message,'error'); return; }
    if(t.a && !S.assets[t.a] && (t.t==='Buy')) toast(`"${t.a}" is a new asset. Add its symbol under Settings → Inputs & settings so it gets priced.`);
    if(await addTx([t])){ toast(`${t.t} added`); e.target.reset(); } }
  if(e.target.id==='wl-form'){ await addToWatchlist($('#wl-sym').value); return; }
  if(e.target.id==='asset-form'){ const name=$('#na-name').value.trim(); if(!name) return; if(S.assets[name]){ toast('That asset already exists','error'); return; }
    const a={name}; const sym=$('#na-sym').value.trim().toUpperCase(); const sec=$('#na-sec').value.trim(); if(sym) a.symbol=sym; if(sec) a.sector=sec;
    await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,[name]:a}}),`${name} added; it will be priced at the next run`); }
  if(e.target.id==='settings-form'){ const g=id=>$(id).value; const n=id=>parseFloat($(id).value);
    const s={...S.settings, name:g('#st-name').trim()||'Portfolio', inception:g('#st-inc')||S.settings.inception, openingValue:n('#st-open'), cash:n('#st-cash'), cashDate:g('#st-cashd')||null, riskFree:n('#st-rf')/100, fxStart:n('#st-fx'), volLow:n('#st-vl')/100, volHigh:n('#st-vh')/100, openThreshold:n('#st-thr'), staleDays:n('#st-stale'), priceDate:g('#st-pd')||null, factsheetEmail:g('#st-email').trim()||null, returnMethod:g('#st-ret')==='daily'?'daily':'dietz', benchCloseStart:isFinite(n('#st-bcs'))?n('#st-bcs'):null, account:{holder:g('#st-holder').trim(), unifiedCode:g('#st-ucode').trim()}};
    if(['openingValue','cash','riskFree','fxStart','volLow','volHigh','openThreshold','staleDays'].some(k=>!isFinite(s[k]))){ toast('Every number field needs a value','error'); return; }
    await save(()=>S.db.doc('portfolio/settings').set(s),'Settings saved'); }
});
// Add a symbol to the watchlist: an existing asset with that symbol just gets watch:true; otherwise a new asset named as the
// price job names the stock, with its EGX30 sector when it is an index member ('Unclassified' otherwise).
async function addToWatchlist(raw){
  const sym=String(raw||'').trim().toUpperCase().replace(/^EGX:/,''); if(!sym){ toast('Type a symbol, e.g. COMI','error'); return false; }
  if(!/^[A-Z0-9.]{2,12}$/.test(sym)){ toast(`"${sym}" does not look like an EGX symbol`,'error'); return false; }
  if(S.readOnly){ toast('Turn on editing at the bottom of the page to change the watchlist.','error'); return false; }
  const q=((S.market&&S.market.quotes)||{})[sym]; const ex=Object.values(S.assets).find(a=>String(a.symbol||'').toUpperCase()===sym);
  if(ex){ const held=S.R.pos.open.some(r=>r.name===ex.name);
    if(ex.watch===true || held){ toast(`${sym} is already on the watchlist${held?' (you hold it)':''}`); return false; }
    return save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,[ex.name]:{...ex, watch:true}}}),`${sym} added to the watchlist`); }
  const mem=((S.bench&&S.bench.members)||[]).find(m=>m.s===sym);
  let name=String((q&&q.name)||(mem&&mem.name)||sym).trim(); if(S.assets[name]) name=`${name} (${sym})`;
  const a={name, symbol:sym, sector:(mem&&mem.sector)||'Unclassified', watch:true};
  return save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,[name]:a}}), q?`${sym} added to the watchlist`:`${sym} added to the watchlist; no price for it yet — it is priced at the next daily update`);
}
// A cell starting with = + - @ is read as a formula by Excel and Sheets: a leading ' keeps it text. Plain numbers ("-8905.12") stay numbers.
function csvCell(v){ let s=v==null?'':String(v); if(/^[=+\-@]/.test(s) && !(typeof v==='number' || /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s))) s="'"+s; return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }
function toCsv(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\n'); }
async function download(filename, data){ const dl=await window.pdHost?.use?.('downloads'); if(!dl){ toast('Downloads are not available in this view','error'); return; }
  try{ await dl.save({filename, data}); }catch(e){ if(e&&e.code!=='declined') toast('Download failed: '+(e.message||e.code),'error'); } }
// "Refresh now": the site layer (site/lock.js pdRefreshPrices) fetches live prices; without it prices come with each daily update
async function refreshNow(btn){ if(window.pdRefreshPrices) return window.pdRefreshPrices(btn, toast); toast('Prices update automatically after each session.','error'); }

// ---------- boot ----------
(async function boot(){
  // window.pdHost: the services the page runs on (site/lock.js; tools/factsheet.js when rendering headless): 'db' = the
  // portfolio's documents, 'downloads' = saving a file
  const db = await (window.pdHost && window.pdHost.use ? window.pdHost.use('db') : Promise.resolve(null));
  if(!db){ $('#main').innerHTML=`<div class="empty"><h2>The portfolio is not open</h2><p>Open the site and unlock a portfolio to see it.</p></div>`; $('#tape').innerHTML='<span class="muted">Market data unavailable in this view</span>'; return; }
  S.db=db;
  const onErr=(e)=>{ console.error(e); toast('Lost connection to the portfolio database. Reload the page.','error'); };
  db.doc('portfolio/settings').onSnapshot(s=>{ S.settings=s.exists?s.data():null; S.ready.settings=true; schedule(); }, onErr);
  db.doc('portfolio/marks').onSnapshot(s=>{ S.marks=(s.exists&&s.data().months)||{}; S.ready.marks=true; schedule(); }, onErr);
  db.doc('portfolio/assets').onSnapshot(s=>{ S.assets=(s.exists&&s.data().items)||{}; S.ready.assets=true; schedule(); }, onErr);
  db.collection('ledger').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id.replace(/^y/,'')]=d.data(); }); S.ledgerDocs=o; S.ready.ledger=true; schedule(); }, onErr);
  db.doc('market/latest').onSnapshot(s=>{ S.market=s.exists?s.data():null; S.ready.market=true; schedule(); }, onErr);
  db.collection('history').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=d.data(); }); S.history=o; schedule(); }, onErr);
  db.doc('bench/egx30').onSnapshot(s=>{ S.bench=s.exists?s.data():null; schedule(); }, onErr);
  db.collection('imports').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=d.data(); }); S.imports=o; schedule(); }, onErr);
  db.doc('sync/state').onSnapshot(s=>{ S.sync=s.exists?s.data():null; schedule(); }, onErr);
})();
})();
</script>
