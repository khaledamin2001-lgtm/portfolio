:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F3F6F4}img{max-width:100%}[hidden]{display:none!important}
#lock{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg,#F3F6F4);color:var(--ink,#0F1A17);overflow-y:auto}
#lock .lk{width:100%;max-width:360px;display:flex;flex-direction:column;gap:18px;text-align:center}
#lock .lk-mark{width:64px;height:64px;margin:0 auto;border-radius:16px;background:var(--accent,#0B6E5F);display:grid;place-items:center}
#lock .lk-mark svg{width:36px;height:36px}
#lock h1{margin:0;font:600 24px/1.2 var(--f-display,Georgia,serif);text-wrap:balance}
#lock p{margin:0;color:var(--ink-2,#46534E);font-size:14px;line-height:1.5}
#lock form{display:flex;flex-direction:column;gap:10px}
#lock input{font:500 17px/1.2 var(--f-ui,system-ui,sans-serif);padding:13px 14px;border-radius:10px;border:1px solid var(--input-rule,#C9D4CF);background:var(--input,#fff);color:var(--ink,#0F1A17);text-align:center;letter-spacing:.04em;width:100%;box-sizing:border-box}
#lock input:focus{outline:2px solid var(--accent,#0B6E5F);outline-offset:1px}
#lock .lk-btn{font:600 16px/1 var(--f-ui,system-ui,sans-serif);padding:14px;border-radius:10px;border:0;background:var(--accent,#0B6E5F);color:var(--accent-ink,#fff);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#lock .lk-btn.ghost{background:transparent;color:var(--accent,#0B6E5F);border:1px solid var(--rule,#DAE2DE)}
#lock .lk-btn:disabled{opacity:.6;cursor:default}
#lock .lk-link{background:none;border:0;color:var(--ink-3,#5F6C67);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
#lock .lk-err{color:var(--neg,#c02f2f);font-size:14px;min-height:1.2em}
#lock .lk-sep{display:flex;align-items:center;gap:10px;color:var(--ink-3,#5F6C67);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#lock .lk-sep::before,#lock .lk-sep::after{content:"";flex:1;height:1px;background:var(--rule,#DAE2DE)}
#lock .lk-foot{font-size:12px;color:var(--ink-3,#5F6C67)}
#lock .lk-list{display:flex;flex-direction:column;gap:10px}
#lock .lk-list .lk-btn{flex-direction:column;gap:3px;padding:16px 14px}
#lock .lk-list .lk-btn small{font:400 12px/1.2 var(--f-ui,system-ui,sans-serif);opacity:.8}
#lock .lk-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px}
#lock .lk-rules{list-style:none;margin:0;padding:0 4px;text-align:left;font-size:13px;line-height:1.5;color:var(--ink-3,#5F6C67);display:flex;flex-direction:column;gap:2px}
#lock .lk-rules li::before{content:"○";display:inline-block;width:1.5em}
#lock .lk-rules li.ok{color:var(--accent,#0B6E5F)}
#lock .lk-rules li.ok::before{content:"✓"}
#lock .lk-tip{font-size:12px;line-height:1.5;text-align:left;color:var(--ink-2,#46534E);background:var(--surface,#fff);border:1px solid var(--rule,#DAE2DE);border-radius:10px;padding:10px 12px}
#pd-bar .pd-actions{display:flex;gap:8px}
body.pd-locked{overflow:hidden}
body.pd-locked>:not(#lock){display:none!important}
#pd-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;max-width:1240px;margin:28px auto 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule,#DAE2DE);color:var(--ink-3,#5F6C67);font-size:12px}
#pd-bar button{font:500 12px/1 var(--f-ui,system-ui,sans-serif);padding:8px 12px;border-radius:8px;border:1px solid var(--rule,#DAE2DE);background:var(--surface,#fff);color:var(--ink-2,#46534E);cursor:pointer}
@media (max-width:600px){#pd-bar button{min-height:40px}#lock .lk-link{min-height:40px}}
#pd-updated.stale{color:var(--warn,#8f5a00);font-weight:600}
#pd-offline{margin:0;padding:7px 16px;background:var(--warn-bg,#FFF1D2);color:var(--warn,#8f5a00);border-bottom:1px solid var(--rule,#DAE2DE);font:500 12.5px/1.4 var(--f-ui,system-ui,sans-serif);text-align:center;text-wrap:balance}
#pd-bar #pd-install{color:var(--accent,#0B6E5F);border-color:var(--accent,#0B6E5F)}
#lock .lk-steps{margin:0;padding:0 0 0 1.4em;text-align:left;font-size:13.5px;line-height:1.5;color:var(--ink-2,#46534E);display:flex;flex-direction:column;gap:4px}
#lock .lk-steps a{color:var(--accent,#0B6E5F);font-weight:600}
#lock .lk-btn.ghost + .lk-btn.ghost{margin-top:-8px}
#pd-bar #pd-edit-on{color:var(--accent,#0B6E5F);border-color:var(--accent,#0B6E5F)}
#pd-bar .pd-actions{flex-wrap:wrap}
#pd-bar button:disabled{opacity:.6;cursor:default}
#pd-edit-state.stale{color:var(--warn,#8f5a00);font-weight:600}
#lock textarea{font:500 16px/1.4 var(--f-ui,system-ui,sans-serif);padding:12px 14px;border-radius:10px;border:1px solid var(--input-rule,#C9D4CF);background:var(--input,#fff);color:var(--ink,#0F1A17);width:100%;box-sizing:border-box;resize:vertical}
#lock textarea:focus{outline:2px solid var(--accent,#0B6E5F);outline-offset:1px}
#lock .lk-code{font:600 18px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em;white-space:nowrap;color:var(--ink,#0F1A17);background:var(--surface,#fff);border:1px dashed var(--accent,#0B6E5F);border-radius:10px;padding:14px;user-select:all;word-break:break-all}
#lock .lk-check{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;color:var(--ink-2,#46534E)}
#lock .lk-check input{width:auto}
#lock .lk-more{text-align:left;font-size:13px;color:var(--ink-3,#5F6C67)}
#lock .lk-more summary{cursor:pointer;padding:6px 0;text-align:center;text-decoration:underline}
#lock .lk-more .lk-list{margin-top:8px}
#pd-bar #pd-account{color:var(--accent,#0B6E5F);border-color:var(--accent,#0B6E5F)}
#lock a.lk-btn{text-decoration:none;box-sizing:border-box}
#lock .lk-stepno{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#0B6E5F)}
#lock .lk-lbl{font-size:13px;font-weight:600;text-align:left;color:var(--ink-2,#46534E);margin:4px 0 -4px}
#lock .lk-hint{font-size:12px;text-align:left;color:var(--ink-3,#5F6C67);margin-top:-4px}
#lock .lk-ok{color:var(--accent,#0B6E5F);font-weight:600}
#lock .lk-btn.danger{background:var(--neg,#B42318);color:#fff}
#lock .lk-friend{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--rule,#DAE2DE);border-radius:10px;background:var(--surface,#fff)}
#lock .lk-friend small{display:block;font-size:12px;color:var(--ink-3,#5F6C67);word-break:break-all}
#lock .lk-friend-btns{display:flex;gap:6px;flex-shrink:0}
#lock .lk-friend-btns .lk-btn{padding:9px 12px;font-size:14px}
#lock .lk-card{text-align:left;padding:12px;border:1px solid var(--rule,#DAE2DE);border-radius:10px;background:var(--surface,#fff);display:flex;flex-direction:column;gap:8px}
#lock .lk-card.bad{border-color:var(--neg,#B42318)}
#lock .lk-card-head small{display:block;font-size:12px;color:var(--ink-3,#5F6C67);word-break:break-all}
#lock .lk-facts{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.5;color:var(--ink-2,#46534E)}
#lock .lk-facts li.ok{color:var(--accent,#0B6E5F)}
#lock .lk-facts li.bad{color:var(--neg,#B42318);font-weight:600}
#lock .lk-card .lk-btn{padding:9px 12px;font-size:14px}
#pd-view{position:sticky;top:0;z-index:50;margin:0;padding:8px 16px;background:var(--accent,#0B6E5F);color:#fff;font:500 13px/1.4 var(--f-ui,system-ui,sans-serif);text-align:center}
#pd-view button{margin-left:8px;font:600 12.5px/1 var(--f-ui,system-ui,sans-serif);padding:6px 10px;border-radius:7px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer}
#lock [hidden]{display:none!important}
#lock .lk-step{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:6px;font-size:14px;color:var(--ink,#0F1A17)}
#lock .lk-step small{display:block;font-size:12.5px;line-height:1.45;color:var(--ink-3,#5F6C67);margin-top:2px}
#lock .lk-num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent,#0B6E5F);color:#fff;font:700 13px/24px var(--f-ui,system-ui,sans-serif);text-align:center}
#lock .lk-more p{margin-top:6px;font-size:12.5px}
#pf-menu.pd-hub{min-width:340px;max-width:min(420px,calc(100vw - 32px));max-height:min(75vh,640px);overflow:auto;padding:8px}
#pf-menu.pd-hub .hub-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font:600 11px/1.2 var(--f-ui,system-ui,sans-serif);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3,#5F6C67)}
#pf-menu.pd-hub .hub-add{width:auto;display:inline-flex;padding:6px 10px;font:600 12px/1 var(--f-ui,system-ui,sans-serif);color:var(--accent,#0B6E5F);border:1px solid var(--rule,#DAE2DE);border-radius:999px;text-transform:none;letter-spacing:0}
#pf-menu.pd-hub .hub-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;flex-direction:row}
#pf-menu.pd-hub .hub-row.cur{background:var(--bg,#F3F5F4);box-shadow:inset 3px 0 0 var(--accent,#0B6E5F)}
#pf-menu.pd-hub .hub-rank{font:700 13px/1 var(--f-ui,system-ui,sans-serif);color:var(--ink-3,#5F6C67);text-align:center}
#pf-menu.pd-hub .hub-who{display:flex;flex-direction:column;gap:3px;min-width:0}
#pf-menu.pd-hub .hub-who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pf-menu.pd-hub .hub-num{display:flex;flex-direction:column;align-items:flex-end;font:700 15px/1.1 var(--f-ui,system-ui,sans-serif);font-variant-numeric:tabular-nums}
#pf-menu.pd-hub .hub-num.pos{color:var(--pos,#0B6E5F)}
#pf-menu.pd-hub .hub-num.neg{color:var(--neg,#B42318)}
#pf-menu.pd-hub .hub-note{color:var(--accent,#0B6E5F);font-weight:600}
#pf-menu.pd-hub .hub-empty{margin:4px 12px 8px;font-size:12.5px;color:var(--ink-3,#5F6C67)}
#pf-menu.pd-hub .hub-other{font-size:13.5px}
#pf-menu.pd-hub .hub-who b{font:600 14px/1.25 var(--f-ui,system-ui,sans-serif)}
#pf-menu.pd-hub .hub-otherrow{display:flex;align-items:center;gap:6px}
#pf-menu.pd-hub .hub-otherrow .hub-other{flex:1}
#pf-menu.pd-hub .hub-forget{width:auto;flex:0 0 auto;padding:6px 10px;font:500 12px/1 var(--f-ui,system-ui,sans-serif);color:var(--ink-3,#5F6C67);border:1px solid var(--rule,#DAE2DE);border-radius:999px}
.pd-friends{background:var(--surface,#fff);border:1px solid var(--rule,#DAE2DE);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.pd-friends .pdf-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pd-friends h3{margin:0;font:600 11px/1.2 var(--f-ui,system-ui,sans-serif);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3,#5F6C67)}
.pd-friends .pdf-add{padding:7px 12px;font:600 12.5px/1 var(--f-ui,system-ui,sans-serif);color:var(--accent,#0B6E5F);background:transparent;border:1px solid var(--rule,#DAE2DE);border-radius:999px;cursor:pointer}
.pd-friends .pdf-note{display:block;width:100%;margin:0 0 10px;padding:9px 12px;text-align:left;font:600 13px/1.3 var(--f-ui,system-ui,sans-serif);color:var(--accent,#0B6E5F);background:var(--bg,#F3F5F4);border:0;border-radius:10px;cursor:pointer}
.pd-friends .pdf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pd-friends .pdf-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border:1px solid var(--rule,#DAE2DE);border-radius:12px;background:var(--surface,#fff);color:var(--ink,#0F1A17);cursor:pointer;font:500 13px/1.3 var(--f-ui,system-ui,sans-serif)}
.pd-friends .pdf-card:hover{border-color:var(--accent,#0B6E5F)}
.pd-friends .pdf-card.cur{border-color:var(--accent,#0B6E5F);box-shadow:inset 0 0 0 1px var(--accent,#0B6E5F)}
.pd-friends .pdf-top{display:flex;gap:8px;align-items:baseline;min-width:0;max-width:100%}
.pd-friends .pdf-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1280px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
@media (max-width:600px){.mast-in{padding-inline:16px;gap:10px}}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:600 19px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.pf-switch{position:relative;min-width:0}
.pf-title{font:600 19px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;background:none;border:0;color:inherit;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.pf-title svg{width:14px;height:14px;opacity:.65;flex:none}
.pf-title:hover svg{opacity:1}
.pf-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:270px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;gap:2px}
.pf-menu[hidden]{display:none}   /* the class's display:flex would otherwise beat the hidden attribute (an empty white bar) */
.pf-menu a,.pf-menu button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--ink);font:500 14px/1.2 var(--f-ui);text-decoration:none;cursor:pointer;width:100%;box-sizing:border-box}
.pf-menu a:hover,.pf-menu button:hover{background:var(--bg)}
.pf-menu .cur{color:var(--accent)}
.pf-menu small{font:400 11px/1.2 var(--f-ui);color:var(--ink-3)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:860px){nav.tabs{margin-left:0;width:100%;padding-bottom:8px}}
/* phones: the seven tabs wrap onto two rows instead of scrolling or clipping */
@media (max-width:520px){nav.tabs{flex-wrap:wrap;overflow:visible;gap:2px 0;padding-bottom:6px}nav.tabs button{padding:7px 10px;font-size:13px}}
/* phones: every tap target at least 40px tall */
@media (max-width:600px){nav.tabs button,.seg button,.btn,.subnav a,.pf-title,button.chip{min-height:40px}.subnav a{display:inline-flex;align-items:center}}

/* tape */
.tape{display:flex;gap:22px;overflow-x:auto;min-width:0;max-width:100%;padding-block:10px;border-bottom:1px solid var(--rule);scrollbar-width:none;font-size:12.5px}
.tape::-webkit-scrollbar{display:none}
.tape .t{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.tape .t b{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}
.feedbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-block:8px 0;font-size:12.5px;flex-wrap:wrap}
.feedbar:empty{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)} .dot.err{background:var(--neg)}

/* period bar */
.period{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:18px 6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.period label{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--input);border:1px solid var(--input-rule);border-radius:8px;padding:6px 9px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.period .label{font:600 22px/1.2 var(--f-display);margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
button.chip{border:0;font-family:inherit;cursor:pointer}
.chip[title],.pill[title]{cursor:help}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.ok{background:var(--pos-bg);color:var(--pos)} .chip.err{background:var(--neg-bg);color:var(--neg)}

/* layout */
section.view{display:grid;gap:18px;padding-top:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;min-width:0}
@media (max-width:600px){.panel{padding:16px 14px}}
.panel h2{font:600 17px/1.3 var(--f-display);letter-spacing:-.005em}
.panel .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;align-content:start}
.kpi .v{font:600 26px/1.15 var(--f-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.kpi .v small{font:500 13px var(--f-ui);color:var(--ink-3);margin-left:4px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.kpi.hero{background:var(--accent);color:var(--accent-ink)}
.kpi.hero .eyebrow,.kpi.hero .d,.kpi.hero .v small{color:color-mix(in srgb,var(--accent-ink) 88%,transparent)}
.kpi.hero .pos,.kpi.hero .neg{color:var(--accent-ink)}

/* tables */
.tbl{overflow-x:auto;margin-inline:-4px;position:relative}
/* long tables (ledger, closed trades): a vertical scroll box of their own, so the sticky header row stays visible */
.tbl.tall{max-height:min(70vh,calc(100vh - var(--mast-h,0px) - 16px));overflow:auto}   /* never taller than the space under the sticky masthead */
.tbl.tall th{box-shadow:inset 0 -1px 0 var(--rule)}
/* the row label stays put while a wide table is swiped: first column sticky, on the table's own background, with a rule */
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--rule)}
/* phones: the sticky label column wraps at word breaks ("anywhere" let it shrink to one letter a line) and keeps room for a date */
@media (max-width:520px){.tbl th:first-child,.tbl td:first-child{min-width:108px;max-width:140px;white-space:normal;overflow-wrap:break-word}}
input:disabled,select:disabled,textarea:disabled{color:var(--ink-2);-webkit-text-fill-color:var(--ink-2)}
.tbl th:first-child{z-index:3}
.tbl tbody tr:hover td:first-child{background:var(--surface-2)}
/* a table wider than its box says so until it has been scrolled (class set by markScrollables) */
.tbl.can-scroll::after{content:"swipe →";position:sticky;left:calc(100% - 70px);display:inline-block;margin:6px 0 2px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-size:11px;letter-spacing:.04em;pointer-events:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:middle}
td.n,th.n{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--rule);border-bottom:0}
td.wrap{white-space:normal;min-width:180px;padding:8px 10px;margin:0;max-width:none}   /* not the page's .wrap container padding */
.sym{font:500 12.5px var(--f-mono);letter-spacing:.03em}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--s1)}
.wcell{display:flex;align-items:center;gap:8px}.wcell .bar{flex:1}.wcell .num{min-width:3.4em;text-align:right;font-size:12.5px}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.03em}
.pill.win{background:var(--pos-bg);color:var(--pos)} .pill.loss{background:var(--neg-bg);color:var(--neg)}
.pill.auto{background:var(--accent-soft);color:var(--accent)} .pill.man{background:var(--surface-2);color:var(--ink-2)} .pill.stale{background:var(--warn-bg);color:var(--warn)}
.pill.prov{background:var(--warn-bg);color:var(--warn)}

/* key-value lists */
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:13.5px}
.kv > div{padding:7px 0;border-bottom:1px solid var(--grid);display:contents}
.kv dt{padding:7px 0;border-bottom:1px solid var(--grid);color:var(--ink-2)}
.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv dt.total,.kv dd.total{border-top:1.5px solid var(--ink-2);border-bottom:3px double var(--ink-2);font-weight:700;color:var(--ink)}
.kv dt.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:14px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font:11px var(--f-ui);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);white-space:nowrap;z-index:5;transform:translate(-50%,-100%);transition:opacity .08s}
.tip b{font-weight:600}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:10px;height:10px;border-radius:2px}

/* forms & buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--input-rule);background:var(--surface);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--input-rule))}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 12px;align-items:end}
.form label{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.form input,.form select{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid-in input{width:100%;min-width:84px;padding:4px 7px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
.grid-in input.txt{text-align:left;min-width:140px}
.grid-in input.dirty{border-color:var(--accent);background:var(--accent-soft)}
td.in-cell{padding:4px 6px}
input.inp,.grid-in input{color:#2256c7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input.inp,:root:not([data-theme="light"]) .grid-in input{color:#8db8ff}}
:root[data-theme="dark"] input.inp,:root[data-theme="dark"] .grid-in input{color:#8db8ff}
textarea{width:100%;min-height:130px;font:12.5px/1.5 var(--f-mono)}

/* checks */
.checks{display:grid;gap:0}
.check{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--grid)}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.check .ic.ok{background:var(--pos-bg);color:var(--pos)} .check .ic.warn{background:var(--warn-bg);color:var(--warn)} .check .ic.error{background:var(--neg-bg);color:var(--neg)}
.check .dt{font-size:12.5px;color:var(--ink-3);grid-column:2}
.prose{max-width:68ch;font-size:14px;color:var(--ink-2)}
.prose h3{font:600 15px var(--f-display);color:var(--ink);margin:18px 0 4px}
.prose p{margin:0 0 8px} .prose code{font:12.5px var(--f-mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.error{background:var(--neg);color:#fff}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2)}
.empty h2{font:600 22px var(--f-display);color:var(--ink);margin-bottom:6px}
.note{font-size:12.5px;color:var(--ink-3)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.subnav .muted{font-size:12px;margin-right:4px}
.subnav a{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);text-decoration:none;background:var(--surface)}
.subnav a:hover{color:var(--ink);background:var(--surface-2)}
.tsec{scroll-margin-top:110px;min-width:0;max-width:100%}
.tsec>*+*{margin-top:18px}
.tsec+.tsec{margin-top:30px;padding-top:24px;border-top:1px solid var(--rule)}
.secttl{font:600 20px/1.2 var(--f-display);margin:0 0 14px;letter-spacing:-.01em}
.brief p{font-size:14.5px;line-height:1.65;margin:8px 0 0;max-width:80ch}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
/* notes on a position: a small icon that opens the note / thesis under the row (or inside the card) */
.nic{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:6px;padding:0;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink-2);cursor:pointer;vertical-align:middle}
.nic svg{width:13px;height:13px}
.nic[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.note-body{white-space:normal;font-size:12.5px;line-height:1.5;color:var(--ink-2);display:grid;gap:4px;max-width:80ch}
.note-body b{color:var(--ink);font-weight:600}
tr.note-row td{background:var(--surface-2)}
/* phone-first holdings: one card per position at 520px and below; the wide table stays for larger screens */
.hcards{display:none}
.hcard{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hc-name{font-size:12px;color:var(--ink-3);line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.hc-v{font:600 17px/1.2 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hc-v small{display:block;font:500 11.5px var(--f-ui);color:var(--ink-3)}
.hc-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:12px;color:var(--ink-3)}
.hc-row b{display:block;font-size:13.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hc-row b.pos{color:var(--pos)} .hc-row b.neg{color:var(--neg)}
@media (max-width:520px){.hold-tbl{display:none}.hcards{display:grid;gap:10px}}
/* watchlist: 52-week range with today's price marked */
.rng-w{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);min-width:150px}
.rng{position:relative;flex:1;height:6px;border-radius:3px;background:var(--surface-2);min-width:50px}
.rng i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--s1);transform:translateX(-50%)}
.jobs .dot{margin-right:6px}
.heads{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.heads li{display:flex;gap:8px;align-items:baseline;font-size:13.5px;line-height:1.45}
/* What if (Analysis): trade-plan lines. Desktop one row per line; phones stack side/mode, stock, amount and the summary */
.wilines{display:grid;gap:8px}
.wiline{display:grid;grid-template-columns:22px 86px minmax(150px,1.5fr) 128px minmax(90px,.8fr) minmax(200px,2fr) 36px;grid-template-areas:"n side stock mode amt info del";gap:8px 10px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.wiline.dep{grid-template-areas:"n side amt amt amt info del"}
.wiline .wi-n{grid-area:n;font:600 12px var(--f-mono);color:var(--ink-3)}
.wiline .wi-side{grid-area:side} .wiline .wi-stock{grid-area:stock;min-width:0} .wiline .wi-mode{grid-area:mode} .wiline .wi-amt{grid-area:amt;min-width:0} .wiline .wi-info{grid-area:info} .wiline .wi-del{grid-area:del;justify-self:end}
.wiline select,.wiline input{width:100%;min-width:0}
.wiline input[data-wi-f]{color:#2256c7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wiline input[data-wi-f]{color:#8db8ff}}
:root[data-theme="dark"] .wiline input[data-wi-f]{color:#8db8ff}
.wi-deplbl{font-weight:600;font-size:13px;color:var(--ink-2)}
.wi-info{font-size:12.5px;line-height:1.4;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.wi-info b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.wi-msg{color:var(--warn)}
.wi-cash{font-size:13px;color:var(--ink-2)}
.wi-cash b{color:var(--ink)} .wi-cash b.neg{color:var(--neg)}
.wi-warn{margin-top:8px;background:var(--neg-bg);color:var(--neg)}
.wi-mnote{font-size:11.5px;white-space:normal}
.wi-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .wiline{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;grid-template-areas:"n n del" "side mode mode" "stock stock stock" "amt amt amt" "info info info";padding:10px 12px}
  .wiline.dep{grid-template-areas:"n n del" "side amt amt" "info info info"}
  .wiline .wi-n::before{content:"Line "}
  .wiline select,.wiline input{min-height:40px;font-size:16px}
}
@media (max-width:520px){.wi-hname{display:none}.wikpis{grid-template-columns:repeat(2,minmax(0,1fr))}.wikpis .kpi{padding:12px}.wikpis .kpi .v{font-size:21px}}
.dcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.dcm{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--surface);min-width:0}
.dcm.none{background:var(--surface-2);border-style:dashed}
.dcm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dcm-h .num{font-weight:600;font-variant-numeric:tabular-nums} .dcm-h small{color:var(--ink-3);font-weight:500;font-size:11px}
.dcm-s{font-size:12px;color:var(--ink-3);margin-top:2px}
.dcm ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.dcl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;font-size:12.5px}
.dcl-v{text-align:right;font-weight:600}
.dcl-d{grid-column:1/-1;color:var(--ink-3);font-size:11.5px;line-height:1.45}

<script>
/* Portfolio engine — a line-by-line port of the workbook's ⚙️ Model tab.
   Every function is pure: data in, numbers out. Dates are 'YYYY-MM-DD', months 'YYYY-MM'. */
(function (root) {
  'use strict';
  // Bonus = corporate action: q new shares for free (amt 0); the average cost falls, nothing else moves.
  const TYPES = ['Deposit', 'Withdrawal', 'Buy', 'Sell', 'Dividend', 'Fee', 'Rebate', 'Bonus'];
  // Same-day order. Thndr prints a "Sell Same Day" before the buy it closes, so money in → buys → income → sells → money out.
  const DAY_ORDER = { Deposit: 0, Buy: 1, Bonus: 1, Dividend: 2, Rebate: 2, Fee: 2, Sell: 3, Withdrawal: 4 };
  // Sectors that hold parked cash rather than positions (same set as engine2.js); their round trips are not "trades".
  const CASH_LIKE = new Set(['Cash & Savings', 'Mutual Funds', 'Cash']);

  // ---------- date helpers ----------
  const pad = (n) => String(n).padStart(2, '0');
  const monthOf = (d) => d.slice(0, 7);
  const addMonths = (m, k) => {
    let [y, mo] = m.split('-').map(Number);
    mo += k;
    y += Math.floor((mo - 1) / 12);
    mo = ((mo - 1) % 12 + 12) % 12 + 1;
    return `${y}-${pad(mo)}`;
  };
  const eom = (m) => {
    const [y, mo] = m.split('-').map(Number);
    return `${m}-${pad(new Date(Date.UTC(y, mo, 0)).getUTCDate())}`;
  };
  const dayNum = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 86400000;
  const monthsBetween = (a, b) => {
    const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
    return (yb - ya) * 12 + (mb - ma);
  };
  const cairoToday = () => {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return new Date().toISOString().slice(0, 10); }
  };

  // ---------- stats helpers ----------
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const mean = (a) => (a.length ? sum(a) / a.length : 0);
  const stdevS = (a) => {
    if (a.length < 2) return 0;
    const m = mean(a);
    return Math.sqrt(sum(a.map((x) => (x - m) ** 2)) / (a.length - 1));
  };
  const covS = (a, b) => {
    const ma = mean(a), mb = mean(b);
    return sum(a.map((x, i) => (x - ma) * (b[i] - mb))) / (a.length - 1);
  };
  const slope = (y, x) => covS(y, x) / (stdevS(x) ** 2);
  const correl = (a, b) => covS(a, b) / (stdevS(a) * stdevS(b));

  // Excel-compatible XIRR (actual/365, Newton with bisection fallback)
  function xirr(flows) {
    if (!flows.length) return null;
    const t0 = dayNum(flows[0].date);
    const f = (r) => sum(flows.map((c) => c.amount / Math.pow(1 + r, (dayNum(c.date) - t0) / 365)));
    const df = (r) => sum(flows.map((c) => { const t = (dayNum(c.date) - t0) / 365; return -t * c.amount / Math.pow(1 + r, t + 1); }));
    let r = 0.1;
    for (let i = 0; i < 100; i++) {
      const v = f(r), d = df(r);
      if (!isFinite(v) || !isFinite(d) || d === 0) break;
      const nr = r - v / d;
      if (Math.abs(nr - r) < 1e-10) return nr > -1 ? nr : null;
      r = nr <= -1 ? (r - 1) / 2 : nr;
    }
    let lo = -0.9999, hi = 100;
    if (f(lo) * f(hi) > 0) return null;
    for (let i = 0; i < 300; i++) {
      const mid = (lo + hi) / 2;
      if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid;
    }
    return (lo + hi) / 2;
  }

  // ---------- ledger: average-cost engine (🗂️ Data helper columns K–P) ----------
  // Date, then type priority (DAY_ORDER), then original position — stable inside a priority.
  // opts.sameDay: 'type' (default) | 'ledger' (legacy: original row order inside a day, as the workbook had it).
  function sortLedger(tx, opts) {
    const byType = !(opts && opts.sameDay === 'ledger');
    const pr = (t) => (byType ? (DAY_ORDER[t.t] != null ? DAY_ORDER[t.t] : 2) : 0);
    return tx.map((t, i) => ({ ...t, _i: i })).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : pr(a) - pr(b) || a._i - b._i));
  }
  // A sell larger than the shares held is flagged r.oversold = q − held. Tolerance: 0.5 sh or 1% of the shares held; for fund
  // rows (MF account or a savings fund) 1% of the larger of shares held and units ever bought, because the savings fund's sells
  // run ~0.2% over its buys as interest accrues in extra units, and its small interest-only sells land after full redemption.
  // Trading cost (commission + exchange fees) of a stock trade: the net amount vs price × shares — Buy |amt| − p×q, Sell p×q − amt,
  // clamped at 0 and rounded to 2 dp. Fund rows (acc 'MF') and rows missing a price or share count carry no cost (null).
  function tradeCostRaw(t) {
    if ((t.t !== 'Buy' && t.t !== 'Sell') || t.acc === 'MF' || !(t.p > 0) || !(t.q > 0) || typeof t.amt !== 'number') return null;
    return t.t === 'Buy' ? Math.abs(t.amt) - t.p * t.q : t.p * t.q - t.amt;
  }
  function runLedger(tx, opts) {
    const run = {};
    return sortLedger(tx, opts).map((t) => {
      const r = { ...t, basis: 0 };
      const raw = tradeCostRaw(t);
      if (raw != null) r.cost = Math.max(0, Math.round(raw * 100) / 100);
      if (!t.a || (t.t !== 'Buy' && t.t !== 'Sell' && t.t !== 'Bonus')) return r;
      const s = run[t.a] || (run[t.a] = { sh: 0, cost: 0, bought: 0 });
      if (t.t === 'Buy') { s.sh += t.q || 0; s.bought += t.q || 0; s.cost += Math.abs(t.amt || 0); }
      else if (t.t === 'Bonus') { s.sh += t.q || 0; s.bought += t.q || 0; }
      else {
        const q = t.q || 0;
        const fundish = t.acc === 'MF' || /saving/i.test(t.a);
        if (q > s.sh + Math.max(0.5, 0.01 * (fundish ? Math.max(s.sh, s.bought) : s.sh))) r.oversold = q - s.sh;
        r.basis = s.sh > 0 ? (s.cost / s.sh) * q : 0;
        s.sh -= q; s.cost -= r.basis;
      }
      return r;
    });
  }

  // ---------- prices ----------
  // Latest of manual (asset.price/priceDate) and automatic (market.quotes[symbol]) wins; ties go to automatic.
  function effectivePrice(asset, market, settings) {
    if (!asset) return null;
    const man = asset.price > 0 ? { price: asset.price, date: asset.priceDate || settings.priceDate || null, source: 'manual' } : null;
    const q = market && market.quotes && asset.symbol ? market.quotes[asset.symbol] : null;
    const auto = q && q.price > 0 ? { price: q.price, date: q.date || null, source: 'auto', chg: q.chg } : null;
    if (auto && man) return (man.date || '') > (auto.date || '') ? man : auto;
    return auto || man;
  }

  // ---------- positions engine (⚙️ Model §C) ----------
  function positions(ledger, assets, market, settings, today, period, fallback) {
    const byName = {};
    (assets || []).forEach((a) => { byName[a.name] = a; });
    const order = [];
    const P = {};
    ledger.forEach((t) => {
      if ((t.t === 'Buy' || t.t === 'Bonus') && t.a && !P[t.a]) { P[t.a] = { name: t.a, firstBuy: t.d, lastSell: null, bought: 0, bonus: 0, sold: 0, buyCost: 0, proceeds: 0, soldBasis: 0, divs: 0 }; order.push(t.a); }
    });
    ledger.forEach((t) => {
      const p = P[t.a];
      if (t.t === 'Buy' && p) { p.bought += t.q || 0; p.buyCost += Math.abs(t.amt || 0); }
      if (t.t === 'Bonus' && p) { p.bonus += t.q || 0; }
      if (t.t === 'Sell' && p) { p.sold += t.q || 0; p.proceeds += t.amt || 0; p.soldBasis += t.basis; if (!p.lastSell || t.d > p.lastSell) p.lastSell = t.d; }
    });
    const thr = settings.openThreshold ?? 0.5;
    const rows = order.sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' })).map((name) => {
      const p = P[name], a = byName[name] || {};
      const sym = a.symbol || '';
      p.divs = sum(ledger.filter((t) => t.t === 'Dividend' && t.a && (t.a === name || (sym && t.a === sym))).map((t) => t.amt || 0));
      const open = p.bought + p.bonus - p.sold;
      const isOpen = open > thr;
      let px = isOpen ? effectivePrice(a, market, settings) : null;
      if (isOpen && !px && fallback) { const f = fallback(name); if (f) px = { price: f.p, date: f.d, source: 'model' }; }
      const openCost = isOpen ? p.buyCost - p.soldBasis : 0;
      const mv = isOpen && px ? open * px.price : null;
      const unreal = isOpen ? (mv != null ? mv - openCost : null) : 0;
      const realized = p.proceeds - p.soldBasis;
      const total = realized + (unreal || 0) + p.divs;
      const holdEnd = isOpen ? today : (p.lastSell || p.firstBuy);
      const closedInPeriod = !isOpen && p.lastSell && period && p.lastSell >= `${period.from}-01` && p.lastSell <= eom(period.to);
      const stop = +a.stop || 0, target = +a.target || 0;
      return {
        name, symbol: sym, sector: a.sector || 'Unclassified', firstBuy: p.firstBuy, lastSell: p.lastSell,
        bought: p.bought, bonus: p.bonus, sold: p.sold, open, status: isOpen ? 'Open' : 'Closed',
        buyCost: p.buyCost, proceeds: p.proceeds, soldBasis: p.soldBasis, openCost, divs: p.divs, realized,
        price: px ? px.price : null, priceDate: px ? px.date : null, priceSource: px ? px.source : null, chg: px && px.source === 'auto' ? px.chg : null,
        avgCost: isOpen && open ? openCost / open : null,
        mv, unreal, total, roi: p.buyCost > 0 ? total / p.buyCost : 0,
        holdDays: dayNum(holdEnd) - dayNum(p.firstBuy),
        outcome: !isOpen && p.sold > 0 ? (total > 0 ? 'WIN' : 'LOSS') : '',
        shareGap: !isOpen ? Math.round(open) : 0,
        closedInPeriod: !!closedInPeriod,
        stop, target,
        riskToStop: isOpen && stop > 0 && px && px.price > stop ? open * (px.price - stop) : 0,
      };
    });
    const openRows = rows.filter((r) => r.status === 'Open');
    const mvTotal = sum(openRows.map((r) => r.mv || 0));
    openRows.forEach((r) => { r.weight = mvTotal ? (r.mv || 0) / mvTotal : 0; });
    const trips = roundTrips(ledger, byName, thr, period);
    const tripCount = {}; trips.forEach((t) => { tripCount[t.name] = (tripCount[t.name] || 0) + 1; });
    rows.forEach((r) => { r.trips = tripCount[r.name] || 0; });
    return { rows, open: openRows, mvTotal, trips };
  }

  // Closed round trips: a trip starts at the first Buy/Bonus while the position is flat (open ≤ threshold) and ends at the Sell
  // that brings it back to flat. A stock bought, sold out and bought again later is two trips (pos.rows keeps one row per name).
  // Dividends dated inside [firstBuy, lastSell] belong to that trip; one paid while the position is flat (Thndr pays days
  // to months after the ex-date, often after the shares were sold) goes to the trip that closed most recently before it,
  // while one paid while shares are held stays with the open position. A Sell with no open trip (the savings fund's
  // interest-only sells after full redemption) is folded into that asset's previous trip. Newest first (by lastSell).
  function roundTrips(ledger, byName, thr, period) {
    const trips = [], cur = {}, held = {}, last = {};
    const symOf = {}; Object.keys(byName).forEach((n) => { if (byName[n].symbol) symOf[byName[n].symbol] = n; });
    const finish = (tr) => {
      tr.realized = tr.proceeds - tr.soldBasis; tr.total = tr.realized + tr.divs;
      tr.roi = tr.buyCost > 0 ? tr.total / tr.buyCost : 0;
      tr.outcome = tr.total > 0 ? 'WIN' : 'LOSS';
      tr.holdDays = dayNum(tr.lastSell) - dayNum(tr.firstBuy);
      tr.closedInPeriod = !!(period && tr.lastSell >= `${period.from}-01` && tr.lastSell <= eom(period.to));
    };
    ledger.forEach((t) => {
      if (!t.a || (t.t !== 'Buy' && t.t !== 'Sell' && t.t !== 'Bonus' && t.t !== 'Dividend')) return;
      const name = t.t === 'Dividend' && !byName[t.a] && symOf[t.a] ? symOf[t.a] : t.a, a = byName[name] || {};
      const h = held[name] || 0;
      if (t.t === 'Dividend') {
        const tr = cur[name] || (h <= thr ? last[name] : null);
        if (tr) { tr.divs += t.amt || 0; if (tr !== cur[name]) finish(tr); }
      } else if (t.t === 'Buy' || t.t === 'Bonus') {
        if (!cur[name] && h <= thr) cur[name] = { name, symbol: a.symbol || '', sector: a.sector || 'Unclassified', trip: (last[name] ? last[name].trip : 0) + 1, firstBuy: t.d, lastSell: null, bought: 0, bonus: 0, sold: 0, buyCost: 0, proceeds: 0, soldBasis: 0, divs: 0 };
        const tr = cur[name];
        if (tr) { if (t.t === 'Buy') { tr.bought += t.q || 0; tr.buyCost += Math.abs(t.amt || 0); } else tr.bonus += t.q || 0; }
        held[name] = h + (t.q || 0);
      } else {
        held[name] = h - (t.q || 0);
        let tr = cur[name];
        if (!tr) { tr = last[name]; if (!tr) return; } // orphan sell → previous trip
        tr.sold += t.q || 0; tr.proceeds += t.amt || 0; tr.soldBasis += t.basis || 0;
        if (!tr.lastSell || t.d > tr.lastSell) tr.lastSell = t.d;
        if (tr === cur[name]) { if (held[name] <= thr) { finish(tr); trips.push(tr); last[name] = tr; delete cur[name]; } }
        else finish(tr);
      }
    });
    return trips.sort((x, y) => (x.lastSell < y.lastSell ? 1 : x.lastSell > y.lastSell ? -1 : y.trip - x.trip));
  }

  // ---------- monthly engine (⚙️ Model §A) ----------
  // marks: {"YYYY-MM": {cash, securities, benchReturn, benchClose, usdegp, cpi, provisional, note}}
  // live (optional): {month, cash, securities, benchClose, prevBenchClose, usdegp} replaces a provisional/missing current-month row.
  // opts.flowTiming: 'dietz' (default) — Modified Dietz, each flow weighted by the fraction of the month it was invested
  //                  (start-of-day: a deposit on the 1st counts fully, on the 16th of a 31-day month 16/31);
  //                  'start' — the workbook's legacy formula, every flow assumed on day 1. row.retSimple always keeps the legacy figure.
  // Gaps: a month with no value keeps has=false, ret=null and is marked gap=true (spans=0). The next month WITH a value
  // measures its return over the whole span since the last valued month: opening = that month's value, flows and activity
  // (deposits, withdrawals, netFlow, weightedFlow, dividends, buys, sells, trades) summed over every month of the span,
  // Modified Dietz weights over the span's total calendar days, benchmark/FX/CPI compounded over the span; row.spans = months
  // covered (1 normally), row.spanFrom = first month of the span. A gap row keeps its own month's activity for display only —
  // it is never in a period's rows, so nothing double-counts.
  // Cash benchmark: row.cashRet = what cash at the CBE policy rate earned over the row's span, (1 + annual rate)^(1/12) − 1 per
  // calendar month, compounded. The rate of month k is marks[k].cashRate; else opts.policyRate {rate, date: 'YYYY-MM'} (the
  // market job's current rate, for months from its date on — the live month); else settings.riskFree, and row.cashFallback = true.
  // Trading costs: row.tradingCost / row.tradedValue sum ledger r.cost and p×q of the cost-bearing trades in the span;
  // row.retGross = the same return with the month's trading cost added back to the month-end value (approximation).
  function monthly(settings, marks, ledger, live, opts) {
    const dietz = !(opts && opts.flowTiming === 'start');
    const pol = opts && opts.policyRate && typeof opts.policyRate.rate === 'number' && opts.policyRate.date ? opts.policyRate : null;
    const cashRateOf = (k) => {
      const x = marks && marks[k];
      if (x && typeof x.cashRate === 'number') return { rate: x.cashRate, fallback: false };
      if (pol && k >= String(pol.date).slice(0, 7)) return { rate: pol.rate, fallback: false };
      return { rate: typeof settings.riskFree === 'number' ? settings.riskFree : null, fallback: true };
    };
    const out = [];
    const inc = settings.inception;
    const keys = Object.keys(marks || {}).filter((k) => k >= inc).sort();
    let last = keys.length ? keys[keys.length - 1] : inc;
    if (live && live.month > last) last = live.month;
    const n = monthsBetween(inc, last) + 1;
    let prev = null; // the last VALUED row (or null before the first one)
    for (let i = 0; i < n; i++) {
      const m = addMonths(inc, i);
      let mk = { ...(marks[m] || {}) };
      let isLive = false;
      if (live && live.month === m && (!marks[m] || marks[m].provisional || marks[m].cash == null)) {
        mk = { ...mk, cash: live.cash, securities: live.securities, provisional: true };
        if (live.benchClose) mk.benchClose = live.benchClose;
        if (live.usdegp) mk.usdegp = live.usdegp;
        isLive = true;
      }
      const has = typeof mk.cash === 'number' && typeof mk.securities === 'number';
      // the span this row's return covers: this month alone, or everything since the last valued month
      const spanFrom = has ? (prev ? addMonths(prev.month, 1) : inc) : m;
      const spans = has ? monthsBetween(spanFrom, m) + 1 : 0;
      const from = `${spanFrom}-01`, to = eom(m);
      const inM = ledger.filter((t) => t.d >= from && t.d <= to);
      const s = (type) => sum(inM.filter((t) => t.t === type).map((t) => t.amt || 0));
      const deposits = Math.abs(s('Deposit')), withdrawals = Math.abs(s('Withdrawal'));
      // day-weighted net flow (Modified Dietz): w = (D − dayIndex + 1) / D over the span's D calendar days (one month normally)
      const D = dayNum(to) - dayNum(from) + 1;
      const weightedFlow = sum(inM.filter((t) => t.t === 'Deposit' || t.t === 'Withdrawal').map((t) => ((D - (dayNum(t.d) - dayNum(from) + 1) + 1) / D) * (t.amt || 0)));
      const row = {
        month: m, has, gap: !has, spans, spanFrom, cash: mk.cash, securities: mk.securities, value: has ? mk.cash + mk.securities : null,
        deposits, withdrawals, netFlow: deposits - withdrawals, weightedFlow, dividends: s('Dividend'),

    // the closest candidate wins: for large n the neighbours (49/48, 51/50) are all within 0.1% of each other
    let kind = null, best = 0.001;
    for (let n = 1; n <= 50; n++) if (off((n + 1) / n) <= best) { best = off((n + 1) / n); kind = `1-for-${n}`; }
    if (off(3) <= best) { best = off(3); kind = '2-for-1'; }
    if (!kind) return null;
    const x = Math.round((statementQty - ledgerQty) * 10000) / 10000;
    return `looks like a ${kind} bonus issue: add a Bonus row of ${x} shares dated before the snapshot`;
  }
  function PEsort(rows) { return rows.map((t, i) => ({ t, i })).sort((a, b) => (a.t.d < b.t.d ? -1 : a.t.d > b.t.d ? 1 : a.i - b.i)).map((x) => x.t); }
  function addDays(d, k) { const t = new Date(Date.parse(d) + k * 864e5); return t.toISOString().slice(0, 10); }

  // ---------- account lock ----------
  // A Thndr document is used only when its header names THIS portfolio's account: statements and position snapshots carry
  // "Unified Code <customer number>" and the holder's name; invoices carry the holder's name on their first line.
  // settings.account = { unifiedCode, holder }. The code is definitive when both sides have one; otherwise the holder's
  // whole name must appear in the header as one contiguous phrase (whitespace-normalised, case-insensitive; the words
  // scattered around the header are not enough). Thndr's account statement prints the name in a left column with
  // "Start Balance n" / "Name" / "End Balance n" from the right column interleaved between its lines, so those fixed
  // labels are removed before the phrase test. A portfolio with neither set imports nothing.
  const norm = (s) => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  // The holder name as typed matches when it is printed as it is, or (two words or more) when its words appear in the
  // header in the same order within a few words of each other: "Khaled Amin" matches "Khaled Samer Adel Amin", the full
  // legal name Thndr prints, since people type the short name they go by.
  function holderSeenIn(head, holder) {
    const h = norm(head.replace(/\b(Start|End) Balance\s*-?[\d,]+(?:\.\d+)?/gi, ' ').replace(/(^|\s)Name(?=\s|$)/g, ' '));
    const want = norm(holder);
    if (!want) return false;
    if ((' ' + h + ' ').includes(' ' + want + ' ')) return true;
    const w = want.split(' ').filter(Boolean), t = h.split(' ');
    if (w.length < 2) return false;
    for (let i = 0; i < t.length; i++) {
      if (t[i] !== w[0]) continue;
      let k = 1;
      for (let j = i + 1; j < t.length && j <= i + 7 && k < w.length; j++) if (t[j] === w[k]) k++;
      if (k === w.length) return true;
    }
    return false;
  }
  function accountOf(docs, holder) {
    const heads = (docs || []).map((d) => ((d && d.lines) || d || []).slice(0, 10).join(' ').replace(/\s+/g, ' '));
    const codes = [...new Set(heads.map((h) => (h.match(/Unified Code\s*(\d{4,})/i) || [])[1]).filter(Boolean))];
    const head = heads.join(' | ');
    return { codes, code: codes[0] || null, head, holderSeen: holderSeenIn(head, holder) };
  }
  function ownerCheck(docs, settings) {
    const acc = (settings && settings.account) || {};
    const code = String(acc.unifiedCode || '').trim(), holder = String(acc.holder || '').trim();
    const a = accountOf(docs, holder);
    const r = { code: a.code, holderSeen: a.holderSeen, error: null };
    if (!code && !holder) r.error = 'cannot be used: this portfolio has no Thndr account holder set (Inputs → Settings → Thndr account)';
    else if (a.codes.length > 1) r.error = `mixes Thndr accounts ${a.codes.join(' and ')}`;
    else if (code && a.code) { if (a.code !== code) r.error = `belongs to Thndr account ${a.code}, not this portfolio's account ${code}`; }
    else if (holder) {
      if (!a.holderSeen) {
        // the name Thndr printed: "... Currency EGP <name> Start Balance" (statement), "Invoice <name> Custodian:" (invoice)
        const other = [/Currency\s+[A-Z]{3}\s+(.+?)\s+Start Balance/i, /Invoice\s+(.+?)\s+Custodian/i, /Client Name\s+(.+?)\s+Unified Code/i]
          .map((re) => (a.head.match(re) || [])[1]).find(Boolean);
        r.error = `is not in the name of ${holder}` + (other && other.length <= 60 ? ` (it is in the name of ${other.trim()})` : ` (its header reads "${a.head.slice(0, 100)}")`);
      }
    }
    else r.error = 'has no Unified Code in its header, so the account could not be confirmed';
    return r;
  }

  // Tracking start (settings.trackFrom, set for accounts made on the site): the opening rows typed at sign-up stand for
  // everything up to and including that day, so a statement is used from the next day only (null when it ends before).
  function fromTrackStart(st, tf) {
    if (!tf || !st || !st.cash || st.from > tf) return st;
    if (st.to <= tf) return null;
    const d = new Date(Date.parse(tf + 'T00:00:00Z') + 864e5).toISOString().slice(0, 10), keep = (r) => r.date && r.date >= d;
    return Object.assign({}, st, { from: d, cash: Object.assign({}, st.cash, { start: null, rows: st.cash.rows.filter(keep) }), mf: st.mf ? Object.assign({}, st.mf, { rows: st.mf.rows.filter(keep) }) : st.mf });
  }

  const api = { attachments, pdfLines, parseDoc, parseStatement, reconcile, classify, accountRows, accountOf, ownerCheck, authCheck, eom, fromTrackStart };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.TS = api;
})(this);

<script>

// ---------- state ----------
const S = {

window.pdToast = (m, k) => toast(m, k);

function errText(e){ const c=e&&e.code; if(c==='invalid_argument') return 'Saving was refused. You may only have view access to this page.'; if(c==='quota_exceeded') return 'The portfolio could not be saved (storage is full). Tell the site owner.'; if(c==='resource_exhausted') return 'Too many saves in a row. Wait a few seconds and try again.'; return 'Could not save: '+(e&&e.message||'unknown error')+'. Try again in a moment.'; }
async function save(fn, ok){ try{ await fn(); if(ok) toast(ok); document.querySelectorAll('#main .dirty').forEach(x=>x.classList.remove('dirty')); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); S.pending=false; renderTab(true); return true; }catch(e){ console.error(e); if(e&&e.code==='invalid_argument') S.readOnly=true; toast(errText(e),'error'); return false; } }

function allTx(){

}
// dataset(true) swaps in month-close estimates for closed months that still have no statement (PA.estimateMarks: ledger cash +

function estMarks(){ try{ if(!S.history || !Object.keys(S.history).length) return S.marks; return PA.estimateMarks(S.settings, S.marks, PE.runLedger(allTx()), S.assets, pbook(), PE.cairoToday()); }catch(e){ console.error(e); return S.marks; } }

    if(S.R.stats && S.R.stats.label) S.R.stats.label = plabel(S.R.stats.label);

    S.heads = null; try{ S.heads = PA.headsUp({ today, tx:allTx(), assets:S.assets, settings:S.settings, marks:S.marks, market:S.market, history:S.history }); }catch(e){ console.error(e); }

}
function renderEmpty(){ $('#main').innerHTML = `<div class="empty"><h2>No portfolio data yet</h2><p>Nothing has been added to this portfolio yet.</p></div>`; $('#period').innerHTML=''; }

// Live or saved copy: on the site, lock.js sets #pd-offline data-state to 'online' | 'offline' | 'saved'; 'offline' and 'saved'

function pricesLive(){ const el=document.getElementById('pd-offline'); const st=el&&el.dataset.state; return !(st==='offline'||st==='saved'); }

// ---------- period selector ----------
// plain-English labels; the values stay the engine's period types
const PT = [['Month','This month'],['Quarter','This quarter'],['YTD','This year'],['Year','Calendar year'],['Last 12 Months','Last 12 months'],['Since Inception','All time'],['Custom','Custom']];

$('#period').addEventListener('click', e => { const b=e.target.closest('[data-pt]'); if(!b) return; S.sel.type=b.dataset.pt; if(S.sel.type==='Custom'&&!S.sel.from){ S.sel.from=S.R.range.from; S.sel.to=S.R.range.to; } ls.set('pd.sel',S.sel); recompute(); });

const charts = [];
function chartSlot(id, spec, h){ charts.push({id, spec, h}); return `<div class="chart" id="${id}" style="height:${h}px" data-testid="${id}"></div>`; }
function mountCharts(){ ro.disconnect(); const list = charts.splice(0); list.forEach(c => { const el=document.getElementById(c.id); if(el){ el._spec=c; drawChart(el); ro.observe(el);} }); }
var ro = new ResizeObserver(entries => entries.forEach(en => { const el=en.target; if(el._w!==Math.round(en.contentRect.width)) drawChart(el); }));
function niceTicks(min,max,count=5){ if(min===max){ max=min+1; } const span=max-min; const step0=span/count; const mag=Math.pow(10,Math.floor(Math.log10(step0))); const f=step0/mag; const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10)); return t; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawChart(el){
  const {spec,h}=el._spec; const W=Math.max(280,Math.round(el.clientWidth)); el._w=W;
  const kind=spec.kind; const labels=spec.labels; const n=labels.length;
  const padL=spec.padL||56, padR=16, padT=12, padB=26; const iw=W-padL-padR, ih=h-padT-padB;
  const all=[]; spec.series.forEach(s=>s.values.forEach(v=>{ if(v!=null&&isFinite(v)) all.push(v); }));
  let min=Math.min(0,...all), max=Math.max(0,...all); if(spec.minZero===false){ min=Math.min(...all); max=Math.max(...all); const pad=(max-min)*0.08||1; min-=pad; max+=pad; }
  const ticks=niceTicks(min,max,Math.max(3,Math.round(ih/48))); min=ticks[0]; max=ticks[ticks.length-1];
  const y=v=>padT+ih-(v-min)/(max-min)*ih;
  const band=iw/Math.max(1,n); const xC=i=> kind==='bar'? padL+band*(i+.5) : padL+(n<=1?iw/2:i*iw/(n-1));
  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/58))));
  let g=`<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img" aria-label="${esc(spec.title||'chart')}">`;
  ticks.forEach(t=>{ g+=`<line class="${t===0?'zero':'gl'}" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end">${esc(spec.yFmt(t,true))}</text>`; });
  labels.forEach((l,i)=>{ if(i%every===0 || (kind!=='bar'&&i===n-1&&n>1&&(n-1)%every>every/2)) g+=`<text x="${xC(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`; });
  if(kind==='bar'){
    const k=spec.series.length; const gap=2; const bw=Math.max(2,Math.min(26,(band*0.72-(k-1)*gap)/k));
    spec.series.forEach((s,si)=>{ s.values.forEach((v,i)=>{ if(v==null) return; const x0=xC(i)-(k*bw+(k-1)*gap)/2+si*(bw+gap); const y0=y(Math.max(0,v)), y1=y(Math.min(0,v)); const hh=Math.max(1,y1-y0); const col = s.colorFn? s.colorFn(v) : s.color; const r=Math.min(3,bw/2,hh);
      g+= v>=0 ? `<path d="M${x0},${y1} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${y1} Z" fill="${col}"/>` : `<path d="M${x0},${y0} V${y1-r} Q${x0},${y1} ${x0+r},${y1} H${x0+bw-r} Q${x0+bw},${y1} ${x0+bw},${y1-r} V${y0} Z" fill="${col}"/>`; }); });
  } else {
    spec.series.forEach(s=>{
      const pts=s.values.map((v,i)=>v==null?null:[xC(i),y(v)]);
      let d=''; pts.forEach((p,i)=>{ if(!p) return; d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); });
      if(s.area){ const f=pts.filter(Boolean); if(f.length) g+=`<path d="${d}L${f[f.length-1][0]},${y(Math.max(min,0))}L${f[0][0]},${y(Math.max(min,0))}Z" fill="${s.color}" opacity=".16"/>`; }
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      const last=pts.map((p,i)=>[p,i]).filter(x=>x[0]).pop(); if(last) g+=`<circle cx="${last[0][0]}" cy="${last[0][1]}" r="4" fill="${s.color}" stroke="${cssVar('--surface')}" stroke-width="2"/>`;
    });
  }
  g+=`<line id="${el.id}-x" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" stroke="${cssVar('--ink-3')}" stroke-dasharray="3 3" opacity="0"/>`;
  g+=`<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=g;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xl=el.querySelector('#'+CSS.escape(el.id+'-x'));
  const move=(ev)=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width; let i = kind==='bar'? Math.floor((px-padL)/band) : Math.round((px-padL)/(iw/Math.max(1,n-1))); i=Math.max(0,Math.min(n-1,i));
    const rows=spec.series.map(s=>{ const v=s.values[i]; return v==null?'':`<div><span class="sw" style="background:${s.colorFn?s.colorFn(v):s.color}"></span>${esc(s.name)} <b>${esc(spec.yFmt(v))}</b></div>`; }).join('');
    tip.innerHTML=`<div class="muted" style="color:inherit;opacity:.75">${esc(spec.tipLabel?spec.tipLabel(i):labels[i])}</div>${rows}${spec.tipExtra?spec.tipExtra(i):''}`; tip.hidden=false;
    const cx=xC(i)*r.width/W; tip.style.left=Math.max(70,Math.min(r.width-70,cx))+'px'; tip.style.top='6px'; tip.style.transform='translate(-50%,0)';
    xl.setAttribute('x1',xC(i)); xl.setAttribute('x2',xC(i)); xl.setAttribute('opacity','.8'); };
  const leave=()=>{ tip.hidden=true; xl.setAttribute('opacity','0'); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',leave); svg.addEventListener('pointerdown',move);
}
const C = { s1:()=>cssVar('--s1'), s2:()=>cssVar('--s2'), pos:()=>cssVar('--pos'), neg:()=>cssVar('--neg'), ink3:()=>cssVar('--ink-3') };
const pctAxis=(v,axis)=> axis ? (v*100).toFixed(Math.abs(v)<0.1&&v!==0?1:0).replace('-','−')+'%' : pct(v,2);

// ---------- shared bits ----------
function kpi(label, value, detail, cls='', unit=''){ return `<div class="kpi ${cls}"><div class="eyebrow">${label}</div><div class="v">${value}${unit?`<small>${unit}</small>`:''}</div>${detail?`<div class="d">${detail}</div>`:''}</div>`; }
function dayPL(){ const R=S.R; let pl=0, base=0; R.pos.open.forEach(r=>{ if(r.chg!=null && r.priceSource==='auto' && r.mv){ const prev=r.mv/(1+r.chg/100); pl+=r.mv-prev; base+=prev; } }); return {pl, pct: base? pl/base : null}; }
function checkSummary(){ const c=S.R.checks; const e=c.filter(x=>x.status==='error').length, w=c.filter(x=>x.status==='warn').length; return e? {cls:'err',text:`${e} check${e>1?'s':''} failing`} : w? {cls:'warn',text:`All pass · ${w} warning${w>1?'s':''}`} : {cls:'ok',text:'All checks pass'}; }
// The headline time-weighted return: monthly Modified Dietz (default) or, when Settings say so, the daily-linked chain
// (st.twrDaily from the engine; the page's own daily series when an older engine has none). Monthly rows stay Modified Dietz.
function dailyTwrOf(st){ if(st.twrDaily!==undefined) return st.twrDaily; try{ if(PA.dailyTwr && S.D){ const x=PA.dailyTwr(S.D, S.R.range); if(x&&x.twr!=null) return x.twr; } }catch(e){ console.error(e); } const ds=dailyS(); return ds?ds.twr:null; }
function headTwr(st){ const want=(S.settings&&S.settings.returnMethod)==='daily';
  if(st.returnMethod!==undefined && st.headlineTwr!==undefined){ const daily=st.returnMethod==='daily'; return {v:st.headlineTwr, daily, label:daily?'daily-linked':'monthly, Modified Dietz', fallback:want&&!daily}; }
  const d=want?dailyTwrOf(st):null;
  return want&&d!=null ? {v:d, daily:true, label:'daily-linked'} : {v:st.twr, daily:false, label:'monthly, Modified Dietz', fallback:want}; }
// Cash benchmark: each month's CBE policy rate (months[].cashRet), chained over the selected period
const CASH_NOTE = 'CBE policy rate — a proxy for what cash in a savings fund earns';
function cashCum(rows){ if(!rows.some(r=>r.cashRet!=null)) return null; let c=1; return rows.map(r=>{ if(r.cashRet==null) return null; c*=1+r.cashRet; return c-1; }); }
const aheadOfCash = (st) => st.aheadOfCash ?? (st.cashTwr!=null&&st.twr!=null ? st.twr-st.cashTwr : null);
// Where a ledger row came from (same rule as the engine's R.provenance): Thndr statement, trade invoice, typed, or manual
const PROV = {statement:['Statement','win','Booked or confirmed from a Thndr statement'], invoice:['Invoice','auto','Booked from a Thndr trade invoice email'], typed:['Typed','man','Typed or copied in by hand (or from the workbook)'], manual:['Manual','stale','Entered as a manual correction']};
function provOf(t){ const s=String((t&&t.src)||''); return /^stmt-/.test(s)||s==='statement' ? 'statement' : /^invoice-/.test(s) ? 'invoice' : s==='manual' ? 'manual' : 'typed'; }
// Rows not confirmed by a statement: the engine's R.provenance.unverified, or the same rule here for an older engine
function unverifiedRows(){ const R=S.R; const tx=allTx(); const byId=new Map(tx.map(t=>[t.id,t]));
  if(R.provenance && Array.isArray(R.provenance.unverified)) return R.provenance.unverified.map(id=>byId.get(id)).filter(Boolean);
  const stm=new Set(Object.keys(S.marks||{}).filter(m=>(S.marks[m]||{}).source==='statement'));
  return tx.filter(t=>stm.has(String(t.d).slice(0,7)) && !['statement','invoice'].includes(provOf(t))); }
// Trading cost of one ledger row (engine r.cost; the same rule here for an older engine): commission = |amount| − price × shares
function costOf(r){ if(r.cost!=null) return r.cost; if((r.t!=='Buy'&&r.t!=='Sell')||r.acc==='MF'||r.p==null||r.q==null) return 0; const g=r.p*r.q; const c=r.t==='Buy'?Math.abs(r.amt)-g:g-r.amt; return Math.max(0,Math.round(c*100)/100); }

const JOB = { marketCutoffMin: 16*60, syncHours: 22 };   // market job 3:10 PM → counted from 4 PM; inbox job 6:17 PM + 10:17 PM → longest normal gap 20 h
function cairoParts(t){ const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).map(x=>[x.type,x.value])); return {wd:p.weekday, day:`${p.year}-${p.month}-${p.day}`, min:(+p.hour%24)*60+(+p.minute)}; }
const isSession = (day) => { const [y,m,d]=day.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay()<=4; };   // Sun(0)…Thu(4)
const dayBefore = (day) => { const [y,m,d]=day.split('-').map(Number); return new Date(Date.UTC(y,m-1,d-1)).toISOString().slice(0,10); };
// the latest EGX session day whose closing prices the market job should already have written
function lastSessionDay(now){ const c=cairoParts(now); let d=c.day; if(isSession(d)&&c.min>=JOB.marketCutoffMin) return d; d=dayBefore(d); while(!isSession(d)) d=dayBefore(d); return d; }
function jobsStatus(now=Date.now()){
  const m=S.market||{}, sy=S.sync; const mAt=m.jobAsOf||m.asOf||null;
  const market = mAt ? {at:mAt, ok: cairoParts(Date.parse(mAt)).day>=lastSessionDay(now)} : {at:null, ok:false};
  const sAt = sy ? ((sy.heartbeat&&sy.heartbeat.sync)||sy.lastRun||null) : null;
  const sync = !sy ? {at:null, ok:null, none:true} : sAt ? {at:sAt, ok:(now-Date.parse(sAt))/36e5<=JOB.syncHours} : {at:null, ok:false};
  const siteAt = window.pdDataAt ? window.pdDataAt() : null;
  const site = window.pdDataAt ? {at:siteAt, ok: siteAt ? !(window.pdDataStale && window.pdDataStale(siteAt, now)) : false} : {at:null, ok:null, page:true};
  return {market, sync, site};
}

// Plain-language summary of the selected period, for readers who don't want to decode the tiles.
function briefPanel(){
  const R=S.R, st=R.stats, rows=st.rows, last=rows[rows.length-1]; const cash=R.liveCash??R.settings.cash; const total=cash+R.pos.mvTotal;
  const c=contributors(); const s=[];
  const vsIdx = st.benchTwr!=null&&st.alpha!=null ? ` against <b>${pct(st.benchTwr)}</b> for EGX30 Capped, ${st.alpha>=0?'ahead of the index by':'behind the index by'} <b class="${sgn(st.alpha)}">${pct(Math.abs(st.alpha),1,false)}</b>` : ' (the EGX30 Capped return is incomplete for this period, so there is no index comparison)';
  s.push(`<b>${esc(st.label)}</b>: the portfolio returned <b class="${sgn(st.twr)}">${pct(st.twr)}</b>${vsIdx}${st.n>1?`, with ${st.posMonths} of ${st.n} months positive and a worst month of ${pct(st.worst.ret)} (${M(st.worst.month)})`:''}.`);
  const ahead=aheadOfCash(st);
  if(st.cashTwr!=null && ahead!=null) s.push(`<span data-testid="brief-cash">Cash at the central-bank rate would have returned ${pct(st.cashTwr)}; the portfolio is <b class="${sgn(ahead)}">${num(Math.abs(ahead)*100,1)} points ${ahead>=0?'ahead':'behind'}</b>.</span>`);
  // the latest-month sentence only when the period is longer than that month (a one-month period already said it above)
  if(rows.length>1) s.push(`${M(last.month)}${last.live?' so far':''}: <b class="${sgn(last.ret)}">${pct(last.ret)}</b>${last.bench!=null?` vs ${pct(last.bench)} for the index`:''}.`);
  s.push(`Today the portfolio is worth <b>${egp(total)} EGP</b>, of which ${egp(cash)} EGP is cash, across ${R.pos.open.length} positions; the largest is ${esc(R.conc.largest)} at ${pct(R.conc.largestWeight,1,false)}.`);
  if(c.length) s.push(`Since inception the biggest contributors are ${c.slice(0,3).map(x=>`${esc(x.sym)} +${egp(x.total)}`).join(', ')}${c.some(x=>x.total<0)?`; the biggest detractor is ${esc(c[c.length-1].sym)} −${egp(Math.abs(c[c.length-1].total))}`:''} (EGP, realized + unrealized + dividends).`);
  s.push(...moneyWeightedSentences(R));
  return `<div class="panel brief" data-testid="brief"><div class="eyebrow">In brief</div><p>${s.join(' ')} <a href="#analysis" data-go="analysis">Read the full review on the Analysis tab →</a></p></div>`;
}
// Heads-up list: ex-dividend dates, targets/stops hit and drawdown worked out live on the page (PA.headsUp, the same checks
// the inbox job runs), plus the inbox job's overdue-statement items (sync/state.digest) when there is an inbox job.
const HEADS = {exdiv:['Ex-dividend','auto'], target:['Target','win'], stop:['Stop','loss'], drawdown:['Drawdown','loss'], statement:['Statement','stale']};
function headsUp(){ const dg=S.sync&&S.sync.digest; const live=(S.heads&&S.heads.items)||[];
  const job=(dg&&Array.isArray(dg.items))?dg.items.filter(x=>x&&x.text&&(x.kind==='statement'||!S.heads)):[];
  const seen=new Set(), items=[...live,...job].filter(x=>x&&x.text&&!seen.has(x.key||x.text)&&seen.add(x.key||x.text)); if(!items.length) return '';
  return `<div class="panel" data-testid="heads-up"><div class="eyebrow">Heads-up <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· ${S.heads?'as of the latest prices':dg&&dg.at?esc(cairoAt(dg.at)):''}</span></div>
    <ul class="heads">${items.map(x=>{ const k=HEADS[x.kind]||['Note','man']; return `<li data-testid="heads-up-item"><span class="pill ${k[1]}">${k[0]}</span><span>${esc(x.text)}</span></li>`; }).join('')}</ul></div>`; }
// Calendar months covered by the selected period (used to decide whether an annual XIRR is meaningful).
function periodMonths(range){ const [y1,m1]=range.from.split('-').map(Number), [y2,m2]=range.to.split('-').map(Number); return (y2-y1)*12+(m2-m1)+1; }
// One sentence per basis: the money-weighted figure (annualized only for 12+ month periods), then the real time-weighted one.
function moneyWeightedSentences(R){
  const st=R.stats, out=[]; const pm=periodMonths(R.range);
  if(st.xirr!=null){ if(pm>=12) out.push(`Money-weighted, your own capital has compounded at ${pct(st.xirr)} a year.`); else if(st.mwrPeriod!=null) out.push(`Money-weighted, your own capital returned ${pct(st.mwrPeriod)} over the period.`); }
  const real = st.realTwr ?? st.realTwrPartial;
  if(real!=null) out.push(`After Egyptian inflation the portfolio's time-weighted return is ${pct(real)}${st.realThrough?` (through ${M(st.realThrough)})`:''}.`);
  return out;
}
function contributors(){ return S.R.pos.rows.filter(r=>r.bought>0).map(r=>({sym:r.symbol||r.name,name:r.name,total:r.total,status:r.status,realized:r.realized,unreal:r.unreal||0,divs:r.divs})).sort((a,b)=>b.total-a.total); }
function contributorsList(){ const c=contributors(); if(!c.length) return '<p class="note" style="margin-top:8px">No trades yet.</p>';
  const top=c.slice(0,4), bot=c.filter(x=>x.total<0).slice(-3).reverse();
  const li=(r)=>`<dt><span class="sym">${esc(r.sym)}</span> <span class="muted">${r.status==='Open'?'held':'closed'}</span></dt><dd class="${sgn(r.total)}">${egp(r.total)}</dd>`;
  return `<dl class="kv"><dt class="sec">Top contributors</dt><dd class="sec"></dd>${top.map(li).join('')}<dt class="sec">Detractors</dt><dd class="sec"></dd>${bot.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}</dl><p class="note" style="margin:8px 0 0">Realized + unrealized + dividends per stock, EGP.</p>`; }
function moversList(){ const rows=S.R.pos.open.filter(r=>r.chg!=null&&r.mv&&r.priceSource==='auto').map(r=>({sym:r.symbol||r.name,name:r.name,chg:r.chg/100,pl:r.mv-r.mv/(1+r.chg/100)})).sort((a,b)=>b.pl-a.pl);

  return `<dl class="kv"><dt class="sec">Gainers</dt><dd class="sec"></dd>${up.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}<dt class="sec">Decliners</dt><dd class="sec"></dd>${dn.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}<dt class="total">Session P/L</dt><dd class="total ${sgn(dp.pl)}">${egp(dp.pl)}</dd></dl>`; }
function rollForward(st){ return `<dl class="kv">

function sectorBars(){ const secs=S.R.sectors; if(!secs.length) return '<p class="muted">No open positions.</p>'; const max=secs[0].weight;

function newId(){ return Math.random().toString(36).slice(2,10); }
async function addTx(rows){
  const byYear={}; rows.forEach(r=>{ (byYear[r.d.slice(0,4)] ||= []).push(r); });
  for(const y of Object.keys(byYear)){
    const cur=(S.ledgerDocs[y]&&S.ledgerDocs[y].rows)||[];
    const ok = await save(()=>S.db.doc('ledger/y'+y).set({rows:cur.concat(byYear[y])}));
    if(!ok) return false;
  }
  return true;
}
function normTx(o){
  const t = PE.TYPES.find(x=>x.toLowerCase()===String(o.t||'').trim().toLowerCase()); if(!t) throw new Error(`Unknown type "${o.t}"`);
  const d = parseDate(o.d); if(!d) throw new Error(`Unreadable date "${o.d}"`);
  // Bonus shares are free: the amount is always 0 (an empty amount is accepted), only the asset and the share count matter.
  const amt = t==='Bonus' ? 0 : Math.abs(parseFloat(String(o.amt).replace(/[, ]/g,''))); if(!isFinite(amt)) throw new Error(`Unreadable amount "${o.amt}"`);
  const r={id:newId(), d, t, amt: SIGN[t]*amt || 0};
  const a=String(o.a||'').trim(); if(a) r.a=a;
  const q=parseFloat(String(o.q??'').replace(/[, ]/g,'')); if(isFinite(q)&&q>0) r.q=q;
  const p=parseFloat(String(o.p??'').replace(/[, ]/g,'')); if(isFinite(p)&&p>0) r.p=p;
  if((t==='Buy'||t==='Sell'||t==='Bonus')&&(!r.a||!r.q)) throw new Error(`${t} on ${d} needs an asset and shares`);
  r.acc = String(o.acc||'Main').trim()||'Main';
  return r;
}
function parseDate(s){ s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null; }
function parseCsv(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const split=(l)=>{ const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; } else if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); };
  let start=0; const h=split(lines[0]).map(s=>s.toLowerCase()); let idx={d:0,t:1,a:2,q:3,p:4,amt:5,acc:6};
  if(h.includes('date')){ start=1; const f=(...n)=>h.findIndex(x=>n.some(k=>x.startsWith(k))); idx={d:f('date'),t:f('type'),a:f('asset','name','security'),q:f('shares','quantity','qty'),p:f('price'),amt:f('amount','net'),acc:f('account')}; }
  return lines.slice(start).map(l=>{ const c=split(l); const g=k=>idx[k]>=0?c[idx[k]]:''; return {d:g('d'),t:g('t'),a:g('a'),q:g('q'),p:g('p'),amt:g('amt'),acc:g('acc')}; }); }
