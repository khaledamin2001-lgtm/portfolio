</style></head><body class="pd-locked">
<div id="lock" role="dialog" aria-modal="true" aria-label="Unlock portfolio"></div>
<script>/* Live-site lock, one page for several portfolios. Each portfolio lives under p/<id>/: its figures are published encrypted
   (data.enc.json) to that portfolio's public key; the matching private key is published only wrapped by that portfolio's
   one-time setup key (keys.json, which also carries the password hash). A device that has been set up for a portfolio keeps
   its private key wrapped by a non-extractable browser key, and opens it with the password or Face ID / fingerprint. */
(function(){
  'use strict';
  const MAX_TRIES = 10, RELOCK_MS = 5 * 60e3, REFRESH_MS = 30 * 60e3, CUR_LS = 'pd.current', BIO_LS = 'pd.bio.v1', LEGACY_LS = 'pd.device.v1';
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
  const hex = (u) => [...new Uint8Array(u)].map((b) => b.toString(16).padStart(2, '0')).join('');
  const $l = (s) => document.querySelector('#lock ' + s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const bio = (() => { const u = navigator.userAgent; if (/iPhone|iPad/.test(u)) return 'Face ID'; if (/Macintosh/.test(u)) return 'Touch ID'; if (/Android/.test(u)) return 'fingerprint'; if (/Windows/.test(u)) return 'Windows Hello'; return 'Face ID / fingerprint'; })();
  const ls = { get: (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };

  /* ---------- portfolios ---------- */
  let PORTFOLIOS = [], CUR = null, OPENED = null;   // CUR: {id, name}; OPENED: id whose data is on the page
  const base = () => 'p/' + CUR.id + '/';
  const devLS = () => 'pd.dev.' + CUR.id;

  /* ---------- device storage (per portfolio; the Face ID credential is shared by the device) ---------- */
  const idb = (mode, fn) => new Promise((res, rej) => { const o = indexedDB.open('pd-lock', 1); o.onupgradeneeded = () => o.result.createObjectStore('k'); o.onerror = () => rej(o.error);
    o.onsuccess = () => { const t = o.result.transaction('k', mode); const r = fn(t.objectStore('k')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }; });
  const getDev = () => ls.get(devLS());
  const putDev = (d) => ls.set(devLS(), d);
  const getBio = () => ls.get(BIO_LS) || {};
  async function forget() { ls.del(devLS()); try { await idb('readwrite', (s) => s.delete('dev:' + CUR.id)); } catch (e) {} }
  async function migrateLegacy() {   // devices set up before the site held more than one portfolio
    const d = ls.get(LEGACY_LS); if (!d) return;
    try { const dk = await idb('readonly', (s) => s.get('device')); if (dk) await idb('readwrite', (s) => s.put(dk, 'dev:khaled')); } catch (e) {}
    ls.set('pd.dev.khaled', { iv: d.iv, ct: d.ct, tries: d.tries || 0, at: d.at });
    if (d.cred) ls.set(BIO_LS, { cred: d.cred });
    if (!ls.get(CUR_LS)) ls.set(CUR_LS, 'khaled');
    ls.del(LEGACY_LS);
  }

  /* ---------- keys ---------- */
  let KEYS = null, PK8 = null, DATA_AT = null, lastFetch = 0;
  async function unwrapWithSetupKey(code) {
    const w = KEYS.wrap, clean = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const k0 = await crypto.subtle.importKey('raw', enc.encode(clean), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: ub64(w.salt), iterations: w.iter }, k0, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(w.iv), additionalData: enc.encode('portfolio-key-v1') }, k, ub64(w.ct)));
  }
  async function storeOnDevice(pk8) {
    const dk = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const iv = rnd(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dk, pk8);
    await idb('readwrite', (s) => s.put(dk, 'dev:' + CUR.id));
    putDev({ iv: b64(iv), ct: b64(ct), tries: 0, at: new Date().toISOString() });
  }
  async function loadFromDevice() {
    const d = getDev(), dk = await idb('readonly', (s) => s.get('dev:' + CUR.id));
    if (!d || !dk) throw new Error('This device is not set up');
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(d.iv) }, dk, ub64(d.ct)));
  }

  /* ---------- data ---------- */
  async function unseal(e, label) {
    const priv = await crypto.subtle.importKey('pkcs8', PK8, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    const epk = ub64(e.epk);
    const pub = await crypto.subtle.importKey('raw', epk, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, priv, 256);
    const hk = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: epk, info: enc.encode(label) }, hk, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(e.iv), additionalData: enc.encode(label) }, key, ub64(e.ct));
  }
  async function fetchData() {
    const r = await fetch(base() + 'data.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Could not download the portfolio data (' + r.status + ')');
    const gz = await unseal(await r.json(), 'portfolio-data-v1');
    const plain = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    lastFetch = Date.now();
    return JSON.parse(plain);
  }
  // month-end Excel workbooks, published encrypted under p/<id>/exports/ (exports/index.json lists them)
  let EXPORTS = null;
  window.pdExports = async () => { if (EXPORTS) return EXPORTS; try { const r = await fetch(base() + 'exports/index.json?t=' + Date.now(), { cache: 'no-store' }); EXPORTS = r.ok ? await r.json() : []; } catch (e) { EXPORTS = []; } return EXPORTS; };
  window.pdDownloadExport = async (month) => {
    const list = await window.pdExports(); const x = list.find((e) => e.month === month); if (!x) throw new Error('No workbook published for ' + month);
    const r = await fetch(base() + x.file + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('Could not download the workbook (' + r.status + ')');
    const e = await r.json(); const bytes = await unseal(e, 'portfolio-file-v1');
    await downloads.save({ filename: e.name || x.name, data: new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) });
  };

  /* ---------- read-only database for the page ---------- */
  let DOCS = {}, dbResolve; const listeners = new Set();
  const dbReady = new Promise((r) => (dbResolve = r));
  const snap = (id, d) => ({ id, exists: d != null, data: () => (d == null ? undefined : JSON.parse(JSON.stringify(d))), metadata: {} });
  const fire = (l) => { try {
    if (l.kind === 'doc') l.f(snap(l.path.split('/').pop(), DOCS[l.path]));
    else { const docs = Object.keys(DOCS).filter((p) => p.startsWith(l.path + '/') && p.split('/').length === l.path.split('/').length + 1).sort().map((p) => snap(p.split('/').pop(), DOCS[p])); l.f({ docs, size: docs.length, empty: !docs.length }); }
  } catch (e) { console.error(e); } };
  const readOnly = () => Promise.reject(Object.assign(new Error('This live site is read-only. Make changes on the Claude page; they show up here after the next daily update.'), { code: 'read_only' }));
  const sub = (kind, path) => ({ onSnapshot(f) { const l = { kind, path, f }; listeners.add(l); setTimeout(() => fire(l), 0); return () => listeners.delete(l); } });
  const db = Object.freeze({
    doc: (p) => ({ ...sub('doc', p), get: async () => snap(p.split('/').pop(), DOCS[p]), set: readOnly, update: readOnly, delete: readOnly }),
    collection: (p) => ({ ...sub('col', p), get: async () => { const docs = Object.keys(DOCS).filter((k) => k.startsWith(p + '/')).map((k) => snap(k.split('/').pop(), DOCS[k])); return { docs, size: docs.length, empty: !docs.length }; } }),
  });
  // Downloads work normally on a real website, so the page's export buttons save straight to the device.
  const downloads = Object.freeze({ save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : /\.html$/.test(filename) ? 'text/html' : 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } });
  window.claude = Object.freeze({ use: async (n) => (n === 'db' ? dbReady : n === 'downloads' ? downloads : null) });

  /* ---------- live prices straight from TradingView (15-min delayed; the scanner allows this site's origin) ---------- */
  let LIVE = null, liveAt = 0;
  const cairoDay = (ts) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo' }).format(new Date(ts * 1000));
  async function scan(market, body) {
    const r = await fetch('https://scanner.tradingview.com/' + market + '/scan', { method: 'POST', body: JSON.stringify(body) });
    if (!r.ok) throw new Error('TradingView answered ' + r.status);
    return Object.fromEntries((await r.json()).data.map((x) => [x.s, x.d]));
  }
  async function livePrices() {
    const items = (DOCS['portfolio/assets'] || {}).items || {};
    const syms = [...new Set(Object.values(items).map((a) => (a.symbol || '').toUpperCase()).filter((s) => s && s !== 'SAVINGS' && s !== 'THNDRGOLD'))].sort();
    const idx = ['EGX30CAPPED', 'EGX30', 'EGX70EWI', 'EGX100EWI'], today = cairoDay(Date.now() / 1000);
    const cols = ['close', 'change', 'time', 'close[1]|1M', 'description', 'dividends_yield_current', 'ex_dividend_date_upcoming', 'dividend_amount_upcoming', 'ex_dividend_date_recent', 'dividend_amount_recent'];
    // every stock listed on the EGX in one call, plus the indices, plus USD/EGP and gold
    const [all, eg, gl] = await Promise.all([
      scan('egypt', { columns: cols, range: [0, 800], symbols: { query: { types: ['stock', 'dr', 'fund'] } } }),
      scan('egypt', { symbols: { tickers: idx.map((s) => 'EGX:' + s) }, columns: cols }),
      scan('global', { symbols: { tickers: ['FX_IDC:USDEGP', 'OANDA:XAUUSD'] }, columns: ['close', 'change', 'close[1]|1M'] })]);
    const prev = DOCS['market/latest'] || {}, quotes = {}, index = {}, missing = [];
    const put = (s, d) => { quotes[s] = { price: d[0], chg: +(d[1] || 0).toFixed(4), date: d[2] ? cairoDay(d[2]) : today, prevMonthClose: d[3], name: d[4], dy: d[5] == null ? null : +d[5].toFixed(4),
      exDate: d[6] ? cairoDay(d[6]) : null, divUp: d[7] ?? null, exRecent: d[8] ? cairoDay(d[8]) : null, divRecent: d[9] ?? null }; };
    for (const [t, d] of Object.entries(all)) { if (d && d[0] != null) put(t.replace(/^EGX:/, ''), d); }
    for (const s of syms) { if (!quotes[s]) { if (prev.quotes && prev.quotes[s]) quotes[s] = prev.quotes[s]; else missing.push(s); } }
    for (const s of idx) { const d = eg['EGX:' + s]; if (d && d[0] != null) index[s] = { close: d[0], chg: +(d[1] || 0).toFixed(4), date: d[2] ? cairoDay(d[2]) : today, prevMonthClose: d[3] }; }
    if (!Object.keys(quotes).length || !index.EGX30CAPPED) throw new Error('TradingView returned no EGX prices');
    const fx = gl['FX_IDC:USDEGP'], xau = gl['OANDA:XAUUSD'];
    LIVE = { asOf: new Date().toISOString(), source: 'TradingView scanner (15-min delayed), fetched by this browser', quotes, index,
      fx: fx ? { USDEGP: { price: fx[0], chg: +(fx[1] || 0).toFixed(4), prevMonthClose: fx[2], date: today } } : prev.fx || {},
      gold: fx && xau ? { XAUUSD: xau[0], gram24kEgp: +(xau[0] * fx[0] / 31.1035).toFixed(2), date: today } : prev.gold || {}, missing };
    liveAt = Date.now(); DOCS['market/latest'] = LIVE; listeners.forEach(fire);
    return Object.keys(quotes).length;
  }
  window.pdRefreshPrices = async (btn, toast) => {
    if (btn) { btn.disabled = true; btn.textContent = 'Refreshing…'; }
    try { await refresh(); const n = await livePrices(); const miss = (LIVE && LIVE.missing) || []; const items = Object.values((DOCS['portfolio/assets'] || {}).items || {}); const funds = items.filter((a) => !a.symbol || a.symbol === 'SAVINGS' || a.symbol === 'THNDRGOLD').length;
      toast && toast(`Refreshed every EGX-listed stock (${n}), EGX30 Capped, USD/EGP and gold as of ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo' })} Cairo (15-minute delayed).${funds ? ` ${funds} fund${funds > 1 ? 's' : ''} priced from your last trade.` : ''}${miss.length ? ` No TradingView listing for ${miss.join(', ')}.` : ''}`); }
    catch (e) { console.error(e); toast && toast('Could not reach TradingView: ' + (e.message || e) + '. Showing the last saved prices.', 'error'); }
    finally { const b = document.getElementById('refresh-prices'); if (b) { b.disabled = false; b.textContent = 'Refresh now'; } }
  };
  function publish(bundle) {
    DOCS = bundle.docs || {}; DATA_AT = bundle.exportedAt; OPENED = CUR.id;
    if (LIVE && Date.parse(LIVE.asOf) > Date.parse((DOCS['market/latest'] || {}).asOf || 0)) DOCS['market/latest'] = LIVE;
    listeners.forEach(fire);
    document.title = CUR.name + ' · Stock Market Portfolio Tracker';
    whenReady(() => {   // the bottom bar is the last thing in the document; the data can be ready before it is parsed
      const t = document.getElementById('pd-updated');
      if (t && DATA_AT) t.textContent = 'Ledger data as of ' + new Date(DATA_AT).toLocaleString('en-US', { timeZone: 'Africa/Cairo', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) + ' Cairo';
      const w = document.getElementById('pd-who'); if (w) w.textContent = CUR.name;
    });
  }
  const whenReady = (fn) => { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true }); else fn(); };

  /* ---------- WebAuthn (Face ID / Touch ID / fingerprint) ---------- */
  const canBio = async () => { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } };
  async function enrollBio() {
    const c = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Stock Market Portfolio Tracker' }, user: { id: rnd(16), name: 'portfolio', displayName: 'Portfolio' }, challenge: rnd(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, attestation: 'none' } });
    ls.set(BIO_LS, { cred: b64(c.rawId) });
  }
  async function verifyBio() {
    const b = getBio(), challenge = rnd(32);
    const a = await navigator.credentials.get({ publicKey: { challenge, allowCredentials: [{ type: 'public-key', id: ub64(b.cred), transports: ['internal', 'hybrid'] }], userVerification: 'required', timeout: 60000 } });
    const cd = JSON.parse(dec.decode(a.response.clientDataJSON));
    const want = b64(challenge).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const flags = new Uint8Array(a.response.authenticatorData)[32];
    if (cd.type !== 'webauthn.get' || cd.challenge !== want || cd.origin !== location.origin || !(flags & 4)) throw new Error('verification failed');
  }

  /* ---------- screens ---------- */
  const MARK = '<div class="lk-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 27l8-9 6 5 11-13"/><path d="M23 10h7v7"/></svg></div>';
  const lockEl = () => document.getElementById('lock');
  function screen(html) { const l = lockEl(); l.hidden = false; document.body.classList.add('pd-locked'); l.innerHTML = '<div class="lk">' + MARK + html + '</div>'; }
  function open() { const l = lockEl(); l.hidden = true; l.innerHTML = ''; document.body.classList.remove('pd-locked'); }
  const err = (m) => { const e = $l('.lk-err'); if (e) e.textContent = m || ''; };
  const switchLink = () => (PORTFOLIOS.length > 1 ? '<button class="lk-link" id="lk-switch" data-testid="live-switch">Switch portfolio</button>' : '');
  const wireSwitch = () => { const b = $l('#lk-switch'); if (b) b.onclick = () => chooseScreen(); };

  function chooseScreen() {
    screen(`<h1>Stock Market Portfolio Tracker</h1><p>Choose whose portfolio to open.</p><div class="lk-list">${PORTFOLIOS.map((p) => { const set = !!ls.get('pd.dev.' + p.id);
      return `<button class="lk-btn ${set ? '' : 'ghost'}" data-pick="${esc(p.id)}" data-testid="live-pick-${esc(p.id)}">${esc(p.name)}<small>${set ? 'ready on this device' : 'needs its setup key'}</small></button>`; }).join('')}</div>
      <p class="lk-foot">Each portfolio has its own setup key and password. Ask the owner for theirs to add it here.</p>`);
    document.querySelectorAll('#lock [data-pick]').forEach((b) => { b.onclick = () => select(PORTFOLIOS.find((p) => p.id === b.dataset.pick)); });
  }
  async function select(p) {
    if (OPENED && OPENED !== p.id) { ls.set(CUR_LS, p.id); location.reload(); return; }   // the page already shows another portfolio: start clean
    CUR = p; ls.set(CUR_LS, p.id); KEYS = null; PK8 = null; EXPORTS = null;
    try { KEYS = await (await fetch(base() + 'keys.json', { cache: 'no-store' })).json(); } catch (e) { return screen('<h1>Offline</h1><p>The portfolio could not load. Check your connection and reload.</p>'); }
    if (getDev()) unlockScreen(true); else setupScreen();
  }
  function setupScreen(note) {
    screen(`<h1>Set up ${esc(CUR.name)}</h1><p>Enter this portfolio's setup key once on each new phone or computer. After that you unlock with its password or ${esc(bio)}.</p>
      <form id="lk-setup" autocomplete="off"><input id="lk-code" data-testid="live-setup-key" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" aria-label="Setup key">
      <button class="lk-btn" data-testid="live-setup-submit">Continue</button><div class="lk-err" role="alert">${esc(note || '')}</div></form>
      ${switchLink()}<p class="lk-foot">The figures are encrypted. Without the setup key this page shows nothing.</p>`);
    $l('#lk-code').focus(); wireSwitch();
    $l('#lk-setup').onsubmit = async (ev) => { ev.preventDefault(); const b = $l('.lk-btn'); b.disabled = true; err('Checking…');
      try { const pk8 = await unwrapWithSetupKey($l('#lk-code').value); await storeOnDevice(pk8); PK8 = pk8; await start(); await offerBio(); }
      catch (e) { console.error(e); b.disabled = false; err(e && e.name === 'OperationError' ? 'That setup key is not right. Check it and try again.' : 'Could not set up: ' + (e.message || e)); } };
  }
  async function offerBio() {
    if (getBio().cred || !(await canBio())) return open();
    screen(`<h1>Use ${esc(bio)}?</h1><p>Unlock with ${esc(bio)} on this device. The password still works as a backup.</p>
      <button class="lk-btn" id="lk-bio-on" data-testid="live-bio-enable">Turn on ${esc(bio)}</button><button class="lk-btn ghost" id="lk-bio-no" data-testid="live-bio-skip">Not now</button><div class="lk-err" role="alert"></div>`);
    $l('#lk-bio-no').onclick = open;
    $l('#lk-bio-on').onclick = async () => { try { await enrollBio(); open(); } catch (e) { console.error(e); err(bio + ' was not turned on. You can use the password instead.'); } };
  }
  function unlockScreen(auto) {
    const cred = getBio().cred;
    screen(`<h1>${esc(CUR.name)}</h1><p>Unlock to see the portfolio.</p>
      ${cred ? `<button class="lk-btn" id="lk-bio" data-testid="live-bio-unlock">Unlock with ${esc(bio)}</button><div class="lk-sep">or</div>` : ''}
      <form id="lk-pass" autocomplete="off"><input id="lk-pw" type="password" data-testid="live-password" placeholder="Password" aria-label="Password" autocomplete="current-password">
      <button class="lk-btn ${cred ? 'ghost' : ''}" data-testid="live-password-submit">Unlock</button><div class="lk-err" role="alert"></div></form>
      <div class="lk-links">${switchLink()}<button class="lk-link" id="lk-forget" data-testid="live-forget-device">Forget this portfolio on this device</button></div>`);
    wireSwitch();
    if (cred) { $l('#lk-bio').onclick = () => bioUnlock(); if (auto) bioUnlock(true); } else $l('#lk-pw').focus();
    $l('#lk-pass').onsubmit = async (ev) => { ev.preventDefault();
      const h = hex(await crypto.subtle.digest('SHA-256', enc.encode('pd-v1:' + $l('#lk-pw').value.trim().toLowerCase())));
      const dv = getDev();
      if (h !== KEYS.pw) { dv.tries = (dv.tries || 0) + 1; putDev(dv); $l('#lk-pw').value = '';
        if (dv.tries >= MAX_TRIES) { await forget(); return setupScreen('Too many wrong passwords. This portfolio was removed from the device; enter its setup key.'); }
        return err(`Wrong password. ${MAX_TRIES - dv.tries} tries left before this portfolio is removed from the device.`); }
      dv.tries = 0; putDev(dv); await unlocked(); };
    $l('#lk-forget').onclick = () => { screen(`<h1>Forget ${esc(CUR.name)}?</h1><p>You will need its setup key to open it here again.</p>
      <button class="lk-btn" id="lk-f-yes" data-testid="live-forget-confirm">Forget it on this device</button><button class="lk-btn ghost" id="lk-f-no">Cancel</button>`);
      $l('#lk-f-yes').onclick = async () => { await forget(); ls.del(CUR_LS); location.reload(); }; $l('#lk-f-no').onclick = () => unlockScreen(false); };
  }
  async function bioUnlock(quiet) { try { await verifyBio(); await unlocked(); } catch (e) { if (!quiet) err(bio + ' did not unlock. Try again or use the password.'); } }
  async function unlocked() {
    try { if (!PK8) { PK8 = await loadFromDevice(); await start(); } else if (Date.now() - lastFetch > REFRESH_MS) refresh(); open(); }
    catch (e) { console.error(e); if (/not set up/.test(e.message) || e.name === 'OperationError') { await forget(); setupScreen('This portfolio needs to be set up again on this device.'); } else err(e.message); }
  }
  async function start() { publish(await fetchData()); dbResolve(db); livePrices().catch((e) => console.warn('live prices unavailable', e)); }
  async function refresh() { try { const b = await fetchData(); if (b.exportedAt !== DATA_AT) publish(b); } catch (e) { console.warn('refresh failed', e); } }
  window.pdLock = () => { if (CUR && getDev()) unlockScreen(false); };
  window.pdSwitch = () => chooseScreen();
  window.pdSelect = (id) => { const p = PORTFOLIOS.find((x) => x.id === id); if (p && !(CUR && CUR.id === p.id)) select(p); };

  /* ---------- boot ---------- */
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!PK8 || !lockEl().hidden) return;
    if (Date.now() - hiddenAt > RELOCK_MS) unlockScreen(true); else if (Date.now() - lastFetch > REFRESH_MS) refresh();
    if (Date.now() - liveAt > 10 * 60e3) livePrices().catch(() => {});
  });
  (async () => {
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) return screen('<h1>Browser too old</h1><p>Update your browser (Safari 16.4+, Chrome 80+) to open the portfolio.</p>');
    try { PORTFOLIOS = await (await fetch('portfolios.json', { cache: 'no-store' })).json(); } catch (e) { return screen('<h1>Offline</h1><p>The portfolio could not load. Check your connection and reload.</p>'); }
    await migrateLegacy();
    whenReady(() => { const sw = document.getElementById('pd-switch'); if (sw && PORTFOLIOS.length > 1) sw.hidden = false; });
    const last = PORTFOLIOS.find((p) => p.id === ls.get(CUR_LS));
    if (last) select(last); else if (PORTFOLIOS.length === 1) select(PORTFOLIOS[0]); else chooseScreen();
  })();
})();
</script>

<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EDF2EF; --ink:#0F1A17; --ink-2:#46534E; --ink-3:#6F7D78;
  --rule:#DAE2DE; --grid:#E5EBE8; --accent:#0B6E5F; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --pos:#137a3a; --neg:#c02f2f; --warn:#8f5a00;
  --pos-bg:#E2F3E7; --neg-bg:#FBE7E7; --warn-bg:#FFF1D2; --input:#FFFFFF; --input-rule:#C9D4CF;
  --shadow:0 1px 2px rgba(15,26,23,.06),0 4px 16px rgba(15,26,23,.05);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){

    color-scheme:dark;
    --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --ink:#E7EEEB; --ink-2:#A8B6B1; --ink-3:#7F8E89;
    --rule:#26322E; --grid:#212C28; --accent:#3DB39D; --accent-ink:#04201A; --accent-soft:#12332D;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#4BC46D; --neg:#F07272; --warn:#E6A93B;
    --pos-bg:#12301D; --neg-bg:#3A1717; --warn-bg:#35280E; --input:#0F1614; --input-rule:#33423D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --ink:#E7EEEB; --ink-2:#A8B6B1; --ink-3:#7F8E89;
  --rule:#26322E; --grid:#212C28; --accent:#3DB39D; --accent-ink:#04201A; --accent-soft:#12332D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#4BC46D; --neg:#F07272; --warn:#E6A93B;
  --pos-bg:#12301D; --neg-bg:#3A1717; --warn-bg:#35280E; --input:#0F1614; --input-rule:#33423D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 64px}

h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}

.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:600 19px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.pf-switch{position:relative;min-width:0}
.pf-title{font:600 19px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;background:none;border:0;color:inherit;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.pf-title svg{width:14px;height:14px;opacity:.65;flex:none}
.pf-title:hover svg{opacity:1}
.pf-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:270px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;gap:2px}
.pf-menu a,.pf-menu button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--ink);font:500 14px/1.2 var(--f-ui);text-decoration:none;cursor:pointer;width:100%;box-sizing:border-box}
.pf-menu a:hover,.pf-menu button:hover{background:var(--bg)}
.pf-menu .cur{color:var(--accent)}
.pf-menu small{font:400 11px/1.2 var(--f-ui);color:var(--ink-3)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:860px){nav.tabs{margin-left:0;width:100%;padding-bottom:8px}}

/* tape */
.tape{display:flex;gap:22px;overflow-x:auto;min-width:0;max-width:100%;padding-block:10px;border-bottom:1px solid var(--rule);scrollbar-width:none;font-size:12.5px}
.tape::-webkit-scrollbar{display:none}
.tape .t{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.tape .t b{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}
.feedbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-block:8px 0;font-size:12.5px;flex-wrap:wrap}
.feedbar:empty{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)} .dot.err{background:var(--neg)}

/* period bar */
.period{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:18px 6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.period label{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--input);border:1px solid var(--input-rule);border-radius:8px;padding:6px 9px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.period .label{font:600 22px/1.2 var(--f-display);margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.ok{background:var(--pos-bg);color:var(--pos)} .chip.err{background:var(--neg-bg);color:var(--neg)}

/* layout */
section.view{display:grid;gap:18px;padding-top:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;min-width:0}
@media (max-width:600px){.panel{padding:16px 14px}}
.panel h2{font:600 17px/1.3 var(--f-display);letter-spacing:-.005em}
.panel .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;align-content:start}
.kpi .v{font:600 26px/1.15 var(--f-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.kpi .v small{font:500 13px var(--f-ui);color:var(--ink-3);margin-left:4px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.kpi.hero{background:var(--accent);color:var(--accent-ink)}
.kpi.hero .eyebrow,.kpi.hero .d,.kpi.hero .v small{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
.kpi.hero .pos,.kpi.hero .neg{color:var(--accent-ink)}

/* tables */
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:middle}
td.n,th.n{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--rule);border-bottom:0}
td.wrap{white-space:normal;min-width:180px}
.sym{font:500 12.5px var(--f-mono);letter-spacing:.03em}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--s1)}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.03em}
.pill.win{background:var(--pos-bg);color:var(--pos)} .pill.loss{background:var(--neg-bg);color:var(--neg)}
.pill.auto{background:var(--accent-soft);color:var(--accent)} .pill.man{background:var(--surface-2);color:var(--ink-2)} .pill.stale{background:var(--warn-bg);color:var(--warn)}
.pill.prov{background:var(--warn-bg);color:var(--warn)}

/* key-value lists */
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:13.5px}
.kv > div{padding:7px 0;border-bottom:1px solid var(--grid);display:contents}
.kv dt{padding:7px 0;border-bottom:1px solid var(--grid);color:var(--ink-2)}
.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv dt.total,.kv dd.total{border-top:1.5px solid var(--ink-2);border-bottom:3px double var(--ink-2);font-weight:700;color:var(--ink)}
.kv dt.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:14px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font:11px var(--f-ui);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);white-space:nowrap;z-index:5;transform:translate(-50%,-100%);transition:opacity .08s}

.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:10px;height:10px;border-radius:2px}

/* forms & buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--input-rule);background:var(--surface);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--input-rule))}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 12px;align-items:end}
.form label{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.form input,.form select{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid-in input{width:100%;min-width:84px;padding:4px 7px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
.grid-in input.txt{text-align:left;min-width:140px}
.grid-in input.dirty{border-color:var(--accent);background:var(--accent-soft)}
td.in-cell{padding:4px 6px}
input.inp,.grid-in input{color:#2256c7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input.inp,:root:not([data-theme="light"]) .grid-in input{color:#8db8ff}}
:root[data-theme="dark"] input.inp,:root[data-theme="dark"] .grid-in input{color:#8db8ff}
textarea{width:100%;min-height:130px;font:12.5px/1.5 var(--f-mono)}

/* checks */
.checks{display:grid;gap:0}
.check{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--grid)}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.check .ic.ok{background:var(--pos-bg);color:var(--pos)} .check .ic.warn{background:var(--warn-bg);color:var(--warn)} .check .ic.error{background:var(--neg-bg);color:var(--neg)}
.check .dt{font-size:12.5px;color:var(--ink-3);grid-column:2}
.prose{max-width:68ch;font-size:14px;color:var(--ink-2)}
.prose h3{font:600 15px var(--f-display);color:var(--ink);margin:18px 0 4px}
.prose p{margin:0 0 8px} .prose code{font:12.5px var(--f-mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.error{background:var(--neg);color:#fff}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2)}
.empty h2{font:600 22px var(--f-display);color:var(--ink);margin-bottom:6px}
.note{font-size:12.5px;color:var(--ink-3)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.subnav .muted{font-size:12px;margin-right:4px}

<script>
/* Portfolio engine — a line-by-line port of the workbook's ⚙️ Model tab.
   Every function is pure: data in, numbers out. Dates are 'YYYY-MM-DD', months 'YYYY-MM'. */
(function (root) {
  'use strict';
  // Bonus = corporate action: q new shares for free (amt 0); the average cost falls, nothing else moves.
  const TYPES = ['Deposit', 'Withdrawal', 'Buy', 'Sell', 'Dividend', 'Fee', 'Rebate', 'Bonus'];
  // Same-day order. Thndr prints a "Sell Same Day" before the buy it closes, so money in → buys → income → sells → money out.
  const DAY_ORDER = { Deposit: 0, Buy: 1, Bonus: 1, Dividend: 2, Rebate: 2, Fee: 2, Sell: 3, Withdrawal: 4 };

  // ---------- date helpers ----------
  const pad = (n) => String(n).padStart(2, '0');
  const monthOf = (d) => d.slice(0, 7);
  const addMonths = (m, k) => {
    let [y, mo] = m.split('-').map(Number);
    mo += k;
    y += Math.floor((mo - 1) / 12);
    mo = ((mo - 1) % 12 + 12) % 12 + 1;
    return `${y}-${pad(mo)}`;
  };
  const eom = (m) => {
    const [y, mo] = m.split('-').map(Number);
    return `${m}-${pad(new Date(Date.UTC(y, mo, 0)).getUTCDate())}`;
  };
  const dayNum = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 86400000;
  const monthsBetween = (a, b) => {
    const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
    return (yb - ya) * 12 + (mb - ma);
  };
  const cairoToday = () => {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return new Date().toISOString().slice(0, 10); }
  };

  // ---------- stats helpers ----------
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const mean = (a) => (a.length ? sum(a) / a.length : 0);
  const stdevS = (a) => {
    if (a.length < 2) return 0;
    const m = mean(a);
    return Math.sqrt(sum(a.map((x) => (x - m) ** 2)) / (a.length - 1));
  };
  const covS = (a, b) => {
    const ma = mean(a), mb = mean(b);
    return sum(a.map((x, i) => (x - ma) * (b[i] - mb))) / (a.length - 1);
  };
  const slope = (y, x) => covS(y, x) / (stdevS(x) ** 2);
  const correl = (a, b) => covS(a, b) / (stdevS(a) * stdevS(b));

  // Excel-compatible XIRR (actual/365, Newton with bisection fallback)
  function xirr(flows) {
    if (!flows.length) return null;
    const t0 = dayNum(flows[0].date);
    const f = (r) => sum(flows.map((c) => c.amount / Math.pow(1 + r, (dayNum(c.date) - t0) / 365)));
    const df = (r) => sum(flows.map((c) => { const t = (dayNum(c.date) - t0) / 365; return -t * c.amount / Math.pow(1 + r, t + 1); }));
    let r = 0.1;
    for (let i = 0; i < 100; i++) {
      const v = f(r), d = df(r);
      if (!isFinite(v) || !isFinite(d) || d === 0) break;
      const nr = r - v / d;
      if (Math.abs(nr - r) < 1e-10) return nr > -1 ? nr : null;
      r = nr <= -1 ? (r - 1) / 2 : nr;
    }
    let lo = -0.9999, hi = 100;
    if (f(lo) * f(hi) > 0) return null;
    for (let i = 0; i < 300; i++) {
      const mid = (lo + hi) / 2;
      if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid;
    }
    return (lo + hi) / 2;
  }

  // ---------- ledger: average-cost engine (🗂️ Data helper columns K–P) ----------
  // Date, then type priority (DAY_ORDER), then original position — stable inside a priority.
  // opts.sameDay: 'type' (default) | 'ledger' (legacy: original row order inside a day, as the workbook had it).
  function sortLedger(tx, opts) {
    const byType = !(opts && opts.sameDay === 'ledger');
    const pr = (t) => (byType ? (DAY_ORDER[t.t] != null ? DAY_ORDER[t.t] : 2) : 0);
    return tx.map((t, i) => ({ ...t, _i: i })).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : pr(a) - pr(b) || a._i - b._i));
  }
  // A sell larger than the shares held is flagged r.oversold = q − held. Tolerance: 0.5 sh or 1% of the shares held; for fund
  // rows (MF account or a savings fund) 1% of the larger of shares held and units ever bought, because the savings fund's sells
  // run ~0.2% over its buys as interest accrues in extra units, and its small interest-only sells land after full redemption.
  function runLedger(tx, opts) {
    const run = {};
    return sortLedger(tx, opts).map((t) => {
      const r = { ...t, basis: 0 };
      if (!t.a || (t.t !== 'Buy' && t.t !== 'Sell' && t.t !== 'Bonus')) return r;
      const s = run[t.a] || (run[t.a] = { sh: 0, cost: 0, bought: 0 });
      if (t.t === 'Buy') { s.sh += t.q || 0; s.bought += t.q || 0; s.cost += Math.abs(t.amt || 0); }
      else if (t.t === 'Bonus') { s.sh += t.q || 0; s.bought += t.q || 0; }
      else {
        const q = t.q || 0;
        const fundish = t.acc === 'MF' || /saving/i.test(t.a);
        if (q > s.sh + Math.max(0.5, 0.01 * (fundish ? Math.max(s.sh, s.bought) : s.sh))) r.oversold = q - s.sh;
        r.basis = s.sh > 0 ? (s.cost / s.sh) * q : 0;
        s.sh -= q; s.cost -= r.basis;
      }
      return r;
    });
  }

  // ---------- prices ----------
  // Latest of manual (asset.price/priceDate) and automatic (market.quotes[symbol]) wins; ties go to automatic.
  function effectivePrice(asset, market, settings) {
    if (!asset) return null;
    const man = asset.price > 0 ? { price: asset.price, date: asset.priceDate || settings.priceDate || null, source: 'manual' } : null;
    const q = market && market.quotes && asset.symbol ? market.quotes[asset.symbol] : null;
    const auto = q && q.price > 0 ? { price: q.price, date: q.date || null, source: 'auto', chg: q.chg } : null;
    if (auto && man) return (man.date || '') > (auto.date || '') ? man : auto;
    return auto || man;
  }

  // ---------- positions engine (⚙️ Model §C) ----------
  function positions(ledger, assets, market, settings, today, period, fallback) {
    const byName = {};
    (assets || []).forEach((a) => { byName[a.name] = a; });
    const order = [];
    const P = {};
    ledger.forEach((t) => {
      if ((t.t === 'Buy' || t.t === 'Bonus') && t.a && !P[t.a]) { P[t.a] = { name: t.a, firstBuy: t.d, lastSell: null, bought: 0, bonus: 0, sold: 0, buyCost: 0, proceeds: 0, soldBasis: 0, divs: 0 }; order.push(t.a); }
    });
    ledger.forEach((t) => {
      const p = P[t.a];
      if (t.t === 'Buy' && p) { p.bought += t.q || 0; p.buyCost += Math.abs(t.amt || 0); }
      if (t.t === 'Bonus' && p) { p.bonus += t.q || 0; }
      if (t.t === 'Sell' && p) { p.sold += t.q || 0; p.proceeds += t.amt || 0; p.soldBasis += t.basis; if (!p.lastSell || t.d > p.lastSell) p.lastSell = t.d; }
    });
    const thr = settings.openThreshold ?? 0.5;
    const rows = order.sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' })).map((name) => {
      const p = P[name], a = byName[name] || {};
      const sym = a.symbol || '';
      p.divs = sum(ledger.filter((t) => t.t === 'Dividend' && t.a && (t.a === name || (sym && t.a === sym))).map((t) => t.amt || 0));
      const open = p.bought + p.bonus - p.sold;
      const isOpen = open > thr;
      let px = isOpen ? effectivePrice(a, market, settings) : null;
      if (isOpen && !px && fallback) { const f = fallback(name); if (f) px = { price: f.p, date: f.d, source: 'model' }; }
      const openCost = isOpen ? p.buyCost - p.soldBasis : 0;
      const mv = isOpen && px ? open * px.price : null;
      const unreal = isOpen ? (mv != null ? mv - openCost : null) : 0;
      const realized = p.proceeds - p.soldBasis;
      const total = realized + (unreal || 0) + p.divs;
      const holdEnd = isOpen ? today : (p.lastSell || p.firstBuy);
      const closedInPeriod = !isOpen && p.lastSell && period && p.lastSell >= `${period.from}-01` && p.lastSell <= eom(period.to);
      const stop = +a.stop || 0, target = +a.target || 0;
      return {
        name, symbol: sym, sector: a.sector || 'Unclassified', firstBuy: p.firstBuy, lastSell: p.lastSell,
        bought: p.bought, bonus: p.bonus, sold: p.sold, open, status: isOpen ? 'Open' : 'Closed',
        buyCost: p.buyCost, proceeds: p.proceeds, soldBasis: p.soldBasis, openCost, divs: p.divs, realized,
        price: px ? px.price : null, priceDate: px ? px.date : null, priceSource: px ? px.source : null, chg: px && px.source === 'auto' ? px.chg : null,
        avgCost: isOpen && open ? openCost / open : null,
        mv, unreal, total, roi: p.buyCost > 0 ? total / p.buyCost : 0,
        holdDays: dayNum(holdEnd) - dayNum(p.firstBuy),
        outcome: !isOpen && p.sold > 0 ? (total > 0 ? 'WIN' : 'LOSS') : '',
        shareGap: !isOpen ? Math.round(open) : 0,
        closedInPeriod: !!closedInPeriod,
        stop, target,
        riskToStop: isOpen && stop > 0 && px && px.price > stop ? open * (px.price - stop) : 0,
      };
    });
    const openRows = rows.filter((r) => r.status === 'Open');
    const mvTotal = sum(openRows.map((r) => r.mv || 0));
    openRows.forEach((r) => { r.weight = mvTotal ? (r.mv || 0) / mvTotal : 0; });
    return { rows, open: openRows, mvTotal };
  }

  // ---------- monthly engine (⚙️ Model §A) ----------
  // marks: {"YYYY-MM": {cash, securities, benchReturn, benchClose, usdegp, cpi, provisional, note}}
  // live (optional): {month, cash, securities, benchClose, prevBenchClose, usdegp} replaces a provisional/missing current-month row.
  // opts.flowTiming: 'dietz' (default) — Modified Dietz, each flow weighted by the fraction of the month it was invested
  //                  (start-of-day: a deposit on the 1st counts fully, on the 16th of a 31-day month 16/31);
  //                  'start' — the workbook's legacy formula, every flow assumed on day 1. row.retSimple always keeps the legacy figure.
  function monthly(settings, marks, ledger, live, opts) {
    const dietz = !(opts && opts.flowTiming === 'start');
    const out = [];
    const inc = settings.inception;
    const keys = Object.keys(marks || {}).filter((k) => k >= inc).sort();
    let last = keys.length ? keys[keys.length - 1] : inc;
    if (live && live.month > last) last = live.month;
    const n = monthsBetween(inc, last) + 1;
    let prev = null;
    for (let i = 0; i < n; i++) {
      const m = addMonths(inc, i);
      let mk = { ...(marks[m] || {}) };
      let isLive = false;
      if (live && live.month === m && (!marks[m] || marks[m].provisional || marks[m].cash == null)) {
        mk = { ...mk, cash: live.cash, securities: live.securities, provisional: true };
        if (live.benchClose) mk.benchClose = live.benchClose;
        if (live.usdegp) mk.usdegp = live.usdegp;
        isLive = true;
      }
      const has = typeof mk.cash === 'number' && typeof mk.securities === 'number';
      const from = `${m}-01`, to = eom(m);
      const inM = ledger.filter((t) => t.d >= from && t.d <= to);
      const s = (type) => sum(inM.filter((t) => t.t === type).map((t) => t.amt || 0));
      const deposits = Math.abs(s('Deposit')), withdrawals = Math.abs(s('Withdrawal'));
      // day-weighted net flow (Modified Dietz): w = (days in month − day + 1) / days in month
      const CD = +to.slice(8);
      const weightedFlow = sum(inM.filter((t) => t.t === 'Deposit' || t.t === 'Withdrawal').map((t) => ((CD - +t.d.slice(8) + 1) / CD) * (t.amt || 0)));
      const row = {
        month: m, has, cash: mk.cash, securities: mk.securities, value: has ? mk.cash + mk.securities : null,
        deposits, withdrawals, netFlow: deposits - withdrawals, weightedFlow, dividends: s('Dividend'),
        buys: Math.abs(s('Buy')), sells: s('Sell'), trades: inM.filter((t) => t.t === 'Buy' || t.t === 'Sell').length,
        provisional: !!mk.provisional, live: isLive, note: mk.note || '',
        source: mk.source || (has ? 'typed' : null), estimate: !!mk.estimate,
        benchClose: mk.benchClose ?? null, usdegp: typeof mk.usdegp === 'number' ? mk.usdegp : null, cpi: typeof mk.cpi === 'number' ? mk.cpi : null,
      };
      row.opening = prev ? prev.value : settings.openingValue;
      row.retSimple = has && row.opening != null && row.opening + row.netFlow > 0 ? row.value / (row.opening + row.netFlow) - 1 : null;
      row.ret = dietz && has && row.opening != null && row.opening + weightedFlow > 0 ? (row.value - row.opening - row.netFlow) / (row.opening + weightedFlow) : row.retSimple;
      // benchmark: closes win over typed %, as in the workbook
      const prevClose = isLive && live.prevBenchClose ? live.prevBenchClose : (prev ? prev.benchClose : settings.benchCloseStart || null);
      if (!has) row.bench = null;
      else if (row.benchClose && prevClose) row.bench = row.benchClose / prevClose - 1;
      else row.bench = typeof mk.benchReturn === 'number' ? mk.benchReturn : null;
      if (isLive && live.prevBenchClose && !(prev && prev.benchClose)) row.prevBenchClose = live.prevBenchClose;
      row.alpha = row.ret != null && row.bench != null ? row.ret - row.bench : null;
      const prevFx = prev ? prev.usdegp : settings.fxStart;
      row.fxFactor = has && row.usdegp && prevFx ? prevFx / row.usdegp : null;
      row.usdRet = row.fxFactor != null && row.ret != null ? (1 + row.ret) * row.fxFactor - 1 : null;
      row.realRet = row.ret != null && row.cpi != null ? (1 + row.ret) / (1 + row.cpi) - 1 : null;
      out.push(row);
      prev = row;
    }
    return out;
  }

  // ---------- period engine (⚙️ Model §B, §D) ----------
  const PERIOD_TYPES = ['Month', 'Quarter', 'YTD', 'Year', 'Last 12 Months', 'Since Inception', 'Custom'];
  function periodRange(sel, settings, months) {
    const withData = months.filter((r) => r.has);
    const lastData = withData.length ? withData[withData.length - 1].month : settings.inception;
    const asOf = sel.asOf && sel.asOf <= lastData ? sel.asOf : lastData;
    const y = asOf.slice(0, 4), mo = +asOf.slice(5, 7);
    let rawFrom, rawTo = asOf;
    switch (sel.type) {
      case 'Month': rawFrom = asOf; break;
      case 'Quarter': rawFrom = `${y}-${pad(Math.floor((mo - 1) / 3) * 3 + 1)}`; rawTo = addMonths(rawFrom, 2); break;
      case 'Year': rawFrom = `${y}-01`; rawTo = `${y}-12`; break;
      case 'YTD': rawFrom = `${y}-01`; break;
      case 'Last 12 Months': rawFrom = addMonths(asOf, -11); break;
      case 'Custom': rawFrom = sel.from || settings.inception; rawTo = sel.to || asOf; break;
      default: rawFrom = settings.inception;
    }
    const from = rawFrom > settings.inception ? rawFrom : settings.inception;
    let to = rawTo;
    if (lastData < to) to = lastData;
    if (sel.type !== 'Custom' && asOf < to) to = asOf;
    return { from, to, asOf, lastData, valid: from <= to };
  }
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtMonth = (m) => `${MON[+m.slice(5, 7) - 1]}-${m.slice(2, 4)}`;

  function periodStats(months, range, ledger, settings, pos) {
    const P = months.filter((r) => r.has && r.month >= range.from && r.month <= range.to);
    const n = P.length;
    const S = { n, label: n ? fmtMonth(range.from) + (range.from === range.to ? '' : ' to ' + fmtMonth(range.to)) : 'No data for selection' };
    if (!n) return S;
    const first = P[0], last = P[n - 1];
    let cf = 1, cb = 1, cu = 1, cc = 1, peak = 1;
    P.forEach((r) => {
      cf *= 1 + r.ret; cb *= 1 + (r.bench ?? 0); cu *= 1 + (r.usdRet ?? 0); cc *= 1 + (r.cpi ?? 0);
      r.pCum = cf - 1; r.pBench = cb - 1;
      peak = Math.max(peak, cf); r.dd = cf / peak - 1;
    });
    S.rows = P;
    S.opening = first.opening; S.closing = last.value;
    S.deposits = sum(P.map((r) => r.deposits)); S.withdrawals = sum(P.map((r) => r.withdrawals));
    S.netFlows = S.deposits - S.withdrawals; S.netGain = S.closing - S.opening - S.netFlows;
    S.dividends = sum(P.map((r) => r.dividends)); S.buys = sum(P.map((r) => r.buys)); S.sells = sum(P.map((r) => r.sells)); S.trades = sum(P.map((r) => r.trades));
    S.twr = cf - 1; S.benchTwr = cb - 1; S.alpha = S.twr - S.benchTwr;
    S.benchComplete = P.every((r) => r.bench != null);
    const rets = P.map((r) => r.ret);
    S.posMonths = rets.filter((x) => x > 0).length; S.pctPos = S.posMonths / n;
    const best = P.reduce((a, r) => (r.ret > a.ret ? r : a)), worst = P.reduce((a, r) => (r.ret < a.ret ? r : a));
    S.best = { month: best.month, ret: best.ret }; S.worst = { month: worst.month, ret: worst.ret };
    S.avg = mean(rets); S.vol = n > 1 ? stdevS(rets) : 0;
    S.risk = n < 2 ? 'n/a' : S.vol < settings.volLow ? 'Low' : S.vol < settings.volHigh ? 'Moderate' : 'High';
    S.annualized = n >= 12 ? Math.pow(1 + S.twr, 12 / n) - 1 : null;
    const rfM = Math.pow(1 + settings.riskFree, 1 / 12) - 1;
    S.sharpe = n >= 3 && S.vol ? ((S.avg - rfM) / S.vol) * Math.sqrt(12) : null;
    const bp = P.filter((r) => r.bench != null);
    S.beta = bp.length >= 3 ? slope(bp.map((r) => r.ret), bp.map((r) => r.bench)) : null;
    S.correl = bp.length >= 3 ? correl(bp.map((r) => r.ret), bp.map((r) => r.bench)) : null;
    S.trackingError = bp.length >= 3 ? stdevS(bp.map((r) => r.alpha)) * Math.sqrt(12) : null;
    S.beat = bp.filter((r) => r.alpha > 0).length; S.pctBeat = S.beat / n;
    const mdd = P.reduce((a, r) => (r.dd < a.dd ? r : a));
    S.maxDD = Math.min(0, mdd.dd); S.maxDDMonth = S.maxDD < 0 ? mdd.month : null;
    // USD & real
    const fxStartIdx = months.findIndex((r) => r.month === range.from);
    S.fxStart = fxStartIdx <= 0 ? settings.fxStart : months[fxStartIdx - 1].usdegp;
    S.fxEnd = last.usdegp;
    S.usdComplete = !!S.fxStart && P.every((r) => r.usdRet != null);
    S.usdTwr = S.usdComplete ? cu - 1 : null;
    S.egpVsUsd = S.fxStart && S.fxEnd ? S.fxStart / S.fxEnd - 1 : null;
    S.cpiComplete = P.every((r) => r.cpi != null);
    S.inflation = S.cpiComplete ? cc - 1 : null;
    S.realTwr = S.cpiComplete ? (1 + S.twr) / (1 + S.inflation) - 1 : null;
    // when the latest months have no CPI yet, report the real return through the last month that does
    let k = 0; while (k < n && P[k].cpi != null) k++;
    if (!S.cpiComplete && k > 0) {
      const Q = P.slice(0, k);
      const tw = Q.reduce((a, r) => a * (1 + r.ret), 1) - 1, inf = Q.reduce((a, r) => a * (1 + r.cpi), 1) - 1;
      S.realThrough = Q[k - 1].month; S.realTwrPartial = (1 + tw) / (1 + inf) - 1; S.inflationPartial = inf;
    } else { S.realThrough = S.cpiComplete ? last.month : null; S.realTwrPartial = null; S.inflationPartial = null; }
    // downside risk and capture ratios (monthly, CFA-style definitions)
    const dd2 = rets.map((x) => Math.min(0, x - rfM) ** 2);
    S.downsideDev = n > 1 ? Math.sqrt(sum(dd2) / n) : 0;

<script>
/* Thndr e-statement reader: raw email → PDF attachments → text lines → transactions, month-end marks

(function (root) {

  }

    S.fallback = (name) => { const p = pricer(name, today); return p ? { p: p.p, d: pb.last } : null; };

  renderTape(); renderPeriod(); renderTab(false);
}

// ---------- charts ----------
const charts = [];
function chartSlot(id, spec, h){ charts.push({id, spec, h}); return `<div class="chart" id="${id}" style="height:${h}px" data-testid="${id}"></div>`; }
function mountCharts(){ ro.disconnect(); const list = charts.splice(0); list.forEach(c => { const el=document.getElementById(c.id); if(el){ el._spec=c; drawChart(el); ro.observe(el);} }); }
var ro = new ResizeObserver(entries => entries.forEach(en => { const el=en.target; if(el._w!==Math.round(en.contentRect.width)) drawChart(el); }));
function niceTicks(min,max,count=5){ if(min===max){ max=min+1; } const span=max-min; const step0=span/count; const mag=Math.pow(10,Math.floor(Math.log10(step0))); const f=step0/mag; const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10)); return t; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawChart(el){
  const {spec,h}=el._spec; const W=Math.max(280,Math.round(el.clientWidth)); el._w=W;
  const kind=spec.kind; const labels=spec.labels; const n=labels.length;
  const padL=spec.padL||56, padR=16, padT=12, padB=26; const iw=W-padL-padR, ih=h-padT-padB;
  const all=[]; spec.series.forEach(s=>s.values.forEach(v=>{ if(v!=null&&isFinite(v)) all.push(v); }));
  let min=Math.min(0,...all), max=Math.max(0,...all); if(spec.minZero===false){ min=Math.min(...all); max=Math.max(...all); const pad=(max-min)*0.08||1; min-=pad; max+=pad; }
  const ticks=niceTicks(min,max,Math.max(3,Math.round(ih/48))); min=ticks[0]; max=ticks[ticks.length-1];
  const y=v=>padT+ih-(v-min)/(max-min)*ih;
  const band=iw/Math.max(1,n); const xC=i=> kind==='bar'? padL+band*(i+.5) : padL+(n<=1?iw/2:i*iw/(n-1));
  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/58))));
  let g=`<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img" aria-label="${esc(spec.title||'chart')}">`;
  ticks.forEach(t=>{ g+=`<line class="${t===0?'zero':'gl'}" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end">${esc(spec.yFmt(t,true))}</text>`; });
  labels.forEach((l,i)=>{ if(i%every===0 || (kind!=='bar'&&i===n-1&&n>1&&(n-1)%every>every/2)) g+=`<text x="${xC(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`; });
  if(kind==='bar'){
    const k=spec.series.length; const gap=2; const bw=Math.max(2,Math.min(26,(band*0.72-(k-1)*gap)/k));
    spec.series.forEach((s,si)=>{ s.values.forEach((v,i)=>{ if(v==null) return; const x0=xC(i)-(k*bw+(k-1)*gap)/2+si*(bw+gap); const y0=y(Math.max(0,v)), y1=y(Math.min(0,v)); const hh=Math.max(1,y1-y0); const col = s.colorFn? s.colorFn(v) : s.color; const r=Math.min(3,bw/2,hh);
      g+= v>=0 ? `<path d="M${x0},${y1} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${y1} Z" fill="${col}"/>` : `<path d="M${x0},${y0} V${y1-r} Q${x0},${y1} ${x0+r},${y1} H${x0+bw-r} Q${x0+bw},${y1} ${x0+bw},${y1-r} V${y0} Z" fill="${col}"/>`; }); });
  } else {
    spec.series.forEach(s=>{
      const pts=s.values.map((v,i)=>v==null?null:[xC(i),y(v)]);
      let d=''; pts.forEach((p,i)=>{ if(!p) return; d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); });
      if(s.area){ const f=pts.filter(Boolean); if(f.length) g+=`<path d="${d}L${f[f.length-1][0]},${y(Math.max(min,0))}L${f[0][0]},${y(Math.max(min,0))}Z" fill="${s.color}" opacity=".16"/>`; }
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      const last=pts.map((p,i)=>[p,i]).filter(x=>x[0]).pop(); if(last) g+=`<circle cx="${last[0][0]}" cy="${last[0][1]}" r="4" fill="${s.color}" stroke="${cssVar('--surface')}" stroke-width="2"/>`;
    });
  }
  g+=`<line id="${el.id}-x" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" stroke="${cssVar('--ink-3')}" stroke-dasharray="3 3" opacity="0"/>`;
  g+=`<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=g;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xl=el.querySelector('#'+CSS.escape(el.id+'-x'));
  const move=(ev)=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width; let i = kind==='bar'? Math.floor((px-padL)/band) : Math.round((px-padL)/(iw/Math.max(1,n-1))); i=Math.max(0,Math.min(n-1,i));
    const rows=spec.series.map(s=>{ const v=s.values[i]; return v==null?'':`<div><span class="sw" style="background:${s.colorFn?s.colorFn(v):s.color}"></span>${esc(s.name)} <b>${esc(spec.yFmt(v))}</b></div>`; }).join('');
    tip.innerHTML=`<div class="muted" style="color:inherit;opacity:.75">${esc(spec.tipLabel?spec.tipLabel(i):labels[i])}</div>${rows}${spec.tipExtra?spec.tipExtra(i):''}`; tip.hidden=false;
    const cx=xC(i)*r.width/W; tip.style.left=Math.max(70,Math.min(r.width-70,cx))+'px'; tip.style.top='6px'; tip.style.transform='translate(-50%,0)';
    xl.setAttribute('x1',xC(i)); xl.setAttribute('x2',xC(i)); xl.setAttribute('opacity','.8'); };
  const leave=()=>{ tip.hidden=true; xl.setAttribute('opacity','0'); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',leave); svg.addEventListener('pointerdown',move);
}
const C = { s1:()=>cssVar('--s1'), s2:()=>cssVar('--s2'), pos:()=>cssVar('--pos'), neg:()=>cssVar('--neg'), ink3:()=>cssVar('--ink-3') };
const pctAxis=(v,axis)=> axis ? (v*100).toFixed(Math.abs(v)<0.1&&v!==0?1:0).replace('-','−')+'%' : pct(v,2);
