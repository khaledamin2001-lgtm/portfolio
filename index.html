<title>Khaled Portfolio</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F3F6F4}img{max-width:100%}[hidden]{display:none!important}
#lock{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg,#F3F6F4);color:var(--ink,#0F1A17);overflow-y:auto}
#lock .lk{width:100%;max-width:360px;display:flex;flex-direction:column;gap:18px;text-align:center}
#lock .lk-mark{width:64px;height:64px;margin:0 auto;border-radius:16px;background:var(--accent,#0B6E5F);display:grid;place-items:center}
#lock .lk-mark svg{width:36px;height:36px}
#lock h1{margin:0;font:600 24px/1.2 var(--f-display,Georgia,serif);text-wrap:balance}
#lock p{margin:0;color:var(--ink-2,#46534E);font-size:14px;line-height:1.5}
#lock form{display:flex;flex-direction:column;gap:10px}
#lock input{font:500 17px/1.2 var(--f-ui,system-ui,sans-serif);padding:13px 14px;border-radius:10px;border:1px solid var(--input-rule,#C9D4CF);background:var(--input,#fff);color:var(--ink,#0F1A17);text-align:center;letter-spacing:.04em;width:100%;box-sizing:border-box}
#lock input:focus{outline:2px solid var(--accent,#0B6E5F);outline-offset:1px}
#lock .lk-btn{font:600 16px/1 var(--f-ui,system-ui,sans-serif);padding:14px;border-radius:10px;border:0;background:var(--accent,#0B6E5F);color:var(--accent-ink,#fff);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#lock .lk-btn.ghost{background:transparent;color:var(--accent,#0B6E5F);border:1px solid var(--rule,#DAE2DE)}
#lock .lk-btn:disabled{opacity:.6;cursor:default}
#lock .lk-link{background:none;border:0;color:var(--ink-3,#6F7D78);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
#lock .lk-err{color:var(--neg,#c02f2f);font-size:14px;min-height:1.2em}
#lock .lk-sep{display:flex;align-items:center;gap:10px;color:var(--ink-3,#6F7D78);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#lock .lk-sep::before,#lock .lk-sep::after{content:"";flex:1;height:1px;background:var(--rule,#DAE2DE)}
#lock .lk-foot{font-size:12px;color:var(--ink-3,#6F7D78)}
body.pd-locked{overflow:hidden}
#pd-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;max-width:1240px;margin:28px auto 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule,#DAE2DE);color:var(--ink-3,#6F7D78);font-size:12px}
#pd-bar button{font:500 12px/1 var(--f-ui,system-ui,sans-serif);padding:8px 12px;border-radius:8px;border:1px solid var(--rule,#DAE2DE);background:var(--surface,#fff);color:var(--ink-2,#46534E);cursor:pointer}
</style></head><body class="pd-locked">
<div id="lock" role="dialog" aria-modal="true" aria-label="Unlock portfolio"></div>
<script>/* Live-site lock. The portfolio data is published encrypted (data.enc.json) to the site's public key; the matching private
   key is itself published only wrapped by the one-time setup key (keys.json). A device that has been set up once keeps the
   private key wrapped by a non-extractable browser key, and opens it with the password or Face ID / fingerprint. */
(function(){
  'use strict';
  const PASS_HASH = '1593fca767732516ec1e1552e3ba3f2d03d8037191f436662ad514b967ddb32f'; // sha256('pd-v1:' + password, lower-cased)
  const MAX_TRIES = 10, RELOCK_MS = 5 * 60e3, REFRESH_MS = 30 * 60e3, LS = 'pd.device.v1';
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
  const hex = (u) => [...new Uint8Array(u)].map((b) => b.toString(16).padStart(2, '0')).join('');
  const $l = (s) => document.querySelector('#lock ' + s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const bio = (() => { const u = navigator.userAgent; if (/iPhone|iPad/.test(u)) return 'Face ID'; if (/Macintosh/.test(u)) return 'Touch ID'; if (/Android/.test(u)) return 'fingerprint'; if (/Windows/.test(u)) return 'Windows Hello'; return 'Face ID / fingerprint'; })();

  /* ---------- device storage ---------- */
  const idb = (mode, fn) => new Promise((res, rej) => { const o = indexedDB.open('pd-lock', 1); o.onupgradeneeded = () => o.result.createObjectStore('k'); o.onerror = () => rej(o.error);
    o.onsuccess = () => { const t = o.result.transaction('k', mode); const r = fn(t.objectStore('k')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }; });
  const getDev = () => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } };
  const putDev = (d) => { try { localStorage.setItem(LS, JSON.stringify(d)); } catch (e) {} };
  async function forget() { try { localStorage.removeItem(LS); } catch (e) {} try { await idb('readwrite', (s) => s.clear()); } catch (e) {} }

  /* ---------- keys ---------- */
  let KEYS = null, PK8 = null, DATA_AT = null, lastFetch = 0;
  async function unwrapWithSetupKey(code) {
    const w = KEYS.wrap, clean = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const base = await crypto.subtle.importKey('raw', enc.encode(clean), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: ub64(w.salt), iterations: w.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(w.iv), additionalData: enc.encode('portfolio-key-v1') }, k, ub64(w.ct)));
  }
  async function storeOnDevice(pk8) {
    const dk = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const iv = rnd(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dk, pk8);
    await idb('readwrite', (s) => s.put(dk, 'device'));
    putDev({ iv: b64(iv), ct: b64(ct), tries: 0, cred: null, at: new Date().toISOString() });
  }
  async function loadFromDevice() {
    const d = getDev(), dk = await idb('readonly', (s) => s.get('device'));
    if (!d || !dk) throw new Error('This device is not set up');
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(d.iv) }, dk, ub64(d.ct)));
  }

  /* ---------- data ---------- */
  async function fetchData() {
    const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Could not download the portfolio data (' + r.status + ')');
    const e = await r.json();
    const priv = await crypto.subtle.importKey('pkcs8', PK8, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    const epk = ub64(e.epk);
    const pub = await crypto.subtle.importKey('raw', epk, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, priv, 256);
    const hk = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: epk, info: enc.encode('portfolio-data-v1') }, hk, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(e.iv), additionalData: enc.encode('portfolio-data-v1') }, key, ub64(e.ct));
    const plain = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    lastFetch = Date.now();
    return JSON.parse(plain);
  }

  /* ---------- read-only database for the page ---------- */
  let DOCS = {}, dbResolve; const listeners = new Set();
  const dbReady = new Promise((r) => (dbResolve = r));
  const snap = (id, d) => ({ id, exists: d != null, data: () => (d == null ? undefined : JSON.parse(JSON.stringify(d))), metadata: {} });
  const fire = (l) => { try {
    if (l.kind === 'doc') l.f(snap(l.path.split('/').pop(), DOCS[l.path]));
    else { const docs = Object.keys(DOCS).filter((p) => p.startsWith(l.path + '/') && p.split('/').length === l.path.split('/').length + 1).sort().map((p) => snap(p.split('/').pop(), DOCS[p])); l.f({ docs, size: docs.length, empty: !docs.length }); }
  } catch (e) { console.error(e); } };
  const readOnly = () => Promise.reject(Object.assign(new Error('This live site is read-only. Make changes on the Claude page; they show up here after the next daily update.'), { code: 'read_only' }));
  const sub = (kind, path) => ({ onSnapshot(f) { const l = { kind, path, f }; listeners.add(l); setTimeout(() => fire(l), 0); return () => listeners.delete(l); } });
  const db = Object.freeze({
    doc: (p) => ({ ...sub('doc', p), get: async () => snap(p.split('/').pop(), DOCS[p]), set: readOnly, update: readOnly, delete: readOnly }),
    collection: (p) => ({ ...sub('col', p), get: async () => { const docs = Object.keys(DOCS).filter((k) => k.startsWith(p + '/')).map((k) => snap(k.split('/').pop(), DOCS[k])); return { docs, size: docs.length, empty: !docs.length }; } }),
  });
  window.claude = Object.freeze({ use: async (n) => (n === 'db' ? dbReady : null) });
  function publish(bundle) {
    DOCS = bundle.docs || {}; DATA_AT = bundle.exportedAt;
    listeners.forEach(fire);
    const t = document.getElementById('pd-updated');
    if (t && DATA_AT) t.textContent = 'Data as of ' + new Date(DATA_AT).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  }

  /* ---------- WebAuthn (Face ID / Touch ID / fingerprint) ---------- */
  const canBio = async () => { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } };
  async function enrollBio() {
    const c = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Portfolio' }, user: { id: rnd(16), name: 'portfolio', displayName: 'Portfolio' }, challenge: rnd(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, attestation: 'none' } });
    const d = getDev(); d.cred = b64(c.rawId); putDev(d);
  }
  async function verifyBio() {
    const d = getDev(), challenge = rnd(32);
    const a = await navigator.credentials.get({ publicKey: { challenge, allowCredentials: [{ type: 'public-key', id: ub64(d.cred), transports: ['internal', 'hybrid'] }], userVerification: 'required', timeout: 60000 } });
    const cd = JSON.parse(dec.decode(a.response.clientDataJSON));
    const want = b64(challenge).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const flags = new Uint8Array(a.response.authenticatorData)[32];
    if (cd.type !== 'webauthn.get' || cd.challenge !== want || cd.origin !== location.origin || !(flags & 4)) throw new Error('verification failed');
  }

  /* ---------- screens ---------- */
  const MARK = '<div class="lk-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 27l8-9 6 5 11-13"/><path d="M23 10h7v7"/></svg></div>';
  const lockEl = () => document.getElementById('lock');
  function screen(html) { const l = lockEl(); l.hidden = false; document.body.classList.add('pd-locked'); l.innerHTML = '<div class="lk">' + MARK + html + '</div>'; }
  function open() { const l = lockEl(); l.hidden = true; l.innerHTML = ''; document.body.classList.remove('pd-locked'); }
  const err = (m) => { const e = $l('.lk-err'); if (e) e.textContent = m || ''; };

  function setupScreen(note) {
    screen(`<h1>Set up this device</h1><p>Enter your setup key once on each new phone or computer. After that you unlock with your password or ${esc(bio)}.</p>
      <form id="lk-setup" autocomplete="off"><input id="lk-code" data-testid="live-setup-key" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" aria-label="Setup key">
      <button class="lk-btn" data-testid="live-setup-submit">Continue</button><div class="lk-err" role="alert">${esc(note || '')}</div></form>
      <p class="lk-foot">Your figures are encrypted. Without the setup key this page shows nothing.</p>`);
    $l('#lk-code').focus();
    $l('#lk-setup').onsubmit = async (ev) => { ev.preventDefault(); const b = $l('.lk-btn'); b.disabled = true; err('Checking…');
      try { const pk8 = await unwrapWithSetupKey($l('#lk-code').value); await storeOnDevice(pk8); PK8 = pk8; await start(); await offerBio(); }
      catch (e) { console.error(e); b.disabled = false; err(e && e.name === 'OperationError' ? 'That setup key is not right. Check it and try again.' : 'Could not set up: ' + (e.message || e)); } };
  }
  async function offerBio() {
    if (!(await canBio())) return open();
    screen(`<h1>Use ${esc(bio)}?</h1><p>Unlock with ${esc(bio)} on this device. Your password still works as a backup.</p>
      <button class="lk-btn" id="lk-bio-on" data-testid="live-bio-enable">Turn on ${esc(bio)}</button><button class="lk-btn ghost" id="lk-bio-no" data-testid="live-bio-skip">Not now</button><div class="lk-err" role="alert"></div>`);
    $l('#lk-bio-no').onclick = open;
    $l('#lk-bio-on').onclick = async () => { try { await enrollBio(); open(); } catch (e) { console.error(e); err(bio + ' was not turned on. You can use the password instead.'); } };
  }
  function unlockScreen(auto) {
    const d = getDev();
    screen(`<h1>Portfolio</h1><p>Unlock to see your portfolio.</p>
      ${d.cred ? `<button class="lk-btn" id="lk-bio" data-testid="live-bio-unlock">Unlock with ${esc(bio)}</button><div class="lk-sep">or</div>` : ''}
      <form id="lk-pass" autocomplete="off"><input id="lk-pw" type="password" data-testid="live-password" placeholder="Password" aria-label="Password" autocomplete="current-password">
      <button class="lk-btn ${d.cred ? 'ghost' : ''}" data-testid="live-password-submit">Unlock</button><div class="lk-err" role="alert"></div></form>
      <button class="lk-link" id="lk-forget" data-testid="live-forget-device">Forget this device</button>`);
    if (d.cred) { $l('#lk-bio').onclick = () => bioUnlock(); if (auto) bioUnlock(true); } else $l('#lk-pw').focus();
    $l('#lk-pass').onsubmit = async (ev) => { ev.preventDefault();
      const h = hex(await crypto.subtle.digest('SHA-256', enc.encode('pd-v1:' + $l('#lk-pw').value.trim().toLowerCase())));
      const dv = getDev();
      if (h !== PASS_HASH) { dv.tries = (dv.tries || 0) + 1; putDev(dv); $l('#lk-pw').value = '';
        if (dv.tries >= MAX_TRIES) { await forget(); return setupScreen('Too many wrong passwords. This device was reset; enter your setup key.'); }
        return err(`Wrong password. ${MAX_TRIES - dv.tries} tries left before this device is reset.`); }
      dv.tries = 0; putDev(dv); await unlocked(); };
    $l('#lk-forget').onclick = () => { screen(`<h1>Forget this device?</h1><p>You will need your setup key to open the portfolio here again.</p>
      <button class="lk-btn" id="lk-f-yes" data-testid="live-forget-confirm">Forget this device</button><button class="lk-btn ghost" id="lk-f-no">Cancel</button>`);
      $l('#lk-f-yes').onclick = async () => { await forget(); location.reload(); }; $l('#lk-f-no').onclick = () => unlockScreen(false); };
  }
  async function bioUnlock(quiet) { try { await verifyBio(); await unlocked(); } catch (e) { if (!quiet) err(bio + ' did not unlock. Try again or use the password.'); } }
  async function unlocked() {
    try { if (!PK8) { PK8 = await loadFromDevice(); await start(); } else if (Date.now() - lastFetch > REFRESH_MS) refresh(); open(); }
    catch (e) { console.error(e); if (/not set up/.test(e.message) || e.name === 'OperationError') { await forget(); setupScreen('This device needs to be set up again.'); } else err(e.message); }
  }
  async function start() { publish(await fetchData()); dbResolve(db); }
  async function refresh() { try { const b = await fetchData(); if (b.exportedAt !== DATA_AT) publish(b); } catch (e) { console.warn('refresh failed', e); } }
  window.pdLock = () => { if (getDev()) unlockScreen(false); };

  /* ---------- boot ---------- */
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!PK8 || !lockEl().hidden) return;
    if (Date.now() - hiddenAt > RELOCK_MS) unlockScreen(true); else if (Date.now() - lastFetch > REFRESH_MS) refresh();
  });
  (async () => {
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) return screen('<h1>Browser too old</h1><p>Update your browser (Safari 16.4+, Chrome 80+) to open the portfolio.</p>');
    try { KEYS = await (await fetch('keys.json', { cache: 'no-store' })).json(); } catch (e) { return screen('<h1>Offline</h1><p>The portfolio could not load. Check your connection and reload.</p>'); }
    if (getDev()) unlockScreen(true); else setupScreen();
  })();
})();
</script>

<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EDF2EF; --ink:#0F1A17; --ink-2:#46534E; --ink-3:#6F7D78;
  --rule:#DAE2DE; --grid:#E5EBE8; --accent:#0B6E5F; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --pos:#137a3a; --neg:#c02f2f; --warn:#8f5a00;
  --pos-bg:#E2F3E7; --neg-bg:#FBE7E7; --warn-bg:#FFF1D2; --input:#FFFFFF; --input-rule:#C9D4CF;
  --shadow:0 1px 2px rgba(15,26,23,.06),0 4px 16px rgba(15,26,23,.05);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --ink:#E7EEEB; --ink-2:#A8B6B1; --ink-3:#7F8E89;
    --rule:#26322E; --grid:#212C28; --accent:#3DB39D; --accent-ink:#04201A; --accent-soft:#12332D;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#4BC46D; --neg:#F07272; --warn:#E6A93B;
    --pos-bg:#12301D; --neg-bg:#3A1717; --warn-bg:#35280E; --input:#0F1614; --input-rule:#33423D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --ink:#E7EEEB; --ink-2:#A8B6B1; --ink-3:#7F8E89;
  --rule:#26322E; --grid:#212C28; --accent:#3DB39D; --accent-ink:#04201A; --accent-soft:#12332D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#4BC46D; --neg:#F07272; --warn:#E6A93B;
  --pos-bg:#12301D; --neg-bg:#3A1717; --warn-bg:#35280E; --input:#0F1614; --input-rule:#33423D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1280px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
@media (max-width:600px){.mast-in{padding-inline:16px;gap:10px}}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:600 19px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:860px){nav.tabs{margin-left:0;width:100%;padding-bottom:8px}}

/* tape */

<script>
/* Portfolio engine — a line-by-line port of the workbook's ⚙️ Model tab.
   Every function is pure: data in, numbers out. Dates are 'YYYY-MM-DD', months 'YYYY-MM'. */
(function (root) {
  'use strict';
  const TYPES = ['Deposit', 'Withdrawal', 'Buy', 'Sell', 'Dividend', 'Fee', 'Rebate'];

  // ---------- date helpers ----------
  const pad = (n) => String(n).padStart(2, '0');
  const monthOf = (d) => d.slice(0, 7);
  const addMonths = (m, k) => {
    let [y, mo] = m.split('-').map(Number);
    mo += k;
    y += Math.floor((mo - 1) / 12);
    mo = ((mo - 1) % 12 + 12) % 12 + 1;
    return `${y}-${pad(mo)}`;
  };
  const eom = (m) => {
    const [y, mo] = m.split('-').map(Number);
    return `${m}-${pad(new Date(Date.UTC(y, mo, 0)).getUTCDate())}`;
  };
  const dayNum = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 86400000;
  const monthsBetween = (a, b) => {
    const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
    return (yb - ya) * 12 + (mb - ma);
  };
  const cairoToday = () => {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return new Date().toISOString().slice(0, 10); }
  };

  // ---------- stats helpers ----------
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const mean = (a) => (a.length ? sum(a) / a.length : 0);
  const stdevS = (a) => {
    if (a.length < 2) return 0;
    const m = mean(a);
    return Math.sqrt(sum(a.map((x) => (x - m) ** 2)) / (a.length - 1));
  };
  const covS = (a, b) => {
    const ma = mean(a), mb = mean(b);
    return sum(a.map((x, i) => (x - ma) * (b[i] - mb))) / (a.length - 1);
  };
  const slope = (y, x) => covS(y, x) / (stdevS(x) ** 2);
  const correl = (a, b) => covS(a, b) / (stdevS(a) * stdevS(b));

  // Excel-compatible XIRR (actual/365, Newton with bisection fallback)
  function xirr(flows) {
    if (!flows.length) return null;
    const t0 = dayNum(flows[0].date);
    const f = (r) => sum(flows.map((c) => c.amount / Math.pow(1 + r, (dayNum(c.date) - t0) / 365)));
    const df = (r) => sum(flows.map((c) => { const t = (dayNum(c.date) - t0) / 365; return -t * c.amount / Math.pow(1 + r, t + 1); }));
    let r = 0.1;
    for (let i = 0; i < 100; i++) {
      const v = f(r), d = df(r);
      if (!isFinite(v) || !isFinite(d) || d === 0) break;
      const nr = r - v / d;
      if (Math.abs(nr - r) < 1e-10) return nr > -1 ? nr : null;
      r = nr <= -1 ? (r - 1) / 2 : nr;
    }
    let lo = -0.9999, hi = 100;
    if (f(lo) * f(hi) > 0) return null;
    for (let i = 0; i < 300; i++) {
      const mid = (lo + hi) / 2;
      if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid;
    }
    return (lo + hi) / 2;
  }

  // ---------- ledger: average-cost engine (🗂️ Data helper columns K–P) ----------
  function sortLedger(tx) {
    return tx.map((t, i) => ({ ...t, _i: i })).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a._i - b._i));
  }
  function runLedger(tx) {
    const run = {};
    return sortLedger(tx).map((t) => {
      const r = { ...t, basis: 0 };
      if (!t.a || (t.t !== 'Buy' && t.t !== 'Sell')) return r;
      const s = run[t.a] || (run[t.a] = { sh: 0, cost: 0 });
      if (t.t === 'Buy') { s.sh += t.q || 0; s.cost += Math.abs(t.amt || 0); }
      else {
        r.basis = s.sh > 0 ? (s.cost / s.sh) * (t.q || 0) : 0;
        s.sh -= t.q || 0; s.cost -= r.basis;
      }
      return r;
    });
  }

  // ---------- prices ----------
  // Latest of manual (asset.price/priceDate) and automatic (market.quotes[symbol]) wins; ties go to automatic.
  function effectivePrice(asset, market, settings) {
    if (!asset) return null;
    const man = asset.price > 0 ? { price: asset.price, date: asset.priceDate || settings.priceDate || null, source: 'manual' } : null;
    const q = market && market.quotes && asset.symbol ? market.quotes[asset.symbol] : null;
    const auto = q && q.price > 0 ? { price: q.price, date: q.date || null, source: 'auto', chg: q.chg } : null;
    if (auto && man) return (man.date || '') > (auto.date || '') ? man : auto;
    return auto || man;
  }

  // ---------- positions engine (⚙️ Model §C) ----------
  function positions(ledger, assets, market, settings, today, period, fallback) {
    const byName = {};
    (assets || []).forEach((a) => { byName[a.name] = a; });
    const order = [];
    const P = {};
    ledger.forEach((t) => {
      if (t.t === 'Buy' && t.a && !P[t.a]) { P[t.a] = { name: t.a, firstBuy: t.d, lastSell: null, bought: 0, sold: 0, buyCost: 0, proceeds: 0, soldBasis: 0, divs: 0 }; order.push(t.a); }
    });
    ledger.forEach((t) => {
      const p = P[t.a];
      if (t.t === 'Buy' && p) { p.bought += t.q || 0; p.buyCost += Math.abs(t.amt || 0); }
      if (t.t === 'Sell' && p) { p.sold += t.q || 0; p.proceeds += t.amt || 0; p.soldBasis += t.basis; if (!p.lastSell || t.d > p.lastSell) p.lastSell = t.d; }
    });
    const thr = settings.openThreshold ?? 0.5;
    const rows = order.sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' })).map((name) => {
      const p = P[name], a = byName[name] || {};
      const sym = a.symbol || '';
      p.divs = sum(ledger.filter((t) => t.t === 'Dividend' && t.a && (t.a === name || (sym && t.a === sym))).map((t) => t.amt || 0));
      const open = p.bought - p.sold;
      const isOpen = open > thr;
      let px = isOpen ? effectivePrice(a, market, settings) : null;
      if (isOpen && !px && fallback) { const f = fallback(name); if (f) px = { price: f.p, date: f.d, source: 'model' }; }
      const openCost = isOpen ? p.buyCost - p.soldBasis : 0;
      const mv = isOpen && px ? open * px.price : null;
      const unreal = isOpen ? (mv != null ? mv - openCost : null) : 0;
      const realized = p.proceeds - p.soldBasis;
      const total = realized + (unreal || 0) + p.divs;
      const holdEnd = isOpen ? today : (p.lastSell || p.firstBuy);
      const closedInPeriod = !isOpen && p.lastSell && period && p.lastSell >= `${period.from}-01` && p.lastSell <= eom(period.to);
      const stop = +a.stop || 0, target = +a.target || 0;
      return {
        name, symbol: sym, sector: a.sector || 'Unclassified', firstBuy: p.firstBuy, lastSell: p.lastSell,
        bought: p.bought, sold: p.sold, open, status: isOpen ? 'Open' : 'Closed',
        buyCost: p.buyCost, proceeds: p.proceeds, soldBasis: p.soldBasis, openCost, divs: p.divs, realized,
        price: px ? px.price : null, priceDate: px ? px.date : null, priceSource: px ? px.source : null, chg: px && px.source === 'auto' ? px.chg : null,
        avgCost: isOpen && open ? openCost / open : null,
        mv, unreal, total, roi: p.buyCost > 0 ? total / p.buyCost : 0,
        holdDays: dayNum(holdEnd) - dayNum(p.firstBuy),
        outcome: !isOpen && p.sold > 0 ? (total > 0 ? 'WIN' : 'LOSS') : '',
        shareGap: !isOpen ? Math.round(open) : 0,
        closedInPeriod: !!closedInPeriod,
        stop, target,
        riskToStop: isOpen && stop > 0 && px && px.price > stop ? open * (px.price - stop) : 0,
      };
    });
    const openRows = rows.filter((r) => r.status === 'Open');
    const mvTotal = sum(openRows.map((r) => r.mv || 0));
    openRows.forEach((r) => { r.weight = mvTotal ? (r.mv || 0) / mvTotal : 0; });
    return { rows, open: openRows, mvTotal };
  }

  // ---------- monthly engine (⚙️ Model §A) ----------
  // marks: {"YYYY-MM": {cash, securities, benchReturn, benchClose, usdegp, cpi, provisional, note}}
  // live (optional): {month, cash, securities, benchClose, prevBenchClose, usdegp} replaces a provisional/missing current-month row.
  function monthly(settings, marks, ledger, live) {
    const out = [];
    const inc = settings.inception;
    const keys = Object.keys(marks || {}).filter((k) => k >= inc).sort();
    let last = keys.length ? keys[keys.length - 1] : inc;
    if (live && live.month > last) last = live.month;
    const n = monthsBetween(inc, last) + 1;
    let prev = null;
    for (let i = 0; i < n; i++) {
      const m = addMonths(inc, i);
      let mk = { ...(marks[m] || {}) };
      let isLive = false;
      if (live && live.month === m && (!marks[m] || marks[m].provisional || marks[m].cash == null)) {
        mk = { ...mk, cash: live.cash, securities: live.securities, provisional: true };
        if (live.benchClose) mk.benchClose = live.benchClose;
        if (live.usdegp) mk.usdegp = live.usdegp;
        isLive = true;
      }
      const has = typeof mk.cash === 'number' && typeof mk.securities === 'number';
      const from = `${m}-01`, to = eom(m);
      const inM = ledger.filter((t) => t.d >= from && t.d <= to);
      const s = (type) => sum(inM.filter((t) => t.t === type).map((t) => t.amt || 0));
      const deposits = Math.abs(s('Deposit')), withdrawals = Math.abs(s('Withdrawal'));
      const row = {
        month: m, has, cash: mk.cash, securities: mk.securities, value: has ? mk.cash + mk.securities : null,
        deposits, withdrawals, netFlow: deposits - withdrawals, dividends: s('Dividend'),
        buys: Math.abs(s('Buy')), sells: s('Sell'), trades: inM.filter((t) => t.t === 'Buy' || t.t === 'Sell').length,
        provisional: !!mk.provisional, live: isLive, note: mk.note || '',
        benchClose: mk.benchClose ?? null, usdegp: typeof mk.usdegp === 'number' ? mk.usdegp : null, cpi: typeof mk.cpi === 'number' ? mk.cpi : null,
      };
      row.opening = prev ? prev.value : settings.openingValue;
      row.ret = has && row.opening != null ? row.value / (row.opening + row.netFlow) - 1 : null;
      // benchmark: closes win over typed %, as in the workbook

        const a = bySym[h.ticker.toUpperCase()] || byLower[h.ticker.toLowerCase()] || (h.name && byLower[h.name.toLowerCase()]);

  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/58))));
  let g=`<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img" aria-label="${esc(spec.title||'chart')}">`;
  ticks.forEach(t=>{ g+=`<line class="${t===0?'zero':'gl'}" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end">${esc(spec.yFmt(t,true))}</text>`; });
  labels.forEach((l,i)=>{ if(i%every===0 || (kind!=='bar'&&i===n-1&&n>1&&(n-1)%every>every/2)) g+=`<text x="${xC(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`; });
  if(kind==='bar'){
    const k=spec.series.length; const gap=2; const bw=Math.max(2,Math.min(26,(band*0.72-(k-1)*gap)/k));
    spec.series.forEach((s,si)=>{ s.values.forEach((v,i)=>{ if(v==null) return; const x0=xC(i)-(k*bw+(k-1)*gap)/2+si*(bw+gap); const y0=y(Math.max(0,v)), y1=y(Math.min(0,v)); const hh=Math.max(1,y1-y0); const col = s.colorFn? s.colorFn(v) : s.color; const r=Math.min(3,bw/2,hh);
      g+= v>=0 ? `<path d="M${x0},${y1} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${y1} Z" fill="${col}"/>` : `<path d="M${x0},${y0} V${y1-r} Q${x0},${y1} ${x0+r},${y1} H${x0+bw-r} Q${x0+bw},${y1} ${x0+bw},${y1-r} V${y0} Z" fill="${col}"/>`; }); });
  } else {
    spec.series.forEach(s=>{
      const pts=s.values.map((v,i)=>v==null?null:[xC(i),y(v)]);
      let d=''; pts.forEach((p,i)=>{ if(!p) return; d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); });
      if(s.area){ const f=pts.filter(Boolean); if(f.length) g+=`<path d="${d}L${f[f.length-1][0]},${y(Math.max(min,0))}L${f[0][0]},${y(Math.max(min,0))}Z" fill="${s.color}" opacity=".16"/>`; }
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      const last=pts.map((p,i)=>[p,i]).filter(x=>x[0]).pop(); if(last) g+=`<circle cx="${last[0][0]}" cy="${last[0][1]}" r="4" fill="${s.color}" stroke="${cssVar('--surface')}" stroke-width="2"/>`;
    });
  }
  g+=`<line id="${el.id}-x" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" stroke="${cssVar('--ink-3')}" stroke-dasharray="3 3" opacity="0"/>`;
  g+=`<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=g;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xl=el.querySelector('#'+CSS.escape(el.id+'-x'));
  const move=(ev)=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width; let i = kind==='bar'? Math.floor((px-padL)/band) : Math.round((px-padL)/(iw/Math.max(1,n-1))); i=Math.max(0,Math.min(n-1,i));
    const rows=spec.series.map(s=>{ const v=s.values[i]; return v==null?'':`<div><span class="sw" style="background:${s.colorFn?s.colorFn(v):s.color}"></span>${esc(s.name)} <b>${esc(spec.yFmt(v))}</b></div>`; }).join('');
    tip.innerHTML=`<div class="muted" style="color:inherit;opacity:.75">${esc(spec.tipLabel?spec.tipLabel(i):labels[i])}</div>${rows}${spec.tipExtra?spec.tipExtra(i):''}`; tip.hidden=false;
    const cx=xC(i)*r.width/W; tip.style.left=Math.max(70,Math.min(r.width-70,cx))+'px'; tip.style.top='6px'; tip.style.transform='translate(-50%,0)';
    xl.setAttribute('x1',xC(i)); xl.setAttribute('x2',xC(i)); xl.setAttribute('opacity','.8'); };
  const leave=()=>{ tip.hidden=true; xl.setAttribute('opacity','0'); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',leave); svg.addEventListener('pointerdown',move);
}
const C = { s1:()=>cssVar('--s1'), s2:()=>cssVar('--s2'), pos:()=>cssVar('--pos'), neg:()=>cssVar('--neg'), ink3:()=>cssVar('--ink-3') };
const pctAxis=(v,axis)=> axis ? (v*100).toFixed(Math.abs(v)<0.1&&v!==0?1:0).replace('-','−')+'%' : pct(v,2);
const egpAxis=(v,axis)=> axis ? short(v) : egp(v)+' EGP';

// ---------- shared bits ----------
function kpi(label, value, detail, cls='', unit=''){ return `<div class="kpi ${cls}"><div class="eyebrow">${label}</div><div class="v">${value}${unit?`<small>${unit}</small>`:''}</div>${detail?`<div class="d">${detail}</div>`:''}</div>`; }
function dayPL(){ const R=S.R; let pl=0, base=0; R.pos.open.forEach(r=>{ if(r.chg!=null && r.priceSource==='auto' && r.mv){ const prev=r.mv/(1+r.chg/100); pl+=r.mv-prev; base+=prev; } }); return {pl, pct: base? pl/base : null}; }
function checkSummary(){ const c=S.R.checks; const e=c.filter(x=>x.status==='error').length, w=c.filter(x=>x.status==='warn').length; return e? {cls:'err',text:`${e} check${e>1?'s':''} failing`} : w? {cls:'warn',text:`All pass · ${w} warning${w>1?'s':''}`} : {cls:'ok',text:'All checks pass'}; }

    ${kpi('Real return', st.realTwr!=null?`<span class="${sgn(st.realTwr)}">${pct(st.realTwr)}</span>`:'—', st.inflation!=null?`after ${pct(st.inflation,1,false)} Egypt CPI`:`Needs CPI for ${noCpi.join(', ')}`)}

function rollForward(st){ return `<dl class="kv">
  <dt>Opening value · ${M(PE.addMonths(st.rows[0].month,-1))}</dt><dd>${egp(st.opening)}</dd>
  <dt>Plus: deposits</dt><dd>${egp(st.deposits)}</dd><dt>Less: withdrawals</dt><dd>${egp(-st.withdrawals)}</dd>
  <dt>Plus: investment gain</dt><dd class="${sgn(st.netGain)}">${egp(st.netGain)}</dd>

  <p class="note" style="margin:8px 0 0">EGP. Investment gain includes dividends of ${egp(st.dividends)}.</p>`; }
function sectorBars(){ const secs=S.R.sectors; if(!secs.length) return '<p class="muted">No open positions.</p>'; const max=secs[0].weight;
  return `<div style="display:grid;gap:10px">${secs.map(s=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center"><span>${esc(s.sector)}</span><span class="num"><b>${pct(s.weight,1,false)}</b> <span class="muted">${short(s.mv)}</span></span><div class="bar" style="grid-column:1/-1;height:8px"><i style="width:${(s.weight/max*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`; }

      ${c.withStop<c.openCount?`<p class="note" style="margin:10px 0 0">${c.openCount-c.withStop} positions have no stop loss. Add them under Inputs to measure downside.</p>`:''}</div>
  </div>`;
}

async function addTx(rows){

function normTx(o){
  const t = PE.TYPES.find(x=>x.toLowerCase()===String(o.t||'').trim().toLowerCase()); if(!t) throw new Error(`Unknown type "${o.t}"`);
  const d = parseDate(o.d); if(!d) throw new Error(`Unreadable date "${o.d}"`);
  const amt = Math.abs(parseFloat(String(o.amt).replace(/[, ]/g,''))); if(!isFinite(amt)) throw new Error(`Unreadable amount "${o.amt}"`);
  const r={id:newId(), d, t, amt: SIGN[t]*amt};
  const a=String(o.a||'').trim(); if(a) r.a=a;
  const q=parseFloat(String(o.q??'').replace(/[, ]/g,'')); if(isFinite(q)&&q>0) r.q=q;
  const p=parseFloat(String(o.p??'').replace(/[, ]/g,'')); if(isFinite(p)&&p>0) r.p=p;
  if((t==='Buy'||t==='Sell')&&(!r.a||!r.q)) throw new Error(`${t} on ${d} needs an asset and shares`);
  r.acc = String(o.acc||'Main').trim()||'Main';
  return r;
}
function parseDate(s){ s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null; }
function parseCsv(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const split=(l)=>{ const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; } else if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); };
  let start=0; const h=split(lines[0]).map(s=>s.toLowerCase()); let idx={d:0,t:1,a:2,q:3,p:4,amt:5,acc:6};
  if(h.includes('date')){ start=1; const f=(...n)=>h.findIndex(x=>n.some(k=>x.startsWith(k))); idx={d:f('date'),t:f('type'),a:f('asset','name','security'),q:f('shares','quantity','qty'),p:f('price'),amt:f('amount','net'),acc:f('account')}; }
  return lines.slice(start).map(l=>{ const c=split(l); const g=k=>idx[k]>=0?c[idx[k]]:''; return {d:g('d'),t:g('t'),a:g('a'),q:g('q'),p:g('p'),amt:g('amt'),acc:g('acc')}; }); }

  if(D){ const off=D.recon.filter(r=>Math.abs(r.pct)>0.01); out.push({label:'Month-end marks agree with closing prices (±1%)', status: off.length?'warn':'ok', detail: off.length? off.map(r=>`${M(r.month)} ${pct(r.pct,1)}`).join(', ')+' · post the statements to replace estimated marks' : `${D.recon.length} month-ends checked`}); }
  const closed = S.R.months.filter(r=>r.has && !r.live);
  const src = (r)=> (S.marks[r.month]||{}).source || ((S.imports||{})[r.month] ? 'statement' : 'typed');
  const typed = closed.filter(r=>src(r)==='typed'), est = closed.filter(r=>src(r)==='price-estimate'), stm = closed.filter(r=>src(r)==='statement'), rec = closed.filter(r=>src(r)==='reconstructed');
  out.push({label:'Month-ends sourced from Thndr statements', status: typed.length?'warn':'ok', detail: `${stm.length} from statements` + (rec.length?` · ${rec.map(r=>M(r.month)).join(', ')} rebuilt from the next statement`:'') + (est.length?` · ${est.length} closing-price estimates (${est.map(r=>M(r.month)).join(', ')}; no holdings list on those statements)`:'') + (typed.length?` · typed by hand: ${typed.map(r=>M(r.month)).join(', ')}`:'')});
  return out;
}
function vChecks(){
  const R=S.R; const m=S.market;
  const allChecks = R.checks.concat(extraChecks());
  const hist=Object.keys(S.history).sort();
  return `
  <div class="grid g2">
    <div class="panel"><div class="phead"><div><h2>Model checks</h2><div class="sub">The same controls as the workbook cover sheet, plus a cash reconciliation</div></div><span class="chip ${checkSummary().cls}">${esc(checkSummary().text)}</span></div>
      <div class="checks" data-testid="model-checks">${allChecks.map(c=>`<div class="check"><span class="ic ${c.status}">${c.status==='ok'?'✓':c.status==='warn'?'!':'×'}</span><span>${esc(c.label)}</span><span class="dt">${esc(c.detail)}</span></div>`).join('')}</div></div>
    <div class="panel"><div class="phead"><div><h2>Price automation</h2><div class="sub">Runs Sunday to Thursday at 15:10 Cairo, after the EGX close</div></div></div>
      <dl class="kv"><dt>Last update</dt><dd>${m&&m.asOf?esc(feedStatus().text):'Not yet run'}</dd><dt>Source</dt><dd>${esc(m&&m.source||'TradingView scanner')}</dd>
      <dt>Symbols priced</dt><dd>${m?Object.keys(m.quotes||{}).length:0}</dd><dt>Symbols with no quote</dt><dd>${m&&m.missing&&m.missing.length?esc(m.missing.join(', ')):'None'}</dd>
      <dt>EGX30 Capped close</dt><dd>${m&&m.index&&m.index.EGX30CAPPED?num(m.index.EGX30CAPPED.close,1)+' · prior month-end '+num(m.index.EGX30CAPPED.prevMonthClose,1):'—'}</dd>
      <dt>Daily closes stored</dt><dd>${hist.length?`${Object.values(S.history).reduce((s,h)=>s+Object.keys(h.days||{}).length,0)} days since ${esc(hist[0])}`:'None yet'}</dd></dl>
      <p class="note" style="margin:10px 0 0">Each run also records the prior month-end EGX30 Capped close, and fills any completed month still missing Egypt CPI (CAPMAS urban CPI index) or USD/EGP (market month-end close; the CBE site blocks automated access). Values already entered are never overwritten.</p></div>
  </div>
  <div class="panel"><div class="phead"><div><h2>Methodology</h2><div class="sub">How every figure on this page is calculated</div></div></div><div class="prose">
    <h3>Time-weighted return (TWR)</h3><p>Each month: <code>r = month-end value ÷ (opening value + net deposits) − 1</code>, which treats the month's flows as arriving at the start of the month. Monthly returns are chain-linked: <code>TWR = Π(1 + r) − 1</code>. TWR removes the effect of your deposit timing and is the right figure to compare against the index.</p>
    <h3>Money-weighted return (XIRR)</h3><p>The internal rate of return of your actual cash flows: the opening value on the day before the period, every deposit and withdrawal on its date, and the closing value at period end. It rewards or penalises the timing of your deposits. Actual/365 day count, same as Excel's XIRR.</p>
    <h3>Benchmark</h3><p>EGX30 Capped, the index most comparable to a retail EGX portfolio because no single stock can dominate it. A month's return comes from consecutive month-end closes when both exist, otherwise from the typed %. Alpha is the simple difference of returns.</p>
    <h3>Cost basis and P/L</h3><p>Weighted-average cost, in ledger order. A sale's cost basis is <code>average cost × shares sold</code>; realized P/L is proceeds minus that basis. Amounts are net of Thndr commissions, as on the statement. Dividends are credited to the stock that paid them.</p>
    <h3>Risk</h3><p>Volatility is the sample standard deviation of monthly returns. Sharpe uses the monthly equivalent of the 3-month T-bill yield and is annualized by √12. Beta is the slope of portfolio on benchmark monthly returns; tracking error is the annualized standard deviation of monthly alpha; information ratio is annualized mean alpha over tracking error. Drawdown is measured on the cumulative return within the selected period. HHI is the sum of squared position weights; 1 ÷ HHI gives the effective number of equal-sized positions.</p>
    <h3>USD and real returns</h3><p>USD return converts each month at consecutive month-end USD/EGP rates: the CBE mid rate where you entered it, otherwise the market close filled automatically. Real return deflates by Egypt urban CPI (CAPMAS), month on month, filled automatically once published around the 10th.</p>
    <h3>Current month</h3><p>Until you confirm a month-end from the statement, the current month uses live prices and the broker cash balance and is labelled Live. Past months that are still provisional are flagged in the checks.</p>
    <h3>Conventions</h3><p>All money in EGP. Negative money values are shown in parentheses; returns carry a sign. Inputs you type appear in blue, following the spreadsheet colour convention for hard-coded values.</p>
  </div></div>`;
}

function hbars(items, fmt){ // diverging horizontal bars around zero

function factsheetData(m){
  const R = PE.run(dataset(), {type:'Since Inception', asOf:m}, {today:S.R.today, fallback:S.fallback});
  const live = R.live && R.live.month === m;
  const pb = pbook();
  const tr = PA.trailing(R.months, m), cal = PA.calendar(R.months, m);
  const H = live ? { rows: R.pos.open.map(r=>({name:r.name,symbol:r.symbol,sector:r.sector,mv:r.mv})), mv:R.pos.mvTotal, cash:S.settings.cash } : PA.holdingsAt(R.ledger, S.assets, pb, PE.eom(m));
  const cash = live ? S.settings.cash : (S.marks[m] && S.marks[m].cash != null ? S.marks[m].cash : H.cash);
  const tot = H.mv + Math.max(0,cash);
  const top = H.rows.filter(r=>r.mv).sort((a,b)=>b.mv-a.mv).slice(0,10).map(r=>({...r, w:r.mv/tot}));
  const secW = {}; H.rows.forEach(r=>{ if(r.mv) secW[r.sector]=(secW[r.sector]||0)+r.mv/tot; }); if(cash>0) secW['Cash & Savings']=(secW['Cash & Savings']||0)+cash/tot;
  const bd = pb.lastDayOnOrBefore(live ? S.R.today : PE.eom(m)); const bw = bd ? PA.benchWeights(S.bench, pb, bd) || [] : [];
  const secB = {}; bw.forEach(x=>{ secB[x.sector]=(secB[x.sector]||0)+x.w; });
  const sectors = [...new Set([...Object.keys(secW),...Object.keys(secB)])].map(s=>({s, p:secW[s]||0, b:secB[s]||0})).sort((a,b)=>b.p-a.p);
  const A1 = PA.attribution(R.months, {from:m,to:m}, R.ledger, S.assets, pb, S.bench, S.R.today);
  const y = m.slice(0,4);
  const Ay = PA.attribution(R.months, {from:(y+'-01')>S.settings.inception?y+'-01':S.settings.inception,to:m}, R.ledger, S.assets, pb, S.bench, S.R.today);
  const inc = (from,to)=>{ const s={div:0,reb:0,fee:0}; R.ledger.forEach(t=>{ if(t.d>=from&&t.d<=to){ if(t.t==='Dividend')s.div+=t.amt; if(t.t==='Rebate')s.reb+=t.amt; if(t.t==='Fee')s.fee+=t.amt; } }); return s; };
  const row = R.months.find(r=>r.month===m);
  return { m, R, st:R.stats, row, live, tr, cal, top, sectors, A1, Ay, value: row?row.value:tot, incM: inc(m+'-01',PE.eom(m)), incY: inc(y+'-01',PE.eom(m)) };
}

function payloadOf(res){ let p = res && (res.payload !== undefined ? res.payload : res); if(typeof p==='string'){ try{ p=JSON.parse(p); }catch(e){} }
  if(p && Array.isArray(p.content)){ const t=p.content.find(c=>c.type==='text'); if(t){ try{ p=JSON.parse(t.text); }catch(e){} } }
  if(p && p.structuredContent) p=p.structuredContent; return p; }

function loadPdfjs(){ if(!pdfjsP) pdfjsP = new Promise((res,rej)=>{ const add=(src,cb)=>{ const s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=()=>{ pdfjsP=null; rej(new Error('Could not load the PDF reader')); }; document.head.appendChild(s); };

const MONNUM={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
async function scanGmail(auto){

      const month=`${sm[2]}-${String(MONNUM[sm[1].toLowerCase()]).padStart(2,'0')}`; const monthly=/monthly/i.test(msg.subject);

async function reviewStatement(item){

    const p = payloadOf(res); if(!p || !p.raw) throw new Error('the email came back without its attachments');

}

    <div class="row">${[['ok',`${rv.matched.length} already in ledger`],[rv.fresh.length?'warn':'ok',`${rv.fresh.length} new`],[rv.conflicts.length?'warn':'ok',`${rv.conflicts.length} conflicts`],[rv.ledgerOnly.length?'warn':'ok',`${rv.ledgerOnly.length} only in ledger`],[bad.length?'err':'ok',bad.length?`${bad.length} holdings differ`:'Holdings match']].map(([c,t])=>`<span class="chip ${c}">${t}</span>`).join('')}</div></div>
    ${rv.fresh.length?`<h3 class="eyebrow" style="margin:6px 0 8px">New on the statement</h3><div style="display:grid;gap:6px">${rv.fresh.map((r,i)=>`<label style="display:flex;gap:10px;align-items:baseline"><input type="checkbox" data-pick="${i}" ${rv.pick[i]?'checked':''} id="pick-${i}"><span>${fmtRow(r)}${r.note?` <span class="note">${esc(r.note)}</span>`:''}${r.newAsset?' <span class="pill stale">new asset</span>':''}</span></label>`).join('')}</div>`:'<p class="note">Every transaction on the statement is already in your ledger.</p>'}
    ${rv.conflicts.length?`<h3 class="eyebrow" style="margin:16px 0 8px">Booked differently</h3><div style="display:grid;gap:8px">${rv.conflicts.map((c,i)=>`<div style="display:grid;gap:2px;padding:8px 10px;background:var(--surface-2);border-radius:8px"><span>Statement: ${fmtRow(c.stmt)}</span><span class="ink2">Ledger: ${fmtRow(c.ledger)}</span><label style="display:flex;gap:8px;margin-top:4px"><input type="checkbox" data-use="${i}" ${rv.use[i]?'checked':''} id="use-${i}"> Replace the ledger row with the statement row</label></div>`).join('')}</div>`:''}
    ${rv.ledgerOnly.length?`<h3 class="eyebrow" style="margin:16px 0 8px">In your ledger but not on this statement</h3><div class="note" style="display:grid;gap:4px">${rv.ledgerOnly.map(r=>`<span>${fmtRow(r)}</span>`).join('')}</div>`:''}
    ${rv.unknown.length?`<h3 class="eyebrow" style="margin:16px 0 8px">Lines the reader did not recognise</h3><div class="note" style="display:grid;gap:4px">${rv.unknown.map(r=>`<span>${esc(r.date||'')} ${esc(r.desc||'')} ${r.value!=null?egp(r.value,2):''}</span>`).join('')}</div>`:''}
    ${newAssets.length?`<h3 class="eyebrow" style="margin:16px 0 8px">New assets</h3><div class="form">${newAssets.map((r,i)=>`<label>${esc(r.a)} symbol<input type="text" class="inp" data-nsym="${esc(r.a)}" id="nsym-${i}" value="${esc(r.newAsset.ticker||'')}" placeholder="${r.acc==='MF'?'fund: leave blank':'e.g. COMI'}"></label><label>Sector<input type="text" class="inp" data-nsec="${esc(r.a)}" id="nsec-${i}" list="sector-list2" value="${r.acc==='MF'?(/saving/i.test(r.a)?'Cash & Savings':'Mutual Funds'):''}"></label>`).join('')}</div><datalist id="sector-list2">${[...new Set(Object.values(S.assets).map(a=>a.sector).filter(Boolean))].sort().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`:''}
    ${H.length?`<h3 class="eyebrow" style="margin:16px 0 8px">Holdings at ${dfmt(rv.to)}</h3><div class="tbl"><table><thead><tr><th>Ticker</th><th>Asset</th><th class="n">Statement</th><th class="n">Ledger</th><th class="n">Value</th><th></th></tr></thead><tbody>${H.map(h=>`<tr><td><span class="sym">${esc(h.ticker)}</span></td><td>${esc(h.name)}</td><td class="n">${num(h.statementQty,h.statementQty%1?3:0)}</td><td class="n">${num(h.ledgerQty,h.ledgerQty%1?3:0)}</td><td class="n">${egp(h.value)}</td><td>${h.ok===null?'<span class="pill man">Fund</span>':h.ok?'<span class="pill win">Match</span>':'<span class="pill loss">Differs</span>'}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${mp?`<h3 class="eyebrow" style="margin:16px 0 8px">Month-end marks</h3><dl class="kv" style="max-width:520px">
      <dt>Cash (statement end balance)</dt><dd>${egp(mp.cash,2)} <span class="note">${md.cash!=null?`now ${egp(md.current.cash,2)}`:'not set'}</span></dd>
      <dt>Securities (${mp.fundsFromLedger?'snapshot stocks + funds at last NAV':'positions snapshot'})</dt><dd>${mp.securities!=null?egp(mp.securities,2):'No snapshot in this email'} <span class="note">${md.securities!=null?`now ${egp(md.current.securities,2)} · diff ${egp(md.securities,2)}`:''}</span></dd></dl>
      ${mp.securities!=null?`<label style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="apply-marks" ${rv.applyMarks?'checked':''}> Set ${M(rv.month)} month-end marks from the statement and mark the month confirmed</label>`:''}`:''}
    <div class="row" style="margin-top:18px;justify-content:space-between"><label style="display:flex;gap:8px"><input type="checkbox" id="post-email" ${S.settings.factsheetEmail&&rv.fullMonth?'checked':''} ${S.settings.factsheetEmail?'':'disabled'}> Email me the ${M(rv.month)} factsheet afterwards</label>
      <div class="row"><button class="btn" id="review-close">Close</button><button class="btn primary" id="post-statement" data-testid="post-statement" ${S.readOnly?'disabled':''}>Post to portfolio</button></div></div>
  </div>`;
}
async function postStatement(){
  const rv=S.stmt.review; if(!rv) return;
  const btn=$('#post-statement'); if(btn){ btn.disabled=true; btn.textContent='Posting…'; }
  const tag = `stmt-${rv.month}`;
  const clean = (r) => { const o={id:newId(), d:r.d, t:r.t, amt:r.amt, acc:r.acc||'Main', src:tag}; if(r.a) o.a=r.a; if(r.q!=null) o.q=r.q; if(r.p!=null) o.p=r.p; if(r.note) o.note=r.note; return o; };
  const add = rv.fresh.filter((r,i)=>rv.pick[i]).map(clean);
  const repl = rv.conflicts.filter((c,i)=>rv.use[i]);
  // ledger: replace chosen conflicts in place, append new rows by year
  const docs = {}; Object.keys(S.ledgerDocs).forEach(y=>{ docs[y]=(S.ledgerDocs[y].rows||[]).slice(); });
  repl.forEach(c=>{ const y=c.ledger.d.slice(0,4); const i=(docs[y]||[]).findIndex(r=>r.id===c.ledger.id); if(i>=0){ const n=clean(c.stmt); n.id=c.ledger.id; docs[y].splice(i,1); const y2=n.d.slice(0,4); (docs[y2] ||= []).push(n); } });
  add.forEach(r=>{ (docs[r.d.slice(0,4)] ||= []).push(r); });
  const touched = new Set(add.map(r=>r.d.slice(0,4)).concat(repl.flatMap(c=>[c.ledger.d.slice(0,4), c.stmt.d.slice(0,4)])));
  let ok = true;
  for(const y of touched){ ok = ok && await save(()=>S.db.doc('ledger/y'+y).set({rows:docs[y]})); if(!ok) break; }
  // new assets
  const na={}; document.querySelectorAll('[data-nsym]').forEach(inp=>{ const n=inp.dataset.nsym; const sec=document.querySelector(`[data-nsec="${CSS.escape(n)}"]`); na[n]={name:n}; if(inp.value.trim()) na[n].symbol=inp.value.trim().toUpperCase(); if(sec&&sec.value.trim()) na[n].sector=sec.value.trim(); if(!na[n].symbol) na[n].fund=true; });
  if(ok && Object.keys(na).length) ok = await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,...na}}));
  const applyMarks = rv.markProposal && rv.markProposal.securities!=null && $('#apply-marks') && $('#apply-marks').checked;
  if(ok && applyMarks){ const cur=S.marks[rv.month]||{}; ok = await save(()=>S.db.doc('portfolio/marks').set({months:{...S.marks,[rv.month]:{...cur, cash:rv.markProposal.cash, securities:rv.markProposal.securities, provisional:false, source:'statement'}}})); }
  if(ok) ok = await save(()=>S.db.doc('imports/'+rv.month).set({month:rv.month, messageId:rv.item.id, subject:rv.item.subject, postedAt:new Date().toISOString(), added:add.length, replaced:repl.length, marks:!!applyMarks, fullMonth:rv.fullMonth}));
  if(ok){ toast(`${M(rv.month)} posted: ${add.length} added, ${repl.length} replaced${applyMarks?', marks updated':''}`); const wantEmail=$('#post-email')&&$('#post-email').checked; const m=rv.month; S.stmt.review=null; renderTab(true); if(wantEmail) setTimeout(()=>emailFactsheet(m), 1500); }
  else if(btn){ btn.disabled=false; btn.textContent='Post to portfolio'; }
}
function statementBanner(){
  const T=S.stmt; if(!T.list) return '';
  const m = T.list.find(x=>x.monthly && !(S.imports||{})[x.month]);
  return m ? `<div class="banner" data-testid="statement-banner"><b>Your ${M(m.month)} Thndr statement is ready to post.</b><span>Review it against the ledger and update the month-end marks.</span><button class="btn sm" data-go="statements">Review</button></div>` : '';
}
async function autoScan(){
  try{ const perm = await window.claude?.use?.('permissions'); if(!perm) return; const st = await perm.state('mcp'); if(st==='granted') scanGmail(true); }catch(e){}
}

// ---------- events (delegated) ----------
document.addEventListener('click', async e=>{
  const go=e.target.closest('[data-go]'); if(go){ setTab(go.dataset.go); return; }
  const del=e.target.closest('[data-del]');
  if(del){ if(del.dataset.arm!=='1'){ del.dataset.arm='1'; del.textContent='Confirm delete'; setTimeout(()=>{ if(del.isConnected){ del.dataset.arm=''; del.textContent='Delete'; } },4000); return; }
    const id=del.dataset.del; for(const y of Object.keys(S.ledgerDocs)){ const rows=S.ledgerDocs[y].rows||[]; if(rows.some(r=>r.id===id)){ await save(()=>S.db.doc('ledger/y'+y).set({rows:rows.filter(r=>r.id!==id)}),'Transaction deleted'); break; } } return; }
  const cf=e.target.closest('[data-confirm]');
  if(cf){ const m=cf.dataset.confirm; const r=S.R.months.find(x=>x.month===m); const patch={provisional:false};
    if(r&&r.live){ patch.cash=r.cash; patch.securities=Math.round(r.securities*100)/100; if(r.benchClose) patch.benchClose=r.benchClose; if(r.usdegp&&S.marks[m]?.usdegp==null) patch.usdegp=r.usdegp; }
    const cur=S.marks[m]||{}; await save(()=>S.db.doc('portfolio/marks').update({months:{[m]:{...cur,...patch}}}),`${M(m)} confirmed`); return; }
  if(e.target.id==='save-marks'){ const patch={}; document.querySelectorAll('#main [data-m].dirty').forEach(inp=>{ const m=inp.dataset.m,f=inp.dataset.f; let v=inp.value.trim(); (patch[m] ||= {...(S.marks[m]||{})});
      if(f==='note'){ if(v) patch[m].note=v; else delete patch[m].note; return; }
      if(v===''){ delete patch[m][f]; return; } let n=parseFloat(v); if(!isFinite(n)){ return; } if(f==='benchReturn'||f==='cpi') n=n/100; patch[m][f]=n; });
    if(!Object.keys(patch).length){ toast('Nothing changed'); return; }
    const all={...S.marks,...patch}; await save(()=>S.db.doc('portfolio/marks').set({months:all}),'Month-end marks saved'); return; }
  if(e.target.id==='save-assets'){ const patch={}; document.querySelectorAll('#main [data-a].dirty').forEach(inp=>{ const a=inp.dataset.a,f=inp.dataset.f; const v=inp.value.trim(); (patch[a] ||= {...(S.assets[a]||{name:a})});
      if(f==='symbol'||f==='sector'||f==='priceDate'){ if(v) patch[a][f]= f==='symbol'?v.toUpperCase():v; else delete patch[a][f]; return; }
      if(v===''){ delete patch[a][f]; return; } const n=parseFloat(v); if(isFinite(n)) patch[a][f]=n; });
    if(!Object.keys(patch).length){ toast('Nothing changed'); return; }
    await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,...patch}}),'Assets saved'); return; }
  if(e.target.id==='csv-preview'){ const msg=$('#csv-msg'); let parsed; try{ parsed=parseCsv($('#csv-in').value).map(normTx); }catch(err){ msg.textContent=err.message; msg.className='note neg'; csvPending=null; return; }
    const have=new Set(allTx().map(txKey)); const fresh=parsed.filter(t=>!have.has(txKey(t))); const dup=parsed.length-fresh.length;
    csvPending=fresh; msg.className='note'; msg.innerHTML=`${fresh.length} new row${fresh.length===1?'':'s'}${dup?`, ${dup} duplicate${dup>1?'s':''} skipped`:''}. ${fresh.length?`<button class="btn sm primary" id="csv-import" data-testid="csv-import">Import ${fresh.length}</button>`:''}`; return; }
  if(e.target.id==='csv-import'&&csvPending){ const n=csvPending.length; if(await addTx(csvPending)){ toast(`${n} transactions imported`); csvPending=null; } return; }
  if(e.target.id==='dl-ledger'){ const rows=[['Date','Type','Asset','Symbol','Shares','Price','Amount','CostBasisSold','Account']].concat(S.R.ledger.map(t=>[t.d,t.t,t.a||'',(S.assets[t.a]||{}).symbol||'',t.q??'',t.p??'',t.amt,t.t==='Sell'?t.basis.toFixed(2):'',t.acc||''])); download('portfolio-ledger.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-holdings'){ const rows=[['Symbol','Asset','Sector','Shares','AvgCost','Price','PriceDate','MarketValue','Unrealized','Dividends','TotalPL','Weight']].concat(S.R.pos.open.map(r=>[r.symbol,r.name,r.sector,r.open,r.avgCost?.toFixed(4),r.price,r.priceDate,r.mv?.toFixed(2),r.unreal?.toFixed(2),r.divs.toFixed(2),r.total.toFixed(2),r.weight.toFixed(6)])); download('portfolio-holdings.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-monthly'){ const st=S.R.stats; const rows=[['Month','Opening','NetFlow','Dividends','MonthEndValue','Return','EGX30Capped','Alpha','CumReturn','CumBench','Drawdown','USDReturn','RealReturn','Status']].concat(st.rows.map(r=>[r.month,r.opening,r.netFlow,r.dividends,r.value,r.ret,r.bench,r.alpha,r.pCum,r.pBench,r.dd,r.usdRet,r.realRet,r.live?'live':r.provisional?'provisional':'confirmed'])); download('portfolio-monthly.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-backup'){ download('portfolio-backup.json', JSON.stringify({exported:new Date().toISOString(), ...dataset(), history:S.history},null,1)); return; }
  if(e.target.id==='refresh-prices'){ refreshNow(e.target); return; }
  if(e.target.id==='scan-gmail'){ scanGmail(false); return; }
  const rvb=e.target.closest('[data-review]'); if(rvb){ const it=S.stmt.list.find(x=>x.month===rvb.dataset.review); if(it) reviewStatement(it); return; }
  if(e.target.id==='review-close'){ S.stmt.review=null; renderTab(true); return; }
  if(e.target.id==='post-statement'){ postStatement(); return; }
  if(e.target.id==='fs-email'){ e.target.disabled=true; await emailFactsheet(S.fsMonth); e.target.disabled=false; return; }
  if(e.target.id==='fs-dl'){ const F=factsheetData(S.fsMonth); download(`factsheet-${S.fsMonth}.html`, `<!doctype html><html><head><meta charset="utf-8"><title>${esc(S.settings.name)} factsheet ${M(S.fsMonth)}</title></head><body style="margin:0;padding:16px;background:#EDF2EF">${factsheetHTML(F)}</body></html>`); return; }
});
document.addEventListener('input', e=>{ if(e.target.matches('.grid-in input')) e.target.classList.add('dirty');
  if(['lf-q'].includes(e.target.id)){ S.ledgerFilter.q=e.target.value; clearTimeout(vLedger._t); vLedger._t=setTimeout(()=>{ const pos=e.target.selectionStart; renderTab(true); const el=$('#lf-q'); if(el){ el.focus(); el.setSelectionRange(pos,pos);} },250); }
  if(e.target.id==='tx-q'||e.target.id==='tx-p'){ const q=parseFloat($('#tx-q').value), p=parseFloat($('#tx-p').value); if(isFinite(q)&&isFinite(p)) $('#tx-hint').textContent=`Gross ${egp(q*p,2)} EGP. Enter the net amount from the statement, which includes commission.`; } });
document.addEventListener('change', e=>{ if(e.target.dataset.pick!=null&&S.stmt.review){ S.stmt.review.pick[+e.target.dataset.pick]=e.target.checked; } if(e.target.dataset.use!=null&&S.stmt.review){ S.stmt.review.use[+e.target.dataset.use]=e.target.checked; } if(e.target.id==='apply-marks'&&S.stmt.review){ S.stmt.review.applyMarks=e.target.checked; } if(e.target.id==='fs-month'){ S.fsMonth=e.target.value; renderTab(true); } if(e.target.id==='lf-type'){ S.ledgerFilter.type=e.target.value; renderTab(true); } if(e.target.id==='lf-year'){ S.ledgerFilter.year=e.target.value; renderTab(true); } });
document.addEventListener('submit', async e=>{
  e.preventDefault();
  if(e.target.id==='tx-form'){ let t; try{ t=normTx({d:$('#tx-d').value,t:$('#tx-t').value,a:$('#tx-a').value,q:$('#tx-q').value,p:$('#tx-p').value,amt:$('#tx-amt').value,acc:$('#tx-acc').value}); }catch(err){ toast(err.message,'error'); return; }
    if(t.a && !S.assets[t.a] && (t.t==='Buy')) toast(`"${t.a}" is a new asset. Add its symbol under Inputs so it gets priced.`);
    if(await addTx([t])){ toast(`${t.t} added`); e.target.reset(); } }
  if(e.target.id==='asset-form'){ const name=$('#na-name').value.trim(); if(!name) return; if(S.assets[name]){ toast('That asset already exists','error'); return; }
    const a={name}; const sym=$('#na-sym').value.trim().toUpperCase(); const sec=$('#na-sec').value.trim(); if(sym) a.symbol=sym; if(sec) a.sector=sec;
    await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,[name]:a}}),`${name} added; it will be priced at the next run`); }
  if(e.target.id==='settings-form'){ const g=id=>$(id).value; const n=id=>parseFloat($(id).value);
    const s={...S.settings, name:g('#st-name').trim()||'Portfolio', inception:g('#st-inc')||S.settings.inception, openingValue:n('#st-open'), cash:n('#st-cash'), cashDate:g('#st-cashd')||null, riskFree:n('#st-rf')/100, fxStart:n('#st-fx'), volLow:n('#st-vl')/100, volHigh:n('#st-vh')/100, openThreshold:n('#st-thr'), staleDays:n('#st-stale'), priceDate:g('#st-pd')||null, factsheetEmail:g('#st-email').trim()||null, benchCloseStart:isFinite(n('#st-bcs'))?n('#st-bcs'):null};
    if(['openingValue','cash','riskFree','fxStart','volLow','volHigh','openThreshold','staleDays'].some(k=>!isFinite(s[k]))){ toast('Every number field needs a value','error'); return; }
    await save(()=>S.db.doc('portfolio/settings').set(s),'Settings saved'); }
});
function toCsv(rows){ return rows.map(r=>r.map(v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(',')).join('\n'); }
async function download(filename, data){ const dl=await window.claude?.use?.('downloads'); if(!dl){ toast('Downloads are not available in this view','error'); return; }
  try{ await dl.save({filename, data}); }catch(e){ if(e&&e.code!=='declined') toast('Download failed: '+(e.message||e.code),'error'); } }
async function refreshNow(btn){ const mcp=await window.claude?.use?.('mcp'); if(!mcp){ toast('Refreshing from the page is not available here. Prices update automatically after each session.','error'); return; }
  btn.disabled=true; btn.textContent='Starting…';
  try{ await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:REFRESH_TRIGGER_ID},{cache:false}); toast('Price refresh started. New prices arrive in about two minutes.'); btn.textContent='Refresh started'; }
  catch(e){ toast('Could not start the refresh: '+(e.message||e.code),'error'); btn.disabled=false; btn.textContent='Refresh now'; } }

// ---------- boot ----------
(async function boot(){
  const db = await (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
  if(!db){ $('#main').innerHTML=`<div class="empty"><h2>Open this page in Claude to see your portfolio</h2><p>Your portfolio data lives in this page's private database, which only loads inside the Claude viewer.</p></div>`; $('#tape').innerHTML='<span class="muted">Market data unavailable in this view</span>'; return; }
  S.db=db;
  const onErr=(e)=>{ console.error(e); toast('Lost connection to the portfolio database. Reload the page.','error'); };
  db.doc('portfolio/settings').onSnapshot(s=>{ S.settings=s.exists?s.data():null; S.ready.settings=true; schedule(); }, onErr);
  db.doc('portfolio/marks').onSnapshot(s=>{ S.marks=(s.exists&&s.data().months)||{}; S.ready.marks=true; schedule(); }, onErr);
  db.doc('portfolio/assets').onSnapshot(s=>{ S.assets=(s.exists&&s.data().items)||{}; S.ready.assets=true; schedule(); }, onErr);
  db.collection('ledger').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id.replace(/^y/,'')]=d.data(); }); S.ledgerDocs=o; S.ready.ledger=true; schedule(); }, onErr);
  db.doc('market/latest').onSnapshot(s=>{ S.market=s.exists?s.data():null; S.ready.market=true; schedule(); }, onErr);
  db.collection('history').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=d.data(); }); S.history=o; schedule(); }, onErr);
  db.doc('bench/egx30').onSnapshot(s=>{ S.bench=s.exists?s.data():null; schedule(); }, onErr);
  db.collection('imports').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=d.data(); }); S.imports=o; schedule(); }, onErr);
  setTimeout(autoScan, 2500);
})();
})();
