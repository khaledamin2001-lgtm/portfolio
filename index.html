// Plain-language summary of the selected period, for readers who don't want to decode the tiles.
function briefPanel(){
  const R=S.R, st=R.stats, rows=st.rows, last=rows[rows.length-1]; const cash=R.liveCash??R.settings.cash; const total=cash+R.pos.mvTotal;
  const c=contributors(); const s=[];
  s.push(`<b>${esc(st.label)}</b>: the portfolio returned <b class="${sgn(st.twr)}">${pct(st.twr)}</b> against <b>${pct(st.benchTwr)}</b> for EGX30 Capped, ${st.alpha>=0?'ahead of the index by':'behind the index by'} <b class="${sgn(st.alpha)}">${pct(Math.abs(st.alpha),1,false)}</b>${st.n>1?`, with ${st.posMonths} of ${st.n} months positive and a worst month of ${pct(st.worst.ret)} (${M(st.worst.month)})`:''}.`);
  s.push(`${M(last.month)}${last.live?' so far':''}: <b class="${sgn(last.ret)}">${pct(last.ret)}</b> vs ${pct(last.bench)} for the index.`);
  s.push(`Today the portfolio is worth <b>${egp(total)} EGP</b>, of which ${egp(cash)} EGP is cash, across ${R.pos.open.length} positions; the largest is ${esc(R.conc.largest)} at ${pct(R.conc.largestWeight,1,false)}.`);
  if(c.length) s.push(`Since inception the biggest contributors are ${c.slice(0,3).map(x=>`${esc(x.sym)} +${egp(x.total)}`).join(', ')}${c.some(x=>x.total<0)?`; the biggest detractor is ${esc(c[c.length-1].sym)} −${egp(Math.abs(c[c.length-1].total))}`:''} (EGP, realized + unrealized + dividends).`);
  if(st.xirr!=null) s.push(`Money-weighted, your own capital has compounded at ${pct(st.xirr)} a year${st.realTwr!=null||st.realTwrPartial!=null?`, or ${pct(st.realTwr??st.realTwrPartial)} after Egyptian inflation`:''}.`);
  return `<div class="panel brief" data-testid="brief"><div class="eyebrow">In brief</div><p>${s.join(' ')} <a href="#analysis" data-go="analysis">Read the full review on the Analysis tab →</a></p></div>`;
}
function contributors(){ return S.R.pos.rows.filter(r=>r.bought>0).map(r=>({sym:r.symbol||r.name,name:r.name,total:r.total,status:r.status,realized:r.realized,unreal:r.unreal||0,divs:r.divs})).sort((a,b)=>b.total-a.total); }
function contributorsList(){ const c=contributors(); if(!c.length) return '<p class="note" style="margin-top:8px">No trades yet.</p>';
  const top=c.slice(0,4), bot=c.filter(x=>x.total<0).slice(-3).reverse();
  const li=(r)=>`<dt><span class="sym">${esc(r.sym)}</span> <span class="muted">${r.status==='Open'?'held':'closed'}</span></dt><dd class="${sgn(r.total)}">${egp(r.total)}</dd>`;
  return `<dl class="kv"><dt class="sec">Top contributors</dt><dd class="sec"></dd>${top.map(li).join('')}<dt class="sec">Detractors</dt><dd class="sec"></dd>${bot.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}</dl><p class="note" style="margin:8px 0 0">Realized + unrealized + dividends per stock, EGP.</p>`; }
function moversList(){ const rows=S.R.pos.open.filter(r=>r.chg!=null&&r.mv&&r.priceSource==='auto').map(r=>({sym:r.symbol||r.name,name:r.name,chg:r.chg/100,pl:r.mv-r.mv/(1+r.chg/100)})).sort((a,b)=>b.pl-a.pl);
  if(!rows.length) return '<p class="note" style="margin-top:8px">No session change data yet.</p>';
  const up=rows.filter(r=>r.pl>0).slice(0,3), dn=rows.filter(r=>r.pl<0).slice(-3).reverse(); const dp=dayPL();
  const li=(r)=>`<dt><span class="sym">${esc(r.sym)}</span></dt><dd class="${sgn(r.pl)}">${pct(r.chg,2)} <span class="muted">${egp(r.pl)}</span></dd>`;
  return `<dl class="kv"><dt class="sec">Gainers</dt><dd class="sec"></dd>${up.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}<dt class="sec">Decliners</dt><dd class="sec"></dd>${dn.map(li).join('')||'<dt class="muted">None</dt><dd></dd>'}<dt class="total">Session P/L</dt><dd class="total ${sgn(dp.pl)}">${egp(dp.pl)}</dd></dl>`; }
function rollForward(st){ return `<dl class="kv">
  <dt>Opening value · ${M(PE.addMonths(st.rows[0].month,-1))}</dt><dd>${egp(st.opening)}</dd>
  <dt>Plus: deposits</dt><dd>${egp(st.deposits)}</dd><dt>Less: withdrawals</dt><dd>${egp(-st.withdrawals)}</dd>
  <dt>Plus: investment gain</dt><dd class="${sgn(st.netGain)}">${egp(st.netGain)}</dd>
  <dt class="total">Closing value · ${M(st.rows[st.rows.length-1].month)}</dt><dd class="total">${egp(st.closing)}</dd></dl>
  <p class="note" style="margin:8px 0 0">EGP. Investment gain includes dividends of ${egp(st.dividends)}.</p>`; }
function sectorBars(){ const secs=S.R.sectors; if(!secs.length) return '<p class="muted">No open positions.</p>'; const max=secs[0].weight;
  return `<div style="display:grid;gap:10px">${secs.map(s=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center"><span>${esc(s.sector)}</span><span class="num"><b>${pct(s.weight,1,false)}</b> <span class="muted">${short(s.mv)}</span></span><div class="bar" style="grid-column:1/-1;height:8px"><i style="width:${(s.weight/max*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`; }

// ---------- Holdings ----------
function vHoldings(){
  const R=S.R, c=R.conc; const cashNow=R.liveCash ?? R.settings.cash; const total=cashNow+R.pos.mvTotal; const unreal=R.pos.open.reduce((s,r)=>s+(r.unreal||0),0); const cost=R.pos.open.reduce((s,r)=>s+r.openCost,0); const dp=dayPL();
  const rows=R.pos.open.slice().sort((a,b)=>(b.mv||0)-(a.mv||0));
  const today=R.today;
  return `
  <div class="kpis">
    ${kpi('Holdings value', egp(R.pos.mvTotal), `${R.pos.open.length} positions`, '', 'EGP')}
    ${kpi('Cash', egp(cashNow), R.settings.cashDate ? `broker ${egp(R.settings.cash)} on ${dfmt(R.settings.cashDate)}${Math.abs(cashNow-R.settings.cash)>=0.5?', plus ledger activity since':''}` : 'broker balance', '', 'EGP')}
    ${kpi('Total value', egp(total), `<span class="${sgn(dp.pl)}">${dp.pct!=null?pct(dp.pct,2)+' last session':''}</span>`, 'hero', 'EGP')}
    ${kpi('Unrealized P/L', `<span class="${sgn(unreal)}">${egp(unreal)}</span>`, `${pct(cost?unreal/cost:null)} on cost of ${short(cost)}`)}
    ${kpi('Largest position', esc(c.largest), `${pct(c.largestWeight,1,false)} · top 3 ${pct(c.top3,1,false)}`)}
    ${kpi('Effective positions', num(c.hhi?1/c.hhi:0,1), `1 ÷ HHI · ${c.sectorCount} sectors`)}
  </div>
  <div class="panel">
    <div class="phead"><div><h2>Open positions</h2><div class="sub">Average-cost basis · prices refresh automatically after each EGX session</div></div><button class="btn sm" id="dl-holdings" data-testid="download-holdings">Download CSV</button></div>
    <div class="tbl"><table data-testid="holdings-table"><thead><tr><th>Position</th><th>Sector</th><th class="n">Shares</th><th class="n">Avg cost</th><th class="n">Price</th><th class="n">Day %</th><th class="n">Day P/L</th><th>Source</th><th class="n">Market value</th><th class="n">Unrealized P/L</th><th class="n">Return</th><th class="n">Dividends</th><th class="n">Total P/L</th><th class="n">Weight</th><th class="n">Target</th><th class="n">Stop</th><th class="n">Held</th></tr></thead><tbody>
    ${rows.map(r=>{ const age=r.priceDate?PE.dayNum(today)-PE.dayNum(r.priceDate):null; const stale=age==null||age>R.settings.staleDays;
      const src = r.price==null?'<span class="pill stale">No price</span>': stale?`<span class="pill stale" title="Price date ${esc(r.priceDate||'')}">${age}d old</span>`: r.priceSource==='auto'?'<span class="pill auto">Auto</span>': r.priceSource==='model'?'<span class="pill man" title="No market quote: last traded NAV, or the last trade moved with its proxy price">Last NAV</span>':'<span class="pill man">Manual</span>';
      const toT = r.target&&r.price? r.target/r.price-1 : null, toS = r.stop&&r.price? r.stop/r.price-1:null;
      return `<tr><td><span class="sym">${esc(r.symbol||'—')}</span><div class="muted" style="font-size:11.5px;line-height:1.3;max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.name)}">${esc(r.name)}</div></td><td class="ink2">${esc(r.sector)}</td><td class="n">${num(r.open,r.open%1?2:0)}</td><td class="n">${num(r.avgCost,3)}</td><td class="n">${num(r.price,2)}</td><td class="n ${sgn(r.chg)}">${r.chg!=null?pct(r.chg/100,2):'—'}</td><td class="n ${sgn(r.chg)}">${r.chg!=null&&r.mv?egp(r.mv-r.mv/(1+r.chg/100)):'—'}</td><td>${src}</td><td class="n">${egp(r.mv)}</td><td class="n ${sgn(r.unreal)}">${egp(r.unreal)}</td><td class="n ${sgn(r.unreal)}">${pct(r.openCost?r.unreal/r.openCost:null)}</td><td class="n">${egp(r.divs)}</td><td class="n ${sgn(r.total)}">${egp(r.total)}</td><td class="n">${pct(r.weight,1,false)}</td><td class="n">${r.target?num(r.target)+` <span class="muted">${pct(toT,0)}</span>`:'—'}</td><td class="n">${r.stop?num(r.stop)+` <span class="muted">${pct(toS,0)}</span>`:'—'}</td><td class="n">${r.holdDays}d</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td colspan="8">Total holdings</td><td class="n">${egp(R.pos.mvTotal)}</td><td class="n ${sgn(unreal)}">${egp(unreal)}</td><td class="n ${sgn(unreal)}">${pct(cost?unreal/cost:null)}</td><td class="n">${egp(R.pos.open.reduce((s,r)=>s+r.divs,0))}</td><td class="n">${egp(R.pos.open.reduce((s,r)=>s+r.total,0))}</td><td class="n">100.0%</td><td colspan="3"></td></tr></tfoot></table></div>
    <p class="note" style="margin:10px 0 0">Total P/L = realized on shares already sold + unrealized + dividends, since first buy. Stocks at the latest EGX close; funds without a quote at their last traded NAV (gold funds move with the 24K gold price). Set targets and stops under Inputs → Assets & prices.</p>
  </div>
  <div class="grid g2">
    <div class="panel"><div class="phead"><div><h2>Sector allocation</h2><div class="sub">Share of holdings value</div></div></div>${sectorBars()}</div>
    <div class="panel"><div class="phead"><div><h2>Concentration & downside</h2><div class="sub">Current holdings, not affected by the period selector</div></div></div><dl class="kv">
      <dt>Open positions</dt><dd>${c.openCount}</dd><dt>Sectors</dt><dd>${c.sectorCount}</dd>
      <dt>Largest position (${esc(c.largest)})</dt><dd>${pct(c.largestWeight,1,false)}</dd><dt>Top-3 positions</dt><dd>${pct(c.top3,1,false)}</dd>
      <dt>Largest sector${c.largestSector?' ('+esc(c.largestSector.sector)+')':''}</dt><dd>${c.largestSector?pct(c.largestSector.weight,1,false):'—'}</dd>
      <dt>Herfindahl index (HHI)</dt><dd>${num(c.hhi,3)}</dd>
      <dt>Positions with a stop loss</dt><dd>${c.withStop} of ${c.openCount}</dd><dt>Loss if every stop is hit</dt><dd class="${c.lossIfStops?'neg':''}">${c.lossIfStops?egp(-c.lossIfStops):'—'}</dd></dl>
      ${c.withStop<c.openCount?`<p class="note" style="margin:10px 0 0">${c.openCount-c.withStop} positions have no stop loss. Add them under Inputs to measure downside.</p>`:''}</div>
  </div>`;
}

// ---------- Performance ----------
function vPerformance(){
  const R=S.R, st=R.stats; if(!st.n) return `<div class="panel empty"><h2>No data for this selection</h2></div>`;
  const rows=st.rows, labels=rows.map(r=>M(r.month));
  return `
  ${trailingStrip()}
  <div class="grid g3">
    <div class="panel"><div class="eyebrow">Returns</div><dl class="kv">
      <dt>Portfolio TWR</dt><dd class="${sgn(st.twr)}">${pct(st.twr)}</dd><dt>EGX30 Capped TWR</dt><dd class="${sgn(st.benchTwr)}">${pct(st.benchTwr)}</dd>
      <dt>Alpha vs benchmark</dt><dd class="${sgn(st.alpha)}">${pct(st.alpha)}</dd><dt>Annualized TWR</dt><dd>${st.annualized!=null?pct(st.annualized):'n/a (<12 mo)'}</dd>
      <dt>Average monthly return</dt><dd>${pct(st.avg,2)}</dd><dt>Money-weighted (XIRR, annual)</dt><dd>${pct(st.xirr)}</dd><dt>Money-weighted (period)</dt><dd>${pct(st.mwrPeriod)}</dd>
      <dt>Return in USD</dt><dd>${st.usdTwr!=null?pct(st.usdTwr):'—'}</dd><dt>EGP change vs USD</dt><dd>${st.egpVsUsd!=null?pct(st.egpVsUsd):'—'}</dd>
      <dt>Real return (after CPI)${st.realTwr==null&&st.realThrough?` · through ${M(st.realThrough)}`:''}</dt><dd>${st.realTwr!=null?pct(st.realTwr):st.realTwrPartial!=null?pct(st.realTwrPartial):'—'}</dd><dt>Egypt inflation in period</dt><dd>${st.inflation!=null?pct(st.inflation,1,false):st.inflationPartial!=null?pct(st.inflationPartial,1,false):'—'}</dd></dl></div>
    <div class="panel"><div class="eyebrow">Capital · EGP</div>${rollForward(st)}<dl class="kv" style="margin-top:6px">
      <dt class="sec">Activity</dt><dd class="sec"></dd>
      <dt>Realized trading P/L</dt><dd class="${sgn(st.realized)}">${egp(st.realized)}</dd><dt>Dividends received</dt><dd>${egp(st.dividends)}</dd>
      <dt>Total bought</dt><dd>${egp(st.buys)}</dd><dt>Total sold</dt><dd>${egp(st.sells)}</dd><dt>Trades</dt><dd>${st.trades}</dd>
      <dt>Turnover (sells ÷ avg value)</dt><dd>${num(st.sells/Math.max(1,(st.opening+st.closing)/2),1)}×</dd></dl></div>
    <div class="panel"><div class="eyebrow">Risk & consistency</div><dl class="kv">
      <dt>Monthly volatility</dt><dd>${pct(st.vol,1,false)} <span class="pill ${st.risk==='High'?'loss':st.risk==='Low'?'win':'stale'}">${st.risk}</span></dd>
      <dt>Annualized volatility</dt><dd>${pct(st.vol*Math.sqrt(12),1,false)}</dd>
      <dt>Sharpe ratio (annual)</dt><dd>${st.sharpe!=null?num(st.sharpe):'n/a'}</dd>
      <dt>Risk-free (3M T-bill)</dt><dd>${pct(R.settings.riskFree,2,false)}</dd>
      <dt>Beta vs EGX30 Capped</dt><dd>${st.beta!=null?num(st.beta):'n/a'}</dd><dt>Correlation</dt><dd>${st.correl!=null?num(st.correl):'n/a'}</dd>
      <dt>Tracking error (annual)</dt><dd>${st.trackingError!=null?pct(st.trackingError,1,false):'n/a'}</dd>
      <dt>Information ratio</dt><dd>${st.trackingError&&st.n>=3?num((st.avg-rets(st,'bench'))*12/st.trackingError):'n/a'}</dd>
      <dt>Sortino ratio (annual)</dt><dd>${st.sortino!=null?num(st.sortino):'n/a'}</dd><dt>Calmar ratio</dt><dd>${st.calmar!=null?num(st.calmar):'n/a (<12 mo)'}</dd>
      <dt>Upside capture</dt><dd>${st.upCapture!=null?pct(st.upCapture,0,false)+` <span class="muted">${st.upMonths} up months</span>`:'n/a'}</dd><dt>Downside capture</dt><dd>${st.downCapture!=null?pct(st.downCapture,0,false)+` <span class="muted">${st.downMonths} down months</span>`:'n/a'}</dd>
      <dt>Max drawdown</dt><dd class="neg">${pct(st.maxDD)}${st.maxDDMonth?' · '+M(st.maxDDMonth):''}</dd>
      <dt>Positive months</dt><dd>${st.posMonths} of ${st.n}</dd><dt>Months beating benchmark</dt><dd>${st.beat} of ${st.n}</dd></dl></div>
  </div>
  ${dailySection()}
  <div class="grid g2">
    <div class="panel"><div class="phead"><div><h2>Monthly return vs EGX30 Capped</h2><div class="sub">Each month's time-weighted return</div></div>
      <div class="legend"><span><i class="sq" style="background:var(--s1)"></i>Portfolio</span><span><i class="sq" style="background:var(--s2)"></i>EGX30 Capped</span></div></div>
      ${chartSlot('ch-monthly',{kind:'bar',title:'Monthly returns',labels,series:[{name:'Portfolio',color:C.s1(),values:rows.map(r=>r.ret)},{name:'EGX30 Capped',color:C.s2(),values:rows.map(r=>r.bench)}],yFmt:pctAxis},250)}</div>
    <div class="panel"><div class="phead"><div><h2>Monthly alpha</h2><div class="sub">Portfolio minus benchmark · above zero = beat the index</div></div>
      <div class="legend"><span><i class="sq" style="background:var(--pos)"></i>Beat</span><span><i class="sq" style="background:var(--neg)"></i>Lagged</span></div></div>
      ${chartSlot('ch-alpha',{kind:'bar',title:'Monthly alpha',labels,series:[{name:'Alpha',colorFn:v=>v>=0?C.pos():C.neg(),values:rows.map(r=>r.alpha)}],yFmt:pctAxis},250)}</div>
  </div>
  <div class="panel"><div class="phead"><div><h2>Drawdown from peak</h2><div class="sub">Decline in cumulative return from its running high within the period</div></div></div>
    ${chartSlot('ch-dd',{kind:'line',title:'Drawdown',labels,series:[{name:'Drawdown',color:C.neg(),values:rows.map(r=>r.dd),area:true}],yFmt:pctAxis},200)}</div>
  <div class="panel"><div class="phead"><div><h2>Monthly breakdown</h2><div class="sub">Modified Dietz: (month-end value − opening − net flow) ÷ (opening + day-weighted net flow)</div></div><button class="btn sm" id="dl-monthly" data-testid="download-monthly">Download CSV</button></div>
    <div class="tbl"><table data-testid="monthly-table"><thead><tr><th>Month</th><th class="n">Opening</th><th class="n">Net flow</th><th class="n">Dividends</th><th class="n">Month-end value</th><th class="n">Return</th><th class="n">EGX30 Capped</th><th class="n">Alpha</th><th class="n">Cum. return</th><th class="n">Cum. EGX30</th><th class="n">Drawdown</th><th class="n">USD return</th><th class="n">Real return</th><th class="n">Trades</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${M(r.month)} ${r.live?'<span class="pill prov">Live</span>':r.estimate?'<span class="pill stale" title="Estimated from closing prices; replaced when the Thndr statement is posted">Estimate</span>':r.provisional?'<span class="pill prov">Provisional</span>':''}</td><td class="n">${egp(r.opening)}</td><td class="n">${egp(r.netFlow)}</td><td class="n">${egp(r.dividends)}</td><td class="n">${egp(r.value)}</td><td class="n ${sgn(r.ret)}">${pct(r.ret)}</td><td class="n ${sgn(r.bench)}">${pct(r.bench)}</td><td class="n ${sgn(r.alpha)}">${pct(r.alpha)}</td><td class="n">${pct(r.pCum)}</td><td class="n">${pct(r.pBench)}</td><td class="n">${pct(r.dd)}</td><td class="n">${pct(r.usdRet)}</td><td class="n">${pct(r.realRet)}</td><td class="n">${r.trades}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function trailingStrip(){ const R=S.R; const tr=PA.trailing(R.months, R.range.to); if(!tr||!tr.some(t=>t.p!=null)) return '';
  return `<div class="panel" data-testid="trailing-returns"><div class="phead"><div><h2>Trailing returns to ${M(R.range.to)}</h2><div class="sub">Time-weighted, chain-linked monthly · periods under one year are not annualized</div></div></div>
    <div class="tbl"><table><thead><tr><th></th>${tr.map(t=>`<th class="n">${esc(t.label)}</th>`).join('')}</tr></thead><tbody>
    <tr><td><b>Portfolio</b></td>${tr.map(t=>`<td class="n ${sgn(t.p)}">${t.p!=null?pct(t.p):'—'}</td>`).join('')}</tr>
    <tr><td>EGX30 Capped</td>${tr.map(t=>`<td class="n">${t.b!=null?pct(t.b):'—'}</td>`).join('')}</tr>
    <tr><td>Difference</td>${tr.map(t=>`<td class="n ${sgn(t.a)}">${t.a!=null?pct(t.a):'—'}</td>`).join('')}</tr>
    ${tr.some(t=>t.ann)?`<tr><td class="muted">Annualized</td>${tr.map(t=>`<td class="n muted">${t.ann?pct(t.ann.p):''}</td>`).join('')}</tr>`:''}</tbody></table></div></div>`; }
function rets(st,k){ const v=st.rows.map(r=>r[k]).filter(x=>x!=null); return v.reduce((a,b)=>a+b,0)/Math.max(1,v.length); }

// ---------- Closed trades ----------
function vTrades(){
  const R=S.R, st=R.stats; const rows=(st.closed||[]).slice().sort((a,b)=>b.lastSell.localeCompare(a.lastSell));
  const allClosed=R.pos.rows.filter(r=>r.status==='Closed');
  return `
  <div class="kpis">
    ${kpi('Trades closed', st.closedCount||0, `in ${esc(st.label)}`)}
    ${kpi('Win rate', pct(st.winRate,1,false), `${st.wins||0} wins · ${st.losses||0} losses`)}
    ${kpi('Total P/L on closed', `<span class="${sgn(st.closedPL)}">${egp(st.closedPL)}</span>`, 'incl. dividends', '', 'EGP')}
    ${kpi('Profit factor', st.profitFactor!=null?num(st.profitFactor,1)+'×':'n/a', 'gross wins ÷ gross losses')}
    ${kpi('Average win / loss', `<span class="pos">${short(st.avgWin)}</span> <span class="muted">/</span> <span class="neg">${short(st.avgLoss)}</span>`, `payoff ${st.avgLoss?num(Math.abs(st.avgWin/st.avgLoss),1)+'×':'n/a'}`)}
    ${kpi('Average hold', num(st.avgHold,0), `best ${short(st.bestTrade)} · worst ${short(st.worstTrade)}`, '', 'days')}
  </div>

async function addTx(rows){

function normTx(o){
  const t = PE.TYPES.find(x=>x.toLowerCase()===String(o.t||'').trim().toLowerCase()); if(!t) throw new Error(`Unknown type "${o.t}"`);
  const d = parseDate(o.d); if(!d) throw new Error(`Unreadable date "${o.d}"`);
  // Bonus shares are free: the amount is always 0 (an empty amount is accepted), only the asset and the share count matter.
  const amt = t==='Bonus' ? 0 : Math.abs(parseFloat(String(o.amt).replace(/[, ]/g,''))); if(!isFinite(amt)) throw new Error(`Unreadable amount "${o.amt}"`);
  const r={id:newId(), d, t, amt: SIGN[t]*amt || 0};
  const a=String(o.a||'').trim(); if(a) r.a=a;
  const q=parseFloat(String(o.q??'').replace(/[, ]/g,'')); if(isFinite(q)&&q>0) r.q=q;
  const p=parseFloat(String(o.p??'').replace(/[, ]/g,'')); if(isFinite(p)&&p>0) r.p=p;
  if((t==='Buy'||t==='Sell'||t==='Bonus')&&(!r.a||!r.q)) throw new Error(`${t} on ${d} needs an asset and shares`);
  r.acc = String(o.acc||'Main').trim()||'Main';
  return r;
}
function parseDate(s){ s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null; }
function parseCsv(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const split=(l)=>{ const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; } else if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); };
  let start=0; const h=split(lines[0]).map(s=>s.toLowerCase()); let idx={d:0,t:1,a:2,q:3,p:4,amt:5,acc:6};
  if(h.includes('date')){ start=1; const f=(...n)=>h.findIndex(x=>n.some(k=>x.startsWith(k))); idx={d:f('date'),t:f('type'),a:f('asset','name','security'),q:f('shares','quantity','qty'),p:f('price'),amt:f('amount','net'),acc:f('account')}; }
  return lines.slice(start).map(l=>{ const c=split(l); const g=k=>idx[k]>=0?c[idx[k]]:''; return {d:g('d'),t:g('t'),a:g('a'),q:g('q'),p:g('p'),amt:g('amt'),acc:g('acc')}; }); }

  out.push({label:'Month-ends sourced from Thndr statements', status: typed.length?'warn':'ok', detail: `${stm.length} from statements` + (rec.length?` · ${rec.map(r=>M(r.month)).join(', ')} rebuilt from the next statement`:'') + (est.length?` · ${est.length} closing-price estimates (${est.map(r=>M(r.month)).join(', ')}; no holdings list on those statements)`:'') + (typed.length?` · typed by hand: ${typed.map(r=>M(r.month)).join(', ')}`:'')});

      <dt>EGX30 Capped close</dt><dd>${m&&m.index&&m.index.EGX30CAPPED?num(m.index.EGX30CAPPED.close,1)+' · prior month-end '+num(m.index.EGX30CAPPED.prevMonthClose,1):'—'}</dd>
      <dt>Daily closes stored</dt><dd>${hist.length?`${Object.values(S.history).reduce((s,h)=>s+Object.keys(h.days||{}).length,0)} days since ${esc(hist[0])}`:'None yet'}</dd></dl>
      <p class="note" style="margin:10px 0 0">Each run also records the prior month-end EGX30 Capped close, and fills any completed month still missing Egypt CPI (CAPMAS urban CPI index) or USD/EGP (market month-end close; the CBE site blocks automated access). Values already entered are never overwritten.</p></div>
  </div>
  <div class="panel"><div class="phead"><div><h2>Methodology</h2><div class="sub">How every figure on this page is calculated</div></div></div><div class="prose">
    <h3>Time-weighted return (TWR)</h3><p>Monthly return is Modified Dietz: <code>(closing value − opening value − net deposits) ÷ (opening value + day-weighted net deposits)</code>. A deposit on the 1st counts fully for the month, one on the 16th about half. Months are then chain-linked (time-weighted): <code>TWR = Π(1 + r) − 1</code>. TWR removes the effect of your deposit timing and is the right figure to compare against the index.</p>
    <h3>Money-weighted return (XIRR)</h3><p>The internal rate of return of your actual cash flows: the opening value on the day before the period, every deposit and withdrawal on its date, and the closing value at period end. It rewards or penalises the timing of your deposits. Actual/365 day count, same as Excel's XIRR.</p>
    <h3>Benchmark</h3><p>EGX30 Capped, the index most comparable to a retail EGX portfolio because no single stock can dominate it. A month's return comes from consecutive month-end closes when both exist, otherwise from the typed %. Alpha is the simple difference of returns.</p>
    <h3>Cost basis and P/L</h3><p>Weighted-average cost, in ledger order. A sale's cost basis is <code>average cost × shares sold</code>; realized P/L is proceeds minus that basis. Amounts are net of Thndr commissions, as on the statement. Dividends are credited to the stock that paid them.</p>
    <h3>Risk</h3><p>Volatility is the sample standard deviation of monthly returns. Sharpe uses the monthly equivalent of the 3-month T-bill yield and is annualized by √12. Beta is the slope of portfolio on benchmark monthly returns; tracking error is the annualized standard deviation of monthly alpha; information ratio is annualized mean alpha over tracking error. Sortino replaces volatility with downside deviation (returns below the risk-free rate); Calmar is annualized TWR ÷ max drawdown. Upside/downside capture compare the portfolio's compounded return with the index's in the months the index rose or fell. Drawdown is measured on the cumulative return within the selected period. HHI is the sum of squared position weights; 1 ÷ HHI gives the effective number of equal-sized positions.</p>
    <h3>USD and real returns</h3><p>USD return converts each month at consecutive month-end USD/EGP rates: the CBE mid rate where you entered it, otherwise the market close filled automatically. Real return deflates by Egypt urban CPI (CAPMAS), month on month, filled automatically once published around the 10th.</p>
    <h3>Current month</h3><p>Until the monthly statement arrives, the current month uses live prices and cash = the latest statement's closing balance plus every ledger movement booked after it (trades from Thndr invoices, for example). It is labelled Live. Once a month closes and its statement has not been posted yet, the month-end is estimated from the ledger (cash) and the last closing prices of the month (holdings, funds at their last traded NAV), labelled Estimate and flagged in the checks; the statement figures replace the estimate when it is posted. Nothing is saved to the marks until then.</p>
    <h3>Conventions</h3><p>All money in EGP. Negative money values are shown in parentheses; returns carry a sign. Inputs you type appear in blue, following the spreadsheet colour convention for hard-coded values.</p>
  </div></div>`;
}

      <p>Monthly effects are linked with the Carino method so they sum to the period's active return.</p></div></div>

function factsheetData(m){
  const R = PE.run(dataset(true), {type:'Since Inception', asOf:m}, {today:S.R.today, fallback:S.fallback});
  const live = R.live && R.live.month === m;
  const pb = pbook();
  const tr = PA.trailing(R.months, m), cal = PA.calendar(R.months, m);
  const H = live ? { rows: R.pos.open.map(r=>({name:r.name,symbol:r.symbol,sector:r.sector,mv:r.mv})), mv:R.pos.mvTotal, cash:R.liveCash ?? S.settings.cash } : PA.holdingsAt(R.ledger, S.assets, pb, PE.eom(m));
  const cash = live ? (R.liveCash ?? S.settings.cash) : (S.marks[m] && S.marks[m].cash != null ? S.marks[m].cash : H.cash);
  const tot = H.mv + Math.max(0,cash);
  const top = H.rows.filter(r=>r.mv).sort((a,b)=>b.mv-a.mv).slice(0,10).map(r=>({...r, w:r.mv/tot}));
  const secW = {}; H.rows.forEach(r=>{ if(r.mv) secW[r.sector]=(secW[r.sector]||0)+r.mv/tot; }); if(cash>0) secW['Cash & Savings']=(secW['Cash & Savings']||0)+cash/tot;
  const bd = pb.lastDayOnOrBefore(live ? S.R.today : PE.eom(m)); const bw = bd ? PA.benchWeights(S.bench, pb, bd) || [] : [];
  const secB = {}; bw.forEach(x=>{ secB[x.sector]=(secB[x.sector]||0)+x.w; });
  const sectors = [...new Set([...Object.keys(secW),...Object.keys(secB)])].map(s=>({s, p:secW[s]||0, b:secB[s]||0})).sort((a,b)=>b.p-a.p);
  const A1 = PA.attribution(R.months, {from:m,to:m}, R.ledger, S.assets, pb, S.bench, S.R.today);
  const y = m.slice(0,4);
  const Ay = PA.attribution(R.months, {from:(y+'-01')>S.settings.inception?y+'-01':S.settings.inception,to:m}, R.ledger, S.assets, pb, S.bench, S.R.today);
  const inc = (from,to)=>{ const s={div:0,reb:0,fee:0}; R.ledger.forEach(t=>{ if(t.d>=from&&t.d<=to){ if(t.t==='Dividend')s.div+=t.amt; if(t.t==='Rebate')s.reb+=t.amt; if(t.t==='Fee')s.fee+=t.amt; } }); return s; };
  const row = R.months.find(r=>r.month===m);
  return { m, R, st:R.stats, row, live, tr, cal, top, sectors, A1, Ay, value: row?row.value:tot, incM: inc(m+'-01',PE.eom(m)), incY: inc(y+'-01',PE.eom(m)) };
}

async function reviewStatement(item){

    const att = TS.attachments(p.raw); if(!att.length) throw new Error('no PDF attachments found');
    const docs=[]; for(const a of att) docs.push({filename:a.filename, lines: await TS.pdfLines(pdfjs, a.bytes)});
    const own = TS.ownerCheck(docs, S.settings); if(own.error) throw new Error(`refused — this statement ${own.error}. Only this portfolio's own Thndr documents are ever imported.`);

    const rc = TS.reconcile(st, allTx(), S.assets, S.marks);

async function postStatement(){
  const rv=S.stmt.review; if(!rv) return;
  const btn=$('#post-statement'); if(btn){ btn.disabled=true; btn.textContent='Posting…'; }
  const tag = `stmt-${rv.month}`;
  const clean = (r) => { const o={id:newId(), d:r.d, t:r.t, amt:r.amt, acc:r.acc||'Main', src:tag}; if(r.a) o.a=r.a; if(r.q!=null) o.q=r.q; if(r.p!=null) o.p=r.p; if(r.note) o.note=r.note; return o; };
  const add = rv.fresh.filter((r,i)=>rv.pick[i]).map(clean);
  const repl = rv.conflicts.filter((c,i)=>rv.use[i]);
  // ledger: replace chosen conflicts in place, append new rows by year
  const docs = {}; Object.keys(S.ledgerDocs).forEach(y=>{ docs[y]=(S.ledgerDocs[y].rows||[]).slice(); });
  repl.forEach(c=>{ const y=c.ledger.d.slice(0,4); const i=(docs[y]||[]).findIndex(r=>r.id===c.ledger.id); if(i>=0){ const n=clean(c.stmt); n.id=c.ledger.id; docs[y].splice(i,1); const y2=n.d.slice(0,4); (docs[y2] ||= []).push(n); } });
  add.forEach(r=>{ (docs[r.d.slice(0,4)] ||= []).push(r); });
  const touched = new Set(add.map(r=>r.d.slice(0,4)).concat(repl.flatMap(c=>[c.ledger.d.slice(0,4), c.stmt.d.slice(0,4)])));
  let ok = true;
  for(const y of touched){ ok = ok && await save(()=>S.db.doc('ledger/y'+y).set({rows:docs[y]})); if(!ok) break; }
  // new assets
  const na={}; document.querySelectorAll('[data-nsym]').forEach(inp=>{ const n=inp.dataset.nsym; const sec=document.querySelector(`[data-nsec="${CSS.escape(n)}"]`); na[n]={name:n}; if(inp.value.trim()) na[n].symbol=inp.value.trim().toUpperCase(); if(sec&&sec.value.trim()) na[n].sector=sec.value.trim(); if(!na[n].symbol) na[n].fund=true; });
  if(ok && Object.keys(na).length) ok = await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,...na}}));
  const applyMarks = rv.markProposal && rv.markProposal.securities!=null && $('#apply-marks') && $('#apply-marks').checked;
  if(ok && applyMarks){ const cur=S.marks[rv.month]||{}; ok = await save(()=>S.db.doc('portfolio/marks').set({months:{...S.marks,[rv.month]:{...cur, cash:rv.markProposal.cash, securities:rv.markProposal.securities, provisional:false, source:'statement'}}})); }
  if(ok && rv.accountCode && S.settings.account && !S.settings.account.unifiedCode) ok = await save(()=>S.db.doc('portfolio/settings').set({...S.settings, account:{...S.settings.account, unifiedCode:rv.accountCode}}), `Thndr account ${rv.accountCode} recorded for this portfolio`);
  if(ok) ok = await save(()=>S.db.doc('imports/'+rv.month).set({month:rv.month, messageId:rv.item.id, subject:rv.item.subject, postedAt:new Date().toISOString(), added:add.length, replaced:repl.length, marks:!!applyMarks, fullMonth:rv.fullMonth}));
  if(ok){ toast(`${M(rv.month)} posted: ${add.length} added, ${repl.length} replaced${applyMarks?', marks updated':''}`); const wantEmail=$('#post-email')&&$('#post-email').checked; const m=rv.month; S.stmt.review=null; renderTab(true); if(wantEmail) setTimeout(()=>emailFactsheet(m), 1500); }
  else if(btn){ btn.disabled=false; btn.textContent='Post to portfolio'; }
}

// ---------- Risk explained: the down-month analysis, done for you (no rules, just what happened and why) ----------
function betaOf(pb, sym){
  const from = PE.addMonths(PE.cairoToday().slice(0,7), -12) + '-01'; const days = pb.days.filter(d=>d>=from);
  const xs=[], ys=[]; let pp=null, pi=null;
  for(const d of days){ const p=pb.at(sym,d), i=pb.at('EGX30CAPPED',d); if(p==null||i==null) continue; if(pp!=null){ xs.push(i/pi-1); ys.push(p/pp-1); } pp=p; pi=i; }
  if(xs.length<40) return null;
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length; let c=0,v=0; xs.forEach((x,k)=>{ c+=(x-mx)*(ys[k]-my); v+=(x-mx)**2; });
  return {beta:v?c/v:null, vol:Math.sqrt(ys.reduce((a,y)=>a+(y-my)**2,0)/(ys.length-1)*250), n:xs.length};
}
function holdingRisk(){
  const R=S.R, pb=pbook(), cash=R.liveCash??R.settings.cash, tot=R.pos.mvTotal+Math.max(0,cash);
  return R.pos.open.filter(r=>r.mv).map(r=>{
    const sym=r.symbol; const b=sym&&pb.has(sym)?betaOf(pb,sym):null;
    let high=null; if(sym&&pb.has(sym)) for(const d of pb.days){ if(d<r.firstBuy) continue; const p=pb.at(sym,d); if(p!=null&&(high==null||p>high)) high=p; }
    if(r.price!=null&&(high==null||r.price>high)) high=r.price;
    return {sym:sym||r.name, name:r.name, w:r.mv/tot, mv:r.mv, beta:b?b.beta:null, vol:b?b.vol:null, unreal:r.unreal, unrealPct:r.openCost?r.unreal/r.openCost:null, price:r.price, high, fromHigh:high&&r.price!=null?r.price/high-1:null};
  }).sort((a,b)=>b.w-a.w);
}
function downMonths(){
  const R=S.R, pb=pbook(), ledger=R.ledger, today=PE.cairoToday(), tx=allTx(), price=PA.makePricer(S.assets,ledger,pb);
  return R.months.filter(r=>r.has&&r.bench!=null&&r.bench<0).map(r=>{
    const start=PE.eom(PE.addMonths(r.month,-1)), end=r.live?today:PE.eom(r.month); const H=PA.holdingsAt(ledger,S.assets,pb,start); const tot=H.mv+Math.max(0,H.cash);
    const rows=H.rows.filter(h=>h.shares>0.5).map(h=>{ const p0=price(h.name,start), p1=price(h.name,end); if(!p0||!p1||!p0.p) return null; return {sym:h.symbol||h.name, w:tot?h.mv/tot:0, ret:p1.p/p0.p-1, contrib:tot?h.shares*(p1.p-p0.p)/tot:0}; }).filter(Boolean).sort((a,b)=>a.contrib-b.contrib);
    const buys=tx.filter(t=>t.t==='Buy'&&t.d>start&&t.d<=end).length, sells=tx.filter(t=>t.t==='Sell'&&t.d>start&&t.d<=end).length;
    return {month:r.month, live:r.live, ret:r.ret, bench:r.bench, diff:r.ret-r.bench, cashPct:tot?Math.max(0,H.cash)/tot:0, rows, buys, sells};
  });
}
function whyText(d){ const bad=d.rows.filter(x=>x.contrib<0).slice(0,2); if(!bad.length) return d.diff>=0?'Nothing fell much; the portfolio held up.':'Losses were spread across many stocks.';
  const w=bad.reduce((s,x)=>s+x.w,0);
  if(d.diff>=0){ const good=d.rows.filter(x=>x.contrib>0).sort((a,b)=>b.contrib-a.contrib)[0]; return `Held up${good?`: ${good.sym} ${pct(good.ret,0)} offset ${bad.map(x=>`${x.sym} ${pct(x.ret,0)}`).join(' and ')}`:''}.`; }
  return `${bad.map(x=>`${x.sym} ${pct(x.ret,0)}`).join(' and ')} ${bad.length>1?'were':'was'} ${pct(w,0,false)} of the portfolio${d.cashPct<0.02?', with no cash to cushion it':''}${d.buys>=8?`; ${d.buys} buys were made as it fell`:''}.`; }
function vAnalysis(){
  const R=S.R, st=R.stats, dm=downMonths(), H=holdingRisk(), cash=R.liveCash??R.settings.cash, tot=R.pos.mvTotal+Math.max(0,cash);
  const up=R.months.filter(r=>r.has&&r.bench>0), dn=R.months.filter(r=>r.has&&r.bench<0);
  const chain=(rows,k)=>rows.reduce((a,r)=>a*(1+r[k]),1)-1; const upC=up.length?chain(up,'ret')/chain(up,'bench'):null, dnC=dn.length?chain(dn,'ret')/chain(dn,'bench'):null;
  const top3=H.slice(0,3).reduce((s,h)=>s+h.w,0);
  return `
  ${analysisPanel({R,st,dm,H,cash,tot,up,dn,upC,dnC,top3})}

    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
      ${kpi('In up months you captured', upC!=null?pct(upC,0,false):'—', 'of the index gain · above 100% is good')}
      ${kpi('In down months you took', dnC!=null?`<span class="${dnC>1?'neg':'pos'}">${pct(dnC,0,false)}</span>`:'—', 'of the index loss · under 100% is better')}
      ${kpi('Your portfolio beta', num(st.beta), 'monthly, vs EGX30 Capped · 1.0 = moves with the index')}
      ${kpi('Cash today', pct(tot?Math.max(0,cash)/tot:0,1,false), `${egp(cash)} EGP · top three stocks are ${pct(top3,0,false)} of the portfolio`)}
    </div>
    <p class="note" style="margin-top:10px">${dnC!=null&&dnC>1?`You lose more than the index when it falls. The table below shows which months and which stocks did it.`:dnC!=null?`You lose less than the index when it falls.`:''}</p>
  </div>
  <div class="panel" data-testid="risk-downmonths"><div class="phead"><div><h2>When the index fell</h2><div class="sub">Each down month: how you did, what you held going in, and what did the damage</div></div></div>
    ${dm.length?`<div class="tbl"><table><thead><tr><th>Month</th><th class="n">Index</th><th class="n">You</th><th class="n">Difference</th><th class="n">Cash going in</th><th class="n">Trades</th><th>What did it</th></tr></thead><tbody>
    ${dm.map(d=>`<tr><td>${M(d.month)}${d.live?' <span class="pill prov">so far</span>':''}</td><td class="n neg">${pct(d.bench)}</td><td class="n ${sgn(d.ret)}">${pct(d.ret)}</td><td class="n ${sgn(d.diff)}">${pct(d.diff)}</td><td class="n">${pct(d.cashPct,1,false)}</td><td class="n">${d.buys} buys · ${d.sells} sells</td><td>${esc(whyText(d))}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="note">The index has not had a down month yet.</p>'}
  </div>
  <div class="panel" data-testid="risk-holdings"><div class="phead"><div><h2>Each holding's risk</h2><div class="sub">Beta and volatility from the last 12 months of daily closes · "from its high" is against the highest close since you first bought</div></div></div>
    <div class="tbl"><table><thead><tr><th>Stock</th><th class="n">Weight</th><th class="n">Beta</th><th class="n">Volatility</th><th class="n">Unrealized</th><th class="n">From its high</th></tr></thead><tbody>
    ${H.map(h=>`<tr><td><span class="sym">${esc(h.sym)}</span></td><td class="n">${pct(h.w,1,false)}</td><td class="n">${h.beta!=null?num(h.beta):'—'}</td><td class="n">${h.vol!=null?pct(h.vol,0,false):'—'}</td><td class="n ${sgn(h.unreal)}">${egp(h.unreal)} <span class="muted">${pct(h.unrealPct)}</span></td><td class="n ${h.fromHigh<-0.1?'neg':''}">${pct(h.fromHigh)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note" style="margin-top:10px">Beta: how much the stock moves for a 1% move in EGX30 Capped. Volatility: how wide its swings are over a year.</p>
  </div>`;
}

// The written review: what the numbers say, why, and what you could do about it. Suggestions only; nothing is tracked or enforced.
function analysisPanel(c){
  const {R,st,dm,H,cash,tot,up,dn,upC,dnC,top3}=c; const cashPct=tot?Math.max(0,cash)/tot:0; const G={cash:0.10,max:0.10,top3:0.30,high:0.15,beta:1.2};
  const over=H.filter(h=>h.w>G.max), excess=over.reduce((s,h)=>s+(h.w-G.max)*tot,0), cashAfter=tot?(Math.max(0,cash)+excess)/tot:0;
  const below=H.filter(h=>h.fromHigh!=null&&h.fromHigh<-G.high), hiB=H.filter(h=>h.beta!=null&&h.beta>G.beta), hiBw=hiB.reduce((s,h)=>s+h.w,0);
  const lost=dm.filter(d=>d.diff<0), n=st.n, turnover=st.n?st.sells/Math.max(1,(st.opening+st.closing)/2)*12/st.n:null;
  const winners=H.filter(h=>h.unreal>0).sort((a,b)=>b.unreal-a.unreal), losers=H.filter(h=>h.unreal<0).sort((a,b)=>a.unreal-b.unreal);
  const list=(arr,f)=>arr.map(f).join(', ');
  // 1. where you stand
  const stand=[`Since ${M(st.rows[0].month)} the portfolio has returned <b class="${sgn(st.twr)}">${pct(st.twr)}</b> against <b>${pct(st.benchTwr)}</b> for EGX30 Capped, so it is ${st.alpha>=0?'ahead of':'behind'} the index by <b>${pct(Math.abs(st.alpha),1,false)}</b>.`,
    upC!=null&&dnC!=null?`In the index's ${up.length} up months you captured ${pct(upC,0,false)} of its gains; in its ${dn.length} down months you took ${pct(dnC,0,false)} of its losses. ${dnC>1&&upC<1?'You are paid less on the way up and charged more on the way down, and that gap is most of the shortfall.':dnC<=1&&upC>=1?'You gain more than the index when it rises and lose less when it falls: that is what beating it looks like.':dnC<=1?'You hold up better than the index when it falls; the shortfall comes from lagging it in up months.':'You keep up in rising months but lose more than the index when it falls.'}`:'',
    `Money-weighted, your own capital has compounded at ${pct(st.xirr)} a year${st.realTwr!=null||st.realTwrPartial!=null?`, ${pct(st.realTwr??st.realTwrPartial)} after Egyptian inflation`:''}.`].filter(Boolean);
  // 2. why
  const why=[];
  if(lost.length) why.push(`The months that hurt were ${list(lost,d=>`${M(d.month)} (${pct(d.ret)} against ${pct(d.bench)})`)}. ${lost.map(d=>`${M(d.month)}: ${whyText(d)}`).join(' ')}`);
  why.push(`Today the three largest positions (${list(H.slice(0,3),h=>h.sym)}) are ${pct(top3,0,false)} of the portfolio and cash is ${pct(cashPct,1,false)}. ${top3>G.top3?'When one of those three has a bad month, the whole portfolio has a bad month; that is the mechanism behind the down-month numbers above.':'Concentration is moderate.'}${cashPct<0.02?' With no cash, nothing cushions a fall and there is nothing to buy a dip with except by selling something else.':''}`);
  if(hiB.length) why.push(`${list(hiB,h=>`${h.sym} (beta ${num(h.beta)})`)} ${hiB.length>1?'move':'moves'} more than the index and ${hiB.length>1?'are':'is'} ${pct(hiBw,0,false)} of the book, so on a bad index day the portfolio falls more than the index does.`);
  if(turnover!=null) why.push(`Turnover runs at about ${num(turnover,1)}× the portfolio's value a year (${st.trades} trades in the period). Every round trip costs fees and spread, and the Attribution section below shows whether trading during the month has added or cost you.`);
  // 3. what you could do
  const could=[];
  if(over.length) could.push(`<b>Bring each position to ${pct(G.max,0,false)} or less.</b> ${list(over,h=>`${h.sym} is ${pct(h.w,1,false)} (about ${egp((h.w-G.max)*tot)} EGP over)`)}. Trimming them all raises about ${egp(excess)} EGP and would put cash at ${pct(cashAfter,0,false)}. Sell winners and losers alike; selling only winners to keep funding losers is how losers become the largest positions.`);
  else could.push(`<b>Position sizes are already under ${pct(G.max,0,false)} each.</b> Keep new buys there.`);
  could.push(cashPct<G.cash?`<b>Hold about ${pct(G.cash,0,false)} cash</b> (${egp(G.cash*tot)} EGP at today's size). It softens a fall by roughly a tenth and, more importantly, it is what you buy a dip with instead of selling something at the bottom.`:`<b>Cash is at ${pct(cashPct,0,false)}</b>, which already gives you a cushion and dry powder.`);
  if(below.length) could.push(`<b>Make one decision on each stock well below its high.</b> ${list(below,h=>`${h.sym} is ${pct(h.fromHigh,0)} from its high (${h.unreal<0?'−':'+'}${egp(Math.abs(h.unreal))} EGP unrealized)`)}. For each, ask: would I buy it today at this price with fresh money? If yes, keep it at ${pct(G.max,0,false)} or less and write the reason in its note under Settings. If no, sell. Not deciding is what turns a −10% stock into a −20% one.`);
  if(hiB.length) could.push(`<b>Size the high-beta ${hiB.length>1?'names':'name'} smaller.</b> ${list(hiB,h=>h.sym)} can stay, but as ${hiB.length>1?'the smaller positions':'a smaller position'} rather than ${hiB.length>1?'the largest':'one of the largest'}.`);
  could.push(`<b>Three habits for every future buy:</b> buy only with cash, never by selling something else the same day; no buy takes a stock above ${pct(G.max,0,false)}; write the price at which you would be wrong (the stop field on each asset) before you buy, and act the week it is hit.`);
  if(turnover!=null&&turnover>2) could.push(`<b>Trade less.</b> One decision day a week and a calendar rebalance (monthly or quarterly, back to your target sizes) removes most reactive trades.`);
  could.push(`<b>Add ballast.</b> One or two low-beta dividend payers (telecom, food, utilities) or a slice in the Thndr savings fund so the whole book is not cyclicals and financials.`);
  could.push(`<b>Monthly, ten minutes, after the statement posts:</b> open this tab, read the first paragraph, check cash and the top three, and trim anything that drifted over ${pct(G.max,0,false)}.`);
  const expect = dnC!=null&&dnC>1 ? `Done this way, the down-month capture should drift toward 90–100% within a couple of down months, mostly from sizing. You give up a little in strong up months because ${pct(G.cash,0,false)} sits in cash and the winners are smaller; on your numbers the worst down month alone cost more against the index than a cash buffer costs in a year of average months.` : `The main thing to protect is the down-month record; keep sizes even and cash on hand and it should hold.`;
  return `<div class="panel brief" data-testid="analysis"><div class="phead"><div><h2>What the numbers say</h2><div class="sub">A written review of the portfolio as it stands today · guideline figures used here: ${pct(G.cash,0,false)} cash, ${pct(G.max,0,false)} per stock, ${pct(G.top3,0,false)} for the top three, a decision at ${pct(G.high,0,false)} below a stock's high · these are suggestions, nothing is tracked or enforced</div></div></div>
    <h3 class="eyebrow" style="margin-top:14px">Where you stand</h3><p>${stand.join(' ')}</p>
    <h3 class="eyebrow" style="margin-top:14px">Why</h3><p>${why.join(' ')}</p>
    <h3 class="eyebrow" style="margin-top:14px">What you could do</h3><ol style="margin:8px 0 0 20px;padding:0;display:grid;gap:8px;max-width:80ch;line-height:1.55">${could.map(x=>`<li>${x}</li>`).join('')}</ol>
    <h3 class="eyebrow" style="margin-top:14px">What to expect</h3><p>${expect}</p>
    ${winners.length||losers.length?`<p class="note" style="margin-top:10px">Unrealized today: ${winners.length?`winners ${list(winners.slice(0,3),h=>`${h.sym} +${egp(h.unreal)}`)}`:''}${winners.length&&losers.length?' · ':''}${losers.length?`losers ${list(losers.slice(0,3),h=>`${h.sym} −${egp(Math.abs(h.unreal))}`)}`:''} (EGP).</p>`:''}
  </div>`;
}

// ---------- events (delegated) ----------
document.addEventListener('click', async e=>{
  const sc=e.target.closest('[data-sec]'); if(sc){ e.preventDefault(); const el=document.getElementById('sec-'+sc.dataset.sec); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); try{ history.replaceState(null,'','#'+sc.dataset.sec); }catch(x){} } return; }
  const go=e.target.closest('[data-go]'); if(go){ setTab(go.dataset.go); return; }
  const del=e.target.closest('[data-del]');
  if(del){ if(del.dataset.arm!=='1'){ del.dataset.arm='1'; del.textContent='Confirm delete'; setTimeout(()=>{ if(del.isConnected){ del.dataset.arm=''; del.textContent='Delete'; } },4000); return; }
    const id=del.dataset.del; for(const y of Object.keys(S.ledgerDocs)){ const rows=S.ledgerDocs[y].rows||[]; if(rows.some(r=>r.id===id)){ await save(()=>S.db.doc('ledger/y'+y).set({rows:rows.filter(r=>r.id!==id)}),'Transaction deleted'); break; } } return; }
  const cf=e.target.closest('[data-confirm]');
  if(cf){ const m=cf.dataset.confirm; const r=S.R.months.find(x=>x.month===m); const patch={provisional:false};
    if(r&&r.live){ patch.cash=r.cash; patch.securities=Math.round(r.securities*100)/100; if(r.benchClose) patch.benchClose=r.benchClose; if(r.usdegp&&S.marks[m]?.usdegp==null) patch.usdegp=r.usdegp; }
    const cur=S.marks[m]||{}; await save(()=>S.db.doc('portfolio/marks').update({months:{[m]:{...cur,...patch}}}),`${M(m)} confirmed`); return; }
  if(e.target.id==='save-marks'){ const patch={}, typed={}; document.querySelectorAll('#main [data-m].dirty').forEach(inp=>{ const m=inp.dataset.m,f=inp.dataset.f; let v=inp.value.trim(); (patch[m] ||= {...(S.marks[m]||{})}); (typed[m] ||= new Set()).add(f);
      if(f==='note'){ if(v) patch[m].note=v; else delete patch[m].note; return; }
      if(v===''){ delete patch[m][f]; return; } let n=parseFloat(v); if(!isFinite(n)){ return; } if(f==='benchReturn'||f==='cpi') n=n/100; patch[m][f]=n; });
    if(!Object.keys(patch).length){ toast('Nothing changed'); return; }
    // Typing the two month-end figures for a closed month makes it a confirmed typed row, so it wins over the month-close estimate.
    // Only the cash/securities inputs the owner actually edited count (patch[m] is seeded from the stored row, which may already
    // hold placeholder numbers): both typed in this save, or one typed to a value that differs from the stored one. Editing any
    // other cell of the row (CPI, USD/EGP, EGX %, note) leaves it provisional so the estimate keeps standing in.
    const curM=PE.monthOf(PE.cairoToday()); Object.keys(patch).forEach(m=>{ const p=patch[m], was=S.marks[m]||{}, ty=typed[m];
      if(!(m<curM && p.provisional && typeof p.cash==='number' && typeof p.securities==='number')) return;
      const both=ty.has('cash')&&ty.has('securities'), changed=['cash','securities'].some(f=>ty.has(f)&&p[f]!==was[f]);
      if(both||changed){ p.provisional=false; delete p.estimate; } });
    const all={...S.marks,...patch}; await save(()=>S.db.doc('portfolio/marks').set({months:all}),'Month-end marks saved'); return; }
  if(e.target.id==='save-assets'){ const patch={}; document.querySelectorAll('#main [data-a].dirty').forEach(inp=>{ const a=inp.dataset.a,f=inp.dataset.f; const v=inp.value.trim(); (patch[a] ||= {...(S.assets[a]||{name:a})});
      if(f==='symbol'||f==='sector'||f==='priceDate'){ if(v) patch[a][f]= f==='symbol'?v.toUpperCase():v; else delete patch[a][f]; return; }
      if(v===''){ delete patch[a][f]; return; } const n=parseFloat(v); if(isFinite(n)) patch[a][f]=n; });
    if(!Object.keys(patch).length){ toast('Nothing changed'); return; }
    await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,...patch}}),'Assets saved'); return; }
  if(e.target.id==='csv-preview'){ const msg=$('#csv-msg'); let parsed; try{ parsed=parseCsv($('#csv-in').value).map(normTx); }catch(err){ msg.textContent=err.message; msg.className='note neg'; csvPending=null; return; }
    const have=new Set(allTx().map(txKey)); const fresh=parsed.filter(t=>!have.has(txKey(t))); const dup=parsed.length-fresh.length;
    csvPending=fresh; msg.className='note'; msg.innerHTML=`${fresh.length} new row${fresh.length===1?'':'s'}${dup?`, ${dup} duplicate${dup>1?'s':''} skipped`:''}. ${fresh.length?`<button class="btn sm primary" id="csv-import" data-testid="csv-import">Import ${fresh.length}</button>`:''}`; return; }
  if(e.target.id==='csv-import'&&csvPending){ const n=csvPending.length; if(await addTx(csvPending)){ toast(`${n} transactions imported`); csvPending=null; } return; }
  if(e.target.id==='dl-ledger'){ const rows=[['Date','Type','Asset','Symbol','Shares','Price','Amount','CostBasisSold','Account']].concat(S.R.ledger.map(t=>[t.d,t.t,t.a||'',(S.assets[t.a]||{}).symbol||'',t.q??'',t.p??'',t.amt,t.t==='Sell'?t.basis.toFixed(2):'',t.acc||''])); download('portfolio-ledger.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-holdings'){ const rows=[['Symbol','Asset','Sector','Shares','AvgCost','Price','PriceDate','MarketValue','Unrealized','Dividends','TotalPL','Weight']].concat(S.R.pos.open.map(r=>[r.symbol,r.name,r.sector,r.open,r.avgCost?.toFixed(4),r.price,r.priceDate,r.mv?.toFixed(2),r.unreal?.toFixed(2),r.divs.toFixed(2),r.total.toFixed(2),r.weight.toFixed(6)])); download('portfolio-holdings.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-monthly'){ const st=S.R.stats; const rows=[['Month','Opening','NetFlow','WeightedFlow','Dividends','MonthEndValue','Return','EGX30Capped','Alpha','CumReturn','CumBench','Drawdown','USDReturn','RealReturn','Status']].concat(st.rows.map(r=>[r.month,r.opening,r.netFlow,r.weightedFlow,r.dividends,r.value,r.ret,r.bench,r.alpha,r.pCum,r.pBench,r.dd,r.usdRet,r.realRet,r.live?'live':r.estimate?'estimate':r.provisional?'provisional':'confirmed'])); download('portfolio-monthly.csv', toCsv(rows)); return; }
  if(e.target.id==='dl-backup'){ download('portfolio-backup.json', JSON.stringify({exported:new Date().toISOString(), ...dataset(), history:S.history},null,1)); return; }
  if(e.target.id==='refresh-prices'){ refreshNow(e.target); return; }
  if(e.target.id==='scan-gmail'){ scanGmail(false); return; }
  const rvb=e.target.closest('[data-review]'); if(rvb){ const it=S.stmt.list.find(x=>x.month===rvb.dataset.review); if(it) reviewStatement(it); return; }
  if(e.target.id==='review-close'){ S.stmt.review=null; renderTab(true); return; }
  if(e.target.id==='post-statement'){ postStatement(); return; }
  if(e.target.id==='fs-xlsx'){ const b=e.target, m=b.dataset.month; b.disabled=true; b.textContent='Preparing…'; try{ const list=await window.pdExports(); if(!list.some(x=>x.month===m)){ const have=list.map(x=>M(x.month)).join(', '); toast(`No Excel workbook for ${M(m)} yet. Workbooks are published with each monthly statement${have?` (available: ${have})`:''}.`,'error'); } else { await window.pdDownloadExport(m); toast(`Excel workbook for ${M(m)} saved`); } }catch(err){ toast('Could not download the workbook: '+(err.message||err),'error'); } b.disabled=false; b.textContent='Download Excel'; return; }
  if(e.target.id==='fs-email'){ e.target.disabled=true; await emailFactsheet(S.fsMonth); e.target.disabled=false; return; }
  if(e.target.id==='fs-dl'){ const F=factsheetData(S.fsMonth); download(`factsheet-${S.fsMonth}.html`, `<!doctype html><html><head><meta charset="utf-8"><title>${esc(S.settings.name)} factsheet ${M(S.fsMonth)}</title></head><body style="margin:0;padding:16px;background:#EDF2EF">${factsheetHTML(F)}</body></html>`); return; }
});
document.addEventListener('input', e=>{ if(e.target.matches('.grid-in input')) e.target.classList.add('dirty');
  if(['lf-q'].includes(e.target.id)){ S.ledgerFilter.q=e.target.value; clearTimeout(vLedger._t); vLedger._t=setTimeout(()=>{ const pos=e.target.selectionStart; renderTab(true); const el=$('#lf-q'); if(el){ el.focus(); el.setSelectionRange(pos,pos);} },250); }
  if(e.target.id==='tx-q'||e.target.id==='tx-p'){ const q=parseFloat($('#tx-q').value), p=parseFloat($('#tx-p').value); if(isFinite(q)&&isFinite(p)) $('#tx-hint').textContent=`Gross ${egp(q*p,2)} EGP. Enter the net amount from the statement, which includes commission.`; } });
document.addEventListener('change', e=>{ if(e.target.dataset.pick!=null&&S.stmt.review){ S.stmt.review.pick[+e.target.dataset.pick]=e.target.checked; } if(e.target.dataset.use!=null&&S.stmt.review){ S.stmt.review.use[+e.target.dataset.use]=e.target.checked; } if(e.target.id==='apply-marks'&&S.stmt.review){ S.stmt.review.applyMarks=e.target.checked; } if(e.target.id==='fs-month'){ S.fsMonth=e.target.value; renderTab(true); } if(e.target.id==='lf-type'){ S.ledgerFilter.type=e.target.value; renderTab(true); } if(e.target.id==='lf-year'){ S.ledgerFilter.year=e.target.value; renderTab(true); } });
document.addEventListener('submit', async e=>{
  e.preventDefault();
  if(e.target.id==='tx-form'){ let t; try{ t=normTx({d:$('#tx-d').value,t:$('#tx-t').value,a:$('#tx-a').value,q:$('#tx-q').value,p:$('#tx-p').value,amt:$('#tx-amt').value,acc:$('#tx-acc').value}); }catch(err){ toast(err.message,'error'); return; }
    if(t.a && !S.assets[t.a] && (t.t==='Buy')) toast(`"${t.a}" is a new asset. Add its symbol under Inputs so it gets priced.`);
    if(await addTx([t])){ toast(`${t.t} added`); e.target.reset(); } }
  if(e.target.id==='asset-form'){ const name=$('#na-name').value.trim(); if(!name) return; if(S.assets[name]){ toast('That asset already exists','error'); return; }
    const a={name}; const sym=$('#na-sym').value.trim().toUpperCase(); const sec=$('#na-sec').value.trim(); if(sym) a.symbol=sym; if(sec) a.sector=sec;
    await save(()=>S.db.doc('portfolio/assets').set({items:{...S.assets,[name]:a}}),`${name} added; it will be priced at the next run`); }
  if(e.target.id==='settings-form'){ const g=id=>$(id).value; const n=id=>parseFloat($(id).value);
    const s={...S.settings, name:g('#st-name').trim()||'Portfolio', inception:g('#st-inc')||S.settings.inception, openingValue:n('#st-open'), cash:n('#st-cash'), cashDate:g('#st-cashd')||null, riskFree:n('#st-rf')/100, fxStart:n('#st-fx'), volLow:n('#st-vl')/100, volHigh:n('#st-vh')/100, openThreshold:n('#st-thr'), staleDays:n('#st-stale'), priceDate:g('#st-pd')||null, factsheetEmail:g('#st-email').trim()||null, benchCloseStart:isFinite(n('#st-bcs'))?n('#st-bcs'):null, account:{holder:g('#st-holder').trim(), unifiedCode:g('#st-ucode').trim()}};
    if(!s.account.holder && !s.account.unifiedCode){ toast('Set the Thndr account holder: statements and invoices are only accepted for that account','error'); return; }
    if(['openingValue','cash','riskFree','fxStart','volLow','volHigh','openThreshold','staleDays'].some(k=>!isFinite(s[k]))){ toast('Every number field needs a value','error'); return; }
    await save(()=>S.db.doc('portfolio/settings').set(s),'Settings saved'); }
});
function toCsv(rows){ return rows.map(r=>r.map(v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(',')).join('\n'); }
async function download(filename, data){ const dl=await window.claude?.use?.('downloads'); if(!dl){ toast('Downloads are not available in this view','error'); return; }
  try{ await dl.save({filename, data}); }catch(e){ if(e&&e.code!=='declined') toast('Download failed: '+(e.message||e.code),'error'); } }
async function refreshNow(btn){ if(window.pdRefreshPrices) return window.pdRefreshPrices(btn, toast); const mcp=await window.claude?.use?.('mcp'); if(!mcp){ toast('Refreshing from the page is not available here. Prices update automatically after each session.','error'); return; }
  btn.disabled=true; btn.textContent='Starting…';
  try{ await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:REFRESH_TRIGGER_ID},{cache:false}); toast('Price refresh started. New prices arrive in about two minutes.'); btn.textContent='Refresh started'; }
  catch(e){ toast('Could not start the refresh: '+(e.message||e.code),'error'); btn.disabled=false; btn.textContent='Refresh now'; } }

// ---------- boot ----------
(async function boot(){
  const db = await (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
  if(!db){ $('#main').innerHTML=`<div class="empty"><h2>Open this page in Claude to see your portfolio</h2><p>Your portfolio data lives in this page's private database, which only loads inside the Claude viewer.</p></div>`; $('#tape').innerHTML='<span class="muted">Market data unavailable in this view</span>'; return; }
  S.db=db;
  const onErr=(e)=>{ console.error(e); toast('Lost connection to the portfolio database. Reload the page.','error'); };
  db.doc('portfolio/settings').onSnapshot(s=>{ S.settings=s.exists?s.data():null; S.ready.settings=true; schedule(); }, onErr);
  db.doc('portfolio/marks').onSnapshot(s=>{ S.marks=(s.exists&&s.data().months)||{}; S.ready.marks=true; schedule(); }, onErr);
  db.doc('portfolio/assets').onSnapshot(s=>{ S.assets=(s.exists&&s.data().items)||{}; S.ready.assets=true; schedule(); }, onErr);
  db.collection('ledger').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id.replace(/^y/,'')]=d.data(); }); S.ledgerDocs=o; S.ready.ledger=true; schedule(); }, onErr);
  db.doc('market/latest').onSnapshot(s=>{ S.market=s.exists?s.data():null; S.ready.market=true; schedule(); }, onErr);
  db.collection('history').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=d.data(); }); S.history=o; schedule(); }, onErr);
  db.doc('bench/egx30').onSnapshot(s=>{ S.bench=s.exists?s.data():null; schedule(); }, onErr);
  db.collection('imports').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=d.data(); }); S.imports=o; schedule(); }, onErr);
  db.doc('sync/state').onSnapshot(s=>{ S.sync=s.exists?s.data():null; schedule(); }, onErr);
  setTimeout(autoScan, 2500);
})();
})();
